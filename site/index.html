"Errada. A exoneração não é imediata, porque a lei fixa um período de transição. O art. 819 do CC (sem interpretação extensiva) não afasta o prazo legal.", "Errada. Pela Lei 8.245, salvo disposição contratual em contrário, a garantia se estende até a efetiva devolução do imóvel, mesmo na prorrogação (art. 39). Isso não retira o direito do fiador de se exonerar na locação por prazo indeterminado (art. 40, X)."], "c": 0, "base": "Lei 8.245/1991, arts. 39 e 40, X; CC, arts. 819 e 835.", "dica": "Fiança comum (CC, art. 835): 60 dias. Locação urbana (Lei 8.245, art. 40, X): 120 dias. A FGV coloca os dois números nas alternativas.", "id": "i-70a98de9", "cod": "CIV-0002"}, {"n": 27, "disc": "Direito Civil", "tema": "Tutela x guarda de adolescente", "item": "V19 Família e sucessões", "nivel": "médio", "origem": "ENAM 2025.2 – Q55", "enun": "Maria Clara, atualmente com 13 anos, foi abandonada pela mãe nos primeiros meses de vida. Desde então, vivia sob a guarda unilateral de seu pai, formalizada judicialmente, em que pese não ter havido a perda do poder familiar da mãe. Recentemente, seu pai faleceu de forma repentina. Seu irmão mais velho, Lucas, de 27 anos, deseja assumir a responsabilidade legal pela irmã, com quem já reside, visando garantir a sua estabilidade emocional, a continuidade do cuidado e a devida representação legal e patrimonial. Diante dessa situação, à luz da legislação vigente, assinale a afirmativa correta.", "alts": ["Lucas poderá obter a guarda unilateral da irmã, com poderes plenos de representação e administração dos bens, independentemente da decretação da perda do poder familiar da mãe, pois o abandono configura causa automática de destituição.", "A concessão da guarda a Lucas não poderá incluir poderes de representação legal da irmã, sendo necessário que ele promova a sua adoção ou a nomeação como curador especial, mesmo que a mãe esteja ausente e o pai tenha falecido.", "A guarda unilateral poderá ser deferida a Lucas, mas não o habilita a tomar decisões escolares ou médicas relevantes em nome da irmã, sendo essas prerrogativas exclusivas do responsável legal investido de tutela ou da autoridade judicial.", "A guarda concedida a Lucas poderá perdurar até a maioridade da irmã, mas não lhe confere legitimidade para gerir o patrimônio da adolescente, salvo se houver posterior deferimento da tutela ou autorização expressa da autoridade judiciária.", "Lucas poderá requerer a tutela da irmã, desde que haja prévia decretação judicial da perda ou suspensão do poder familiar da mãe, hipótese em que assumirá os deveres de guarda, representação e administração de bens."], "coms": ["Errada. O abandono não gera destituição automática: a perda do poder familiar exige decisão judicial em procedimento contraditório (CC, art. 1.638; ECA, art. 24).", "Errada. A guarda pode, excepcionalmente, conferir representação para atos determinados (ECA, art. 33, §2º). Além disso, o caminho adequado é a tutela, e não necessariamente a adoção.", "Errada. A guarda obriga à assistência material, moral e educacional (ECA, art. 33), o que inclui decisões do cotidiano. A assertiva restringe demais os seus efeitos.", "Errada. É incompleta: o instituto que confere representação e administração de bens é a tutela, que exige prévia perda ou suspensão do poder familiar da mãe. Não se trata de mera 'autorização expressa'.", "CORRETA. A tutela pressupõe falecimento ou ausência dos pais ou perda ou suspensão do poder familiar (CC, art. 1.728; ECA, art. 36, parágrafo único). Como a mãe continua titular do poder familiar, é preciso antes a destituição ou suspensão. Deferida a tutela, Lucas assume guarda, representação e administração dos bens (CC, arts. 1.740 e 1.741)."], "c": 4, "base": "CC, arts. 1.638, 1.728, 1.740 e 1.741; ECA, arts. 24, 33 e 36.", "dica": "Guarda regulariza a posse de fato. Tutela substitui o poder familiar e exige que nenhum dos pais o exerça.", "id": "F2025.2-55", "cod": "FGV 2025.2-Q55"}, {"n": 28, "disc": "Direito Civil", "tema": "Perda de uma chance", "item": "V09 Responsabilidade civil", "nivel": "médio", "origem": "Inédita", "enun": "Tânia contratou o advogado Sérgio para recorrer de sentença que julgou improcedente seu pedido de indenização de R$ 200.000,00. Sérgio perdeu o prazo da apelação, e a sentença transitou em julgado. Tânia ajuizou ação contra Sérgio, pedindo a condenação dele ao pagamento dos R$ 200.000,00 que deixou de receber. Restou demonstrado que havia jurisprudência favorável à tese de Tânia no tribunal competente, embora não pacífica.\nSobre a pretensão de Tânia, assinale a afirmativa correta.", "alts": ["A indenização deve corresponder exclusivamente aos honorários pagos a Sérgio, por se tratar de inadimplemento contratual.", "Aplica-se a teoria da perda de uma chance, sendo devida indenização proporcional à probabilidade séria e real de êxito do recurso, e não o valor integral que Tânia pretendia obter na ação originária.", "Sérgio deve indenizar o valor integral de R$ 200.000,00, pois sua conduta foi a causa direta do trânsito em julgado desfavorável.", "A responsabilidade de Sérgio é objetiva, por se tratar de prestação de serviços regida pelo Código de Defesa do Consumidor.", "Não há dever de indenizar, pois a vitória no recurso era incerta, e o dano hipotético não é indenizável."], "coms": ["Errada. A restituição dos honorários não esgota o dano: a chance perdida tem valor econômico próprio.", "CORRETA. O STJ adota a perda de uma chance quando a chance é séria e real. O dano indenizável é a chance perdida, com valor proporcional à probabilidade de êxito, e não o benefício final esperado. O advogado responde subjetivamente (CDC, art. 14, §4º; EAOAB, art. 32).", "Errada. Não há certeza de que o recurso seria provido, e indenizar o valor integral equivaleria a presumir a vitória. O que se indeniza é a chance.", "Errada. A responsabilidade do profissional liberal é subjetiva (CDC, art. 14, §4º). Além disso, o STJ tem precedentes afastando o CDC da relação advogado-cliente.", "Errada. A chance séria e real é dano certo e autônomo, ainda que o resultado final fosse incerto. Só a chance meramente hipotética não se indeniza."], "c": 1, "base": "CC, arts. 186, 402, 403 e 927; CDC, art. 14, §4º; Lei 8.906/1994, art. 32; jurisprudência do STJ sobre perda de uma chance.", "dica": "Perda de uma chance não é lucro cessante nem dano hipotético. É uma terceira categoria: a chance séria e real, valorada pela probabilidade de êxito.", "id": "i-04dd4a23", "cod": "CIV-0003"}, {"n": 29, "disc": "Direito Civil", "tema": "Vícios redibitórios — prazos", "item": "V07 Teoria geral dos contratos", "nivel": "difícil", "origem": "Inédita", "enun": "Em 5 de janeiro, Júlio adquiriu de Paula, particular, um veículo usado, recebendo-o na mesma data. Em 20 de abril, o motor apresentou defeito grave. A perícia constatou que se tratava de vício oculto preexistente à venda que, por sua natureza, só poderia ser percebido com o uso prolongado do veículo. Em 10 de maio, Júlio ajuizou ação redibitória.\nSobre a pretensão de Júlio, assinale a afirmativa correta.", "alts": ["A ação é tempestiva, pois o prazo para reclamar de vícios redibitórios é prescricional de 3 anos.", "A ação é intempestiva, pois o prazo de 30 dias se reduz à metade quando o adquirente já estava na posse do bem.", "A ação é tempestiva, pois o prazo decadencial para bens móveis é de 90 dias, contado da ciência do vício.", "A ação é intempestiva, pois o prazo de 30 dias para bens móveis conta-se da entrega efetiva da coisa.", "A ação é tempestiva, pois, quando o vício só puder ser conhecido mais tarde, o prazo de 30 dias conta do momento em que o adquirente dele tiver ciência, até o prazo máximo de 180 dias, em se tratando de bem móvel."], "coms": ["Errada. O prazo é decadencial (art. 445) e não se confunde com o da pretensão indenizatória.", "Errada. A redução à metade só ocorre quando o adquirente já estava na posse ANTES da alienação, contando-se então da alienação (art. 445, caput, parte final). Não é o caso.", "Errada. Os 90 dias são do CDC (art. 26, II), para produto durável em relação de consumo. Aqui a venda é entre particulares e rege-se pelo CC.", "Errada. Essa é a regra geral (art. 445, caput), mas o §1º traz regra própria para o vício que, por sua natureza, só se conhece mais tarde.", "CORRETA. Art. 445, §1º, do CC: o vício que só pode ser conhecido mais tarde tem o prazo contado da ciência, até 180 dias para móveis (e 1 ano para imóveis). A ciência ocorreu em 20/4, dentro dos 180 dias contados de 5/1, e a ação foi ajuizada em 20 dias."], "c": 4, "base": "CC, arts. 441 a 446; CDC, art. 26.", "dica": "Prazos do art. 445: móvel 30 dias e imóvel 1 ano, contados da entrega; vício que só se conhece depois, contado da ciência, com teto de 180 dias (móvel) ou 1 ano (imóvel); posse anterior, prazo pela metade contado da alienação.", "id": "i-9d1a00ce", "cod": "CIV-0004"}, {"n": 30, "disc": "Direito Civil", "tema": "Ausência", "item": "V02 Pessoas naturais/personalidade/capacidade", "nivel": "fácil", "origem": "Inédita", "enun": "Roberto desapareceu de seu domicílio sem deixar notícias e sem deixar representante ou procurador para administrar seus bens. A requerimento de sua esposa, o juiz declarou a ausência, nomeou curador e determinou a arrecadação dos bens.\nSobre as fases subsequentes, assinale a afirmativa correta.", "alts": ["Os herdeiros imitidos na posse dos bens, na sucessão provisória, não precisam prestar garantia, ainda que não sejam ascendentes, descendentes ou cônjuge.", "Com a abertura da sucessão provisória, o casamento de Roberto se dissolve automaticamente.", "A sucessão definitiva poderá ser requerida dois anos após o trânsito em julgado da sentença que concedeu a abertura da sucessão provisória.", "Decorrido um ano da arrecadação dos bens, os interessados poderão requerer que se declare a ausência e se abra provisoriamente a sucessão.", "A sucessão provisória poderá ser requerida decorridos três anos da arrecadação dos bens, independentemente de o ausente ter deixado representante."], "coms": ["Errada. Os herdeiros que não sejam ascendentes, descendentes ou cônjuge devem dar garantia da restituição dos bens (art. 30, §2º).", "Errada. O casamento se dissolve pela presunção de morte do ausente, que ocorre com a abertura da sucessão DEFINITIVA (arts. 6º e 1.571, §1º).", "Errada. O prazo é de 10 anos após o trânsito em julgado da sentença da sucessão provisória (art. 37).", "CORRETA. Art. 26 do CC: um ano da arrecadação dos bens, ou, se o ausente deixou representante ou procurador, três anos.", "Errada. Os 3 anos se aplicam quando o ausente deixou representante ou procurador. Sem representante, o prazo é de 1 ano."], "c": 3, "base": "CC, arts. 6º, 22 a 39 e 1.571, §1º.", "dica": "Números da ausência: 1 ano (sem representante) ou 3 anos (com representante) para a provisória; 10 anos depois para a definitiva; ou 80 anos de idade com 5 anos sem notícias (art. 38).", "id": "i-258561c3", "cod": "CIV-0005"}, {"n": 31, "disc": "Direito Empresarial", "tema": "Aval parcial em título regido por lei especial", "item": "E03 Títulos de crédito/protesto", "nivel": "difícil", "origem": "Inédita", "enun": "Tiago emitiu nota promissória no valor de R$ 100.000,00 em favor de Rafael. Lucas, seu amigo, lançou aval no título, com a expressão 'por aval, até R$ 40.000,00', seguida de sua assinatura. Vencido e não pago o título, Rafael executou Tiago e Lucas, pretendendo receber deste a totalidade do valor, ao argumento de que o Código Civil veda o aval parcial.\nSobre a hipótese, assinale a afirmativa correta.", "alts": ["O aval é inválido por falta de outorga conjugal, que é exigida para qualquer aval prestado por pessoa casada.", "O aval parcial é válido, pois a nota promissória é regida pela Lei Uniforme de Genebra, que o admite, aplicando-se a vedação do Código Civil apenas aos títulos atípicos ou sem disciplina legal específica; Lucas responde até R$ 40.000,00.", "O aval parcial é nulo e, por isso, Lucas não responde por qualquer valor.", "O aval é válido, mas Lucas só responde após o esgotamento do patrimônio de Tiago, em razão do benefício de ordem.", "O aval parcial é nulo, por expressa vedação do Código Civil, devendo ser considerado como aval total, de modo que Lucas responde pelos R$ 100.000,00."], "coms": ["Errada. O enunciado não informa que Lucas é casado. Além disso, o STJ entende que a outorga do art. 1.647, III, do CC não se aplica aos títulos de crédito típicos regidos por lei especial.", "CORRETA. O CC veda o aval parcial (art. 897, parágrafo único), mas o art. 903 manda aplicar as disposições do Código apenas quando não houver lei especial. A LUG (art. 30, aplicável à nota promissória por força do art. 77) admite expressamente o aval parcial.", "Errada. O aval parcial é válido na LUG.", "Errada. O aval é obrigação autônoma e solidária, sem benefício de ordem (LUG, arts. 32 e 47). O benefício de ordem é próprio da fiança.", "Errada. A vedação do CC não se aplica aos títulos regidos por lei especial (art. 903). A conversão em aval total não tem amparo legal."], "c": 1, "base": "CC, arts. 897, parágrafo único, e 903; LUG (Decreto 57.663/1966), arts. 30, 32, 47 e 77.", "dica": "Na dúvida entre CC e LUG para títulos típicos (letra, nota promissória, cheque, duplicata), lembre que o art. 903 do CC dá preferência à lei especial.", "id": "i-32f6dc7a", "cod": "EMP-0001"}, {"n": 32, "disc": "Direito Empresarial", "tema": "Créditos não sujeitos à recuperação judicial", "item": "E10 Recuperação/falência", "nivel": "fácil", "origem": "ENAM 2026.1 – Q65", "enun": "XYZ ofereceu objeção ao plano de recuperação judicial apresentado pela sociedade empresária Jauru, Jangada & Cia Ltda. sob o argumento de ilegalidade da inclusão do seu crédito no plano, que não se sujeita aos efeitos do instituto. A objeção será procedente se ficar constatado que o crédito é titularizado por credor", "alts": ["hipotecário.", "trabalhista.", "pignoratício.", "de arrendamento mercantil.", "empreendedor de shopping center."], "coms": ["Errada. O credor hipotecário (garantia real) se sujeita à recuperação judicial, na classe II (art. 41, II).", "Errada. O crédito trabalhista se sujeita à recuperação, na classe I, com regras de pagamento próprias (art. 54).", "Errada. O credor pignoratício também tem garantia real e se sujeita à recuperação.", "CORRETA. O crédito do arrendador mercantil não se sujeita aos efeitos da recuperação judicial, assim como o do proprietário fiduciário, do promitente vendedor com cláusula de irrevogabilidade e do vendedor com reserva de domínio (Lei 11.101, art. 49, §3º).", "Errada. Não há exceção legal para o empreendedor de shopping center: seu crédito de aluguéis é concursal."], "c": 3, "base": "Lei 11.101/2005, arts. 41, 49, §3º, e 54.", "dica": "Mnemônico para o art. 49, §3º: 'FARR' — Fiduciário, Arrendador mercantil, promitente com iRrevogabilidade, Reserva de domínio. Some o ACC do §4º.", "id": "F2026.1-65", "cod": "FGV 2026.1-Q65"}, {"n": 33, "disc": "Direito Penal", "tema": "Lei penal no tempo — crime permanente (Súmula 711/STF)", "item": "D01-03 Princípios/lei penal no tempo e espaço", "nivel": "médio", "origem": "Inédita", "enun": "Wesley sequestrou a vítima em 10 de janeiro, mantendo-a em cativeiro. Em 1º de fevereiro, entrou em vigor lei que aumentou a pena do crime de sequestro e cárcere privado. A vítima foi libertada pela polícia em 15 de fevereiro, quando Wesley foi preso em flagrante.\nSobre a lei aplicável, assinale a afirmativa correta.", "alts": ["Aplica-se a lei nova apenas ao período posterior à sua vigência, devendo o juiz fracionar a pena proporcionalmente aos dias de cativeiro em cada período.", "Aplica-se uma combinação das duas leis, com a pena da lei anterior e o regime da lei nova, conforme o que for mais favorável.", "Aplica-se a lei anterior, pois a lei penal mais grave nunca retroage, nos termos do art. 5º, XL, da Constituição.", "Aplica-se a lei anterior, pois o tempo do crime é o momento da ação, e a privação da liberdade teve início em 10 de janeiro.", "Aplica-se a lei nova, mais grave, pois o crime permanente se protrai no tempo e a lei entrou em vigor antes da cessação da permanência."], "coms": ["Errada. Não existe fracionamento: o crime permanente é único, e incide a lei vigente ao tempo da cessação da permanência.", "Errada. A combinação de leis (lex tertia) é vedada pelo STJ (Súmula 501, em matéria de drogas) e pela jurisprudência majoritária. De todo modo, não há o que combinar aqui.", "Errada. Não há retroatividade: a lei nova incide sobre conduta que ainda estava sendo praticada na sua vigência.", "Errada. A teoria da atividade (art. 4º) vale, mas no crime permanente a ação se prolonga enquanto dura a permanência.", "CORRETA. Súmula 711/STF: a lei penal mais grave aplica-se ao crime continuado ou ao crime permanente se a sua vigência é anterior à cessação da continuidade ou da permanência. A permanência só cessou em 15/2."], "c": 4, "base": "CF, art. 5º, XL; CP, arts. 2º, 4º e 148; Súmulas 711/STF e 501/STJ.", "dica": "Crime permanente ou continuado se rege pela lei vigente quando cessa a permanência ou a continuidade, ainda que mais grave (Súmula 711).", "id": "i-bcc7c9ac", "cod": "PEN-0001"}, {"n": 34, "disc": "Direito Penal", "tema": "Roubo com simulacro e substituição da pena", "item": "D21b Crimes contra o patrimônio", "nivel": "médio", "origem": "ENAM 2025.2 – Q78", "enun": "Durante o expediente vespertino, em uma pequena joalheria localizada em um centro comercial, um indivíduo trajando roupas comuns e portando o que aparentava ser uma pistola de cor preta, anuncia o assalto. Sem proferir palavras de baixo calão ou ameaças explícitas, o assaltante gesticula com a arma em direção aos atendentes e clientes, exigindo a entrega de todas as joias disponíveis nos mostradores e as que estivessem sendo portadas pelos clientes. Apavorados, os funcionários e clientes obedecem às ordens, e o criminoso subtrai uma certa quantidade de objetos de ouro, fugindo em seguida. A polícia, acionada, perseguiu e abordou um veículo suspeito em uma via próxima. Ao revistar o automóvel, os policiais encontraram uma mochila com algumas joias e um simulacro de pistola idêntico a uma arma de fogo real. O condutor, identificado como Túlio, confessou que usou o simulacro no roubo da joalheria e, ao mostrar que estava armado, exigiu a entrega das joias, o que foi confirmado pelas imagens captadas pelas câmeras de segurança da loja. A perícia oficial avaliou os objetos roubados em cerca de oito salários mínimos e concluiu que a arma, apesar de muito semelhante à verdadeira, era um simulacro. Túlio foi processado e condenado pelo crime de roubo, aplicada pena mínima (quatro anos de reclusão em regime aberto e dez dias-multa no valor unitário mínimo). Considerando o entendimento do Superior Tribunal de Justiça sobre o emprego de simulacro de arma de fogo no crime de roubo e a possibilidade de substituição da pena privativa de liberdade por restritiva de direitos, assinale a afirmativa correta.", "alts": ["A utilização de simulacro de arma de fogo no crime de roubo caracteriza violência, o que impede a substituição da pena privativa de liberdade por restritiva de direitos, nos termos do Art. 44, inciso I, do Código Penal.", "A utilização de simulacro de arma de fogo no crime de roubo não caracteriza violência ou grave ameaça, permitindo a substituição da pena privativa de liberdade por restritiva de direitos, caso a pena aplicada seja inferior a quatro anos e o réu preencha os demais requisitos legais.", "A utilização de simulacro de arma de fogo no crime de roubo configura grave ameaça, o que impede a substituição da pena privativa de liberdade por restritiva de direitos, nos termos do Art. 44, inciso I, do Código Penal, mesmo que a pena aplicada seja inferior a quatro anos.", "A possibilidade de substituição da pena privativa de liberdade por restritiva de direitos, no caso de roubo com simulacro de arma de fogo, depende da análise subjetiva do Juiz, que deverá avaliar o grau de intimidação causado à vítima e a periculosidade do agente.", "A substituição da pena privativa de liberdade por restritiva de direitos é vedada em qualquer caso de roubo, independentemente do emprego de violência ou grave ameaça, em razão da natureza do crime e do bem jurídico tutelado (patrimônio)."], "coms": ["Errada. O simulacro não configura violência física. Ele configura GRAVE AMEAÇA, por intimidar a vítima.", "Errada. Para o STJ, o simulacro configura grave ameaça, e isso impede a substituição (CP, art. 44, I).", "CORRETA. Para o STJ, o emprego de simulacro de arma de fogo configura grave ameaça (elementar do roubo, sem incidir a majorante), o que veda a substituição por restritiva de direitos (art. 44, I), mesmo com pena de até 4 anos.", "Errada. O requisito do art. 44, I, é objetivo: crime cometido com violência ou grave ameaça impede a substituição, sem margem para avaliação subjetiva.", "Errada. A vedação decorre da violência ou grave ameaça (art. 44, I), e não da natureza patrimonial do bem jurídico."], "c": 2, "base": "CP, arts. 44, I, e 157, §2º-A, I; jurisprudência do STJ (Súmula 174 cancelada).", "dica": "O simulacro configura grave ameaça (é roubo), mas não majora a pena, porque a majorante exige arma de fogo verdadeira e apta a disparar.", "id": "F2025.2-78", "cod": "FGV 2025.2-Q78"}, {"n": 35, "disc": "Direito Penal", "tema": "Conflito aparente: falso e estelionato (Súmula 17/STJ)", "item": "D12 Penas/concurso de crimes/conflito aparente", "nivel": "médio", "origem": "Inédita", "enun": "Hugo falsificou a assinatura do titular em uma folha de cheque que encontrara na rua e utilizou o título para adquirir um aparelho celular em uma loja. A folha foi entregue ao lojista e compensada, não havendo qualquer outra utilização possível do documento.\nSobre a responsabilização penal de Hugo, assinale a afirmativa correta.", "alts": ["Hugo responde por falsificação de documento público e estelionato, em concurso formal, por ter havido uma única conduta com dois resultados.", "Hugo responde por falsificação de documento particular e estelionato, em concurso material, por se tratar de condutas distintas.", "Hugo responde apenas por estelionato, pois o falso se exauriu no estelionato, sem mais potencialidade lesiva.", "Hugo responde por uso de documento falso, pois o crime de falsificação é absorvido pelo seu uso.", "Hugo responde apenas por falsificação de documento público, crime mais grave, que absorve o estelionato."], "coms": ["Errada. Houve duas condutas (falsificar e usar para enganar). Ainda assim, o falso fica absorvido.", "Errada. Esgotada a potencialidade lesiva do falso no estelionato, não há concurso: aplica-se a consunção (Súmula 17/STJ).", "CORRETA. Súmula 17/STJ: quando o falso se exaure no estelionato, sem mais potencialidade lesiva, é por este absorvido. É o princípio da consunção (crime-meio absorvido pelo crime-fim).", "Errada. Quem falsifica e usa responde pela falsificação (o uso é pós-fato impunível). Aqui, porém, tudo se exauriu no estelionato.", "Errada. O cheque é equiparado a documento público para fins penais (CP, art. 297, §2º), mas a Súmula 17 manda que o estelionato absorva o falso exaurido, independentemente da pena maior do falso."], "c": 2, "base": "CP, arts. 171, 297, §2º, e 304; Súmula 17/STJ.", "dica": "Se o documento falso continua podendo enganar outras pessoas (como uma carteira de identidade falsa), não há absorção e há concurso de crimes.", "id": "i-fe9ee512", "cod": "PEN-0002"}, {"n": 36, "disc": "Direito Penal", "tema": "Desistência voluntária x tentativa", "item": "D07 Iter criminis", "nivel": "médio", "origem": "ENAM 2025.1 – Q69", "enun": "Em uma rua erma e durante a madrugada, Fábio foi abordado por Ricardo, que, portando um pequeno pedaço de pau, determinou ao primeiro, sob ameaça de injúria física, que repassasse todo o dinheiro em espécie que possuía. Diante da grave ameaça, Fábio retirou de seu bolso frontal os R$ 400,00 (quatrocentos reais) que dispunha e estendeu uma de suas mãos para entregar a quantia reclamada por Ricardo. Este, quando estava prestes a tomar para si o dinheiro, ouviu o barulho de uma sirene nas proximidades. Julgando ser oriundo de uma viatura policial, Ricardo ficou temeroso, determinou que a vítima guardasse, novamente, o dinheiro, abandonou no chão o pedaço de madeira que portava e deixou o local. Durante a fuga, já na esquina da rua, Ricardo constatou que aquele som escutado por ele era proveniente de uma ambulância que transitava pela localidade. Acerca dos fatos acima relatados, assinale a afirmativa correta.", "alts": ["Ricardo deve ser responsabilizado por crime de tentativa de roubo próprio.", "Ricardo deve ser responsabilizado por crime de roubo impróprio consumado.", "Ricardo deve ser responsabilizado por crime de extorsão, na modalidade tentada.", "Há arrependimento eficaz, demandando-se a aplicação do Art. 15 do CP, com consequente afastamento da tentativa do crime de roubo.", "Há desistência voluntária, demandando-se a aplicação do Art. 15 do CP, com consequente afastamento da tentativa do crime de roubo."], "coms": ["CORRETA. Ricardo interrompeu a execução porque acreditou que a polícia chegava, uma circunstância alheia à sua vontade, ainda que imaginária. Não é desistência voluntária, e ele responde por roubo tentado (art. 14, II). Fórmula de Frank: 'quero, mas não posso' é tentativa; 'posso, mas não quero' é desistência.", "Errada. Roubo impróprio é a violência ou grave ameaça empregada depois da subtração, para assegurar a coisa (art. 157, §1º). Aqui não houve subtração.", "Errada. Na extorsão, o comportamento da vítima é indispensável. Aqui o agente exigiu a entrega imediata do dinheiro, que ele poderia tomar diretamente, e isso caracteriza roubo.", "Errada. O arrependimento eficaz pressupõe execução esgotada e atuação do agente para impedir o resultado. Não é o caso.", "Errada. A desistência foi motivada por receio de prisão causado por fator externo, o que afasta a voluntariedade."], "c": 0, "base": "CP, arts. 14, II, 15, 157, caput e §1º, e 158.", "dica": "Desistência voluntária exige voluntariedade, não espontaneidade: desistir por remorso ou por dinheiro conta; desistir por medo de um fator externo (real ou imaginado) é tentativa.", "id": "F2025.1-69", "cod": "FGV 2025.1-Q69"}, {"n": 37, "disc": "Direito Penal", "tema": "Arquivamento do inquérito (art. 28 do CPP após as ADIs do Pacote Anticrime)", "item": "D13-16 Efeitos/reabilitação/medida de segurança/ação penal", "nivel": "difícil", "origem": "Inédita", "enun": "Concluído o inquérito policial que apurava crime de lesão corporal grave, o Promotor de Justiça promoveu o arquivamento por insuficiência de elementos de autoria. A vítima, inconformada, procurou orientação sobre o que poderia fazer.\nConsiderando o art. 28 do CPP, na redação da Lei nº 13.964/2019, e a interpretação conferida pelo STF nas ADIs 6.298, 6.299, 6.300 e 6.305, assinale a afirmativa correta.", "alts": ["Admite-se o arquivamento implícito quando o Ministério Público deixa de denunciar algum dos investigados sem fundamentação expressa.", "Arquivado o inquérito por falta de base para a denúncia, a autoridade policial poderá proceder a novas pesquisas, e o Ministério Público poderá oferecer denúncia ainda que não surjam provas novas.", "A vítima poderá ajuizar ação penal privada subsidiária da pública, em razão do arquivamento promovido pelo Ministério Público.", "O juiz não exerce qualquer controle sobre a promoção de arquivamento, que se torna definitiva com a mera manifestação do Ministério Público.", "A vítima, não concordando com o arquivamento, poderá, no prazo de 30 dias do recebimento da comunicação, submeter a matéria à revisão da instância competente do órgão ministerial."], "coms": ["Errada. STF e STJ não admitem o arquivamento implícito. A omissão deve ser suprida, e não presumida como arquivamento.", "Errada. A autoridade policial pode fazer novas pesquisas (CPP, art. 18), mas a ação penal só pode ser iniciada com novas provas (Súmula 524/STF).", "Errada. A ação privada subsidiária pressupõe INÉRCIA do MP (CF, art. 5º, LIX; CPP, art. 29). Arquivar é manifestação, e não inércia.", "Errada. O STF deu interpretação conforme: a manifestação deve ser submetida ao juiz, que pode provocar a instância revisora do MP em caso de patente ilegalidade ou teratologia.", "CORRETA. Art. 28, §1º, do CPP. O STF manteve esse mecanismo e fixou que o MP deve submeter a promoção de arquivamento ao juiz, que pode, diante de patente ilegalidade ou teratologia, provocar a revisão ministerial."], "c": 4, "base": "CPP, arts. 18, 28 e 29; CF, art. 5º, LIX; Súmula 524/STF; STF, ADIs 6.298, 6.299, 6.300 e 6.305.", "dica": "O arquivamento por atipicidade ou extinção da punibilidade faz coisa julgada material. O arquivamento por falta de provas permite reabertura com prova nova (Súmula 524).", "id": "i-06cfd0bc", "cod": "PEN-0003"}, {"n": 38, "disc": "Direito Penal", "tema": "Omissão imprópria — dever de garante", "item": "D04-06 Teoria do crime/tipicidade/dolo/culpa", "nivel": "médio", "origem": "Inédita", "enun": "Numa piscina de clube, a criança Theo, de 6 anos, começou a se afogar. Sua babá, Márcia, contratada para vigiá-lo, estava a poucos metros, viu a cena e, distraída ao celular, decidiu não intervir por julgar que 'não seria nada'. Joel, outro frequentador, que sabia nadar, também viu a criança se debatendo e nada fez, embora pudesse prestar socorro sem risco pessoal. Theo morreu.\nSobre a responsabilidade penal de Márcia e Joel, assinale a afirmativa correta.", "alts": ["Márcia responde por omissão de socorro majorada, e Joel não responde por crime algum, por inexistir vínculo com a vítima.", "Márcia e Joel respondem por homicídio na forma omissiva imprópria, pois ambos podiam agir para evitar o resultado.", "Márcia, por ter assumido a responsabilidade de impedir o resultado, responde pelo homicídio na forma omissiva imprópria; Joel responde por omissão de socorro, com a pena triplicada em razão do resultado morte.", "Márcia somente poderia ser responsabilizada se houvesse lei específica impondo dever de cuidado às babás.", "Márcia e Joel respondem apenas por omissão de socorro, pois nenhum deles causou diretamente a morte de Theo."], "coms": ["Errada. Joel tinha o dever geral de assistência (art. 135), e Márcia tinha o dever especial de garante.", "Errada. A mera possibilidade de agir não torna alguém garante. É preciso estar em uma das hipóteses do art. 13, §2º.", "CORRETA. Márcia é garante (CP, art. 13, §2º, b), e sua omissão equivale à ação: responde pelo resultado, a título de dolo ou culpa conforme o elemento subjetivo apurado. Joel não é garante e responde pelo crime omissivo próprio do art. 135, com a pena triplicada pela morte (parágrafo único).", "Errada. O dever de garante pode decorrer da assunção fática ou contratual da responsabilidade (art. 13, §2º, b), sem lei específica.", "Errada. Para o garante, a omissão é penalmente relevante como causa do resultado (art. 13, §2º)."], "c": 2, "base": "CP, arts. 13, §2º, 121 e 135, parágrafo único.", "dica": "Garantes do art. 13, §2º: quem tem dever legal (pais), quem assumiu a responsabilidade (babá, salva-vidas) e quem criou o risco (ingerência).", "id": "i-6b8511d9", "cod": "PEN-0004"}, {"n": 39, "disc": "Direito Penal", "tema": "Concussão x corrupção passiva", "item": "D21d Fé pública/Adm Pública/Adm justiça", "nivel": "fácil", "origem": "Inédita", "enun": "Durante fiscalização sanitária em um restaurante, o fiscal municipal Otávio afirmou ao proprietário, Felipe: 'Se você não me pagar R$ 5.000,00 até sexta-feira, eu interdito o seu estabelecimento'. Felipe, temendo prejuízos, entregou a quantia a Otávio na quinta-feira.\nSobre a hipótese, assinale a afirmativa correta.", "alts": ["Otávio praticou corrupção passiva, e Felipe, corrupção ativa, pois ambos participaram do ajuste ilícito.", "Otávio praticou prevaricação, pois deixou de praticar ato de ofício para satisfazer interesse pessoal.", "Otávio praticou concussão, que somente se consumou na quinta-feira, com o recebimento da quantia.", "Otávio praticou concussão, consumada no momento da exigência, sendo o recebimento mero exaurimento; Felipe não pratica crime, pois foi vítima da exigência.", "Otávio praticou extorsão, pois houve grave ameaça para obtenção de vantagem econômica."], "coms": ["Errada. Na corrupção passiva o verbo é solicitar, receber ou aceitar promessa. Aqui houve EXIGÊNCIA, com intimidação, o que é concussão.", "Errada. Na prevaricação não há vantagem indevida exigida de terceiro: o agente retarda ou omite ato de ofício para satisfazer interesse ou sentimento pessoal (art. 319).", "Errada. A concussão é crime formal: a consumação ocorre com a exigência, e o recebimento é exaurimento.", "CORRETA. Exigir vantagem indevida em razão da função é concussão (CP, art. 316). O crime é formal e se consuma com a exigência. Quem cede à exigência é vítima e não comete corrupção ativa.", "Errada. A exigência ligada à função pública e ao temor da autoridade caracteriza o crime específico de concussão. A extorsão exige violência ou grave ameaça de mal injusto alheio à função."], "c": 3, "base": "CP, arts. 158, 316, 317, 319 e 333.", "dica": "Exigir é concussão (art. 316). Solicitar ou receber é corrupção passiva (art. 317). Oferecer ou prometer é corrupção ativa (art. 333). Quem cede à exigência é vítima.", "id": "i-f4dee1e6", "cod": "PEN-0005"}, {"n": 40, "disc": "Direito Penal", "tema": "Embriaguez e imputabilidade", "item": "D08-10 Ilicitude/culpabilidade/imputabilidade", "nivel": "médio", "origem": "Inédita", "enun": "Em uma festa, ocorreram três episódios distintos de lesão corporal:\n• Pedro, que bebeu voluntariamente até ficar completamente embriagado, agrediu um convidado;\n• Mário, cujo refrigerante foi adulterado com grande quantidade de álcool por terceiro, sem seu conhecimento, ficou completamente embriagado e, inteiramente incapaz de entender o caráter ilícito do fato, agrediu outro convidado;\n• Luiz, portador de alcoolismo crônico que lhe retirou integralmente a capacidade de entendimento, agrediu um garçom.\nSobre a responsabilidade penal de cada um, assinale a afirmativa correta.", "alts": ["Pedro é imputável; Mário é isento de pena por embriaguez completa proveniente de caso fortuito; Luiz é inimputável, tratando-se a embriaguez patológica como doença mental, sujeita a medida de segurança.", "Pedro é inimputável, por aplicação da teoria da actio libera in causa, que exclui a culpabilidade de quem se embriaga voluntariamente.", "Os três são isentos de pena, pois em todos os casos a embriaguez era completa.", "Pedro tem a pena reduzida de um a dois terços; Mário e Luiz são isentos de pena, sem aplicação de medida de segurança.", "Pedro e Mário são imputáveis, pois a embriaguez, voluntária ou não, nunca exclui a imputabilidade; Luiz é inimputável."], "coms": ["CORRETA. A embriaguez voluntária ou culposa não exclui a imputabilidade (CP, art. 28, II, actio libera in causa). A completa e fortuita isenta de pena (§1º). A patológica (alcoolismo crônico) se equipara a doença mental (art. 26) e leva à absolvição imprópria com medida de segurança.", "Errada. A actio libera in causa fundamenta justamente a punição de quem se embriagou voluntariamente, transportando a imputabilidade para o momento em que bebeu.", "Errada. A embriaguez voluntária, mesmo completa, não exclui a imputabilidade (art. 28, II).", "Errada. A redução de 1 a 2/3 é para a embriaguez fortuita INCOMPLETA (art. 28, §2º). Luiz, inimputável por doença mental, recebe medida de segurança.", "Errada. A embriaguez completa proveniente de caso fortuito ou força maior isenta de pena (art. 28, §1º)."], "c": 0, "base": "CP, arts. 26, 28, II e §§1º e 2º, e 97.", "dica": "Voluntária ou culposa: responde. Fortuita completa: isento. Fortuita incompleta: redução de 1 a 2/3. Patológica: tratada como doença mental (art. 26). Preordenada: agravante (art. 61, II, l).", "id": "i-c126abd2", "cod": "PEN-0006"}, {"n": 1, "disc": "Direito Constitucional", "tema": "Greve de servidores públicos (Temas 531, 541 e 544/STF)", "item": "C08t Constitucional do Trabalho", "nivel": "médio", "origem": "Inédita", "enun": "Os servidores estatutários da Secretaria de Saúde do Município Alfa deflagraram greve por reajuste salarial, mantendo 40% do efetivo em atividade. Após 15 dias, o Município determinou o desconto dos dias não trabalhados. Paralelamente, os policiais civis do Estado Beta, onde se situa Alfa, anunciaram adesão ao movimento grevista em solidariedade.\nÀ luz da jurisprudência do Supremo Tribunal Federal, assinale a afirmativa correta.", "alts": ["O desconto dos dias de paralisação é devido, permitida a compensação em caso de acordo, salvo se demonstrado que a greve foi provocada por conduta ilícita do Poder Público; já o exercício do direito de greve é vedado aos policiais civis.", "Enquanto não editada a lei específica prevista no Art. 37, VII, da Constituição, os servidores públicos civis não podem exercer o direito de greve.", "O desconto dos dias parados é inconstitucional, pois a greve é direito fundamental, e sua efetividade não pode ser esvaziada por sanção remuneratória.", "Os policiais civis podem aderir à greve, desde que mantido percentual mínimo de efetivo, por aplicação analógica da Lei nº 7.783/1989.", "Compete à Justiça do Trabalho julgar a abusividade da greve dos servidores estatutários municipais."], "coms": ["CORRETA. Tema 531/STF: a Administração deve descontar os dias parados, em razão da suspensão do vínculo, admitida a compensação por acordo e vedado o desconto se a greve decorrer de conduta ilícita do Poder Público. Tema 541/STF: é vedado o direito de greve aos servidores que atuam diretamente na segurança pública, como os policiais civis.", "Errada. O STF supriu a omissão nos MIs 670, 708 e 712, mandando aplicar, no que couber, a Lei 7.783/1989.", "Errada. O STF entende que a greve suspende o vínculo, o que autoriza o desconto. A efetividade do direito é preservada pela possibilidade de compensação.", "Errada. A aplicação da Lei 7.783/1989 aos servidores (MI 670, 708 e 712) não alcança as carreiras de segurança pública, para as quais a greve é vedada (Tema 541).", "Errada. A abusividade de greve de servidores da Administração direta, autárquica e fundacional, inclusive celetistas, é julgada pela Justiça comum (Tema 544/STF)."], "c": 0, "base": "CF, art. 37, VII; Lei 7.783/1989; STF, MIs 670, 708 e 712, Temas 531, 541 e 544.", "dica": "Na segurança pública, a greve é vedada, mas o STF impõe ao Poder Público participar de mediação com as entidades de classe (Tema 541).", "id": "i-56e96551", "cod": "CON-0006"}, {"n": 2, "disc": "Direito Constitucional", "tema": "Ouro como ativo financeiro — IOF e repartição", "item": "C14 Tributário/finanças", "nivel": "médio", "origem": "ENAM 2024.1 – Q11", "enun": "Ouro Fino 100%, sociedade empresária sediada no Município Alfa, Estado Beta, atua na atividade de extração de ouro no mesmo município de sua sede, possuindo todas as autorizações necessárias para a regular operação nessa atividade. A sociedade empresária realizou a venda de sua produção aurífera para uma instituição integrante do Sistema Financeiro Nacional (SFN), na forma e nas condições autorizadas pelo Banco Central do Brasil (ouro destinado ao mercado financeiro). Diante desse cenário, assinale a afirmativa correta.", "alts": ["A alíquota mínima de ICMS incidente sobre a operação será de 1%.", "50% do montante da arrecadação do imposto incidente devido nessa operação será destinado aos cofres do Estado Beta.", "Sobre a operação de venda de ouro da sociedade empresária para a instituição integrante do SFN incide Imposto sobre a Circulação de Mercadorias e Serviços - ICMS.", "70% do montante da arrecadação do imposto incidente devido nessa operação será destinado aos cofres do Município Alfa.", "O ouro decorrente da atividade de exploração minerária, quando destinado ao mercado financeiro (ativo financeiro), sofre tributação apenas do Imposto sobre Produtos Industrializados (IPI)."], "coms": ["Errada. A alíquota mínima de 1% é a do IOF-ouro (CF, art. 153, §5º), e não a do ICMS, que não incide nessa operação.", "Errada. O Estado de origem recebe 30% da arrecadação do IOF-ouro, e não 50% (art. 153, §5º, I).", "Errada. O ouro definido em lei como ativo financeiro ou instrumento cambial sujeita-se EXCLUSIVAMENTE ao IOF (art. 153, §5º). Não incide ICMS.", "CORRETA. Do IOF-ouro, 70% vão para o Município de origem e 30% para o Estado, DF ou Território de origem (art. 153, §5º, I e II).", "Errada. O tributo exclusivo é o IOF, e não o IPI."], "c": 3, "base": "CF, art. 153, V e §5º.", "dica": "IOF-ouro: alíquota mínima de 1%, tributo exclusivo, com 30% para o Estado e 70% para o Município de origem. É um dos poucos impostos federais em que o Município fica com a maior parte.", "id": "F2024.1-11", "cod": "FGV 2024.1-Q11"}, {"n": 3, "disc": "Direito Constitucional", "tema": "Quinto constitucional", "item": "C12 Judiciário/funções essenciais", "nivel": "fácil", "origem": "Inédita", "enun": "Abriu-se, no Tribunal de Justiça do Estado Alfa, vaga destinada ao quinto constitucional, a ser preenchida por advogado.\nSobre o procedimento de preenchimento da vaga, assinale a afirmativa correta.", "alts": ["O advogado deverá contar com, no mínimo, cinco anos de efetiva atividade profissional.", "O magistrado oriundo do quinto adquire a vitaliciedade somente após dois anos de exercício.", "O Tribunal de Justiça escolherá diretamente o advogado, por votação de seu Órgão Especial, a partir de lista sêxtupla da OAB.", "A OAB indicará lista tríplice diretamente ao Governador, que escolherá um nome, sujeito à aprovação da Assembleia Legislativa.", "O órgão de representação da classe indicará lista sêxtupla de advogados de notório saber jurídico e reputação ilibada, com mais de dez anos de efetiva atividade profissional; o Tribunal formará lista tríplice e a enviará ao Poder Executivo, que, nos vinte dias subsequentes, escolherá um de seus integrantes para nomeação."], "coms": ["Errada. A CF exige mais de dez anos de efetiva atividade profissional (art. 94).", "Errada. Nos tribunais, a vitaliciedade é adquirida com a posse. O prazo de 2 anos vale para os juízes de primeiro grau (art. 95, I).", "Errada. Quem escolhe e nomeia é o chefe do Poder Executivo, a partir da lista tríplice do Tribunal.", "Errada. A OAB forma lista SÊXTUPLA, o Tribunal a reduz a tríplice, e não há sabatina pela Assembleia nas vagas do quinto dos TJs.", "CORRETA. Literalidade do art. 94 da CF."], "c": 4, "base": "CF, arts. 94 e 95, I.", "dica": "Quinto: lista sêxtupla da OAB ou do MP, depois lista tríplice do tribunal, e o Executivo escolhe em 20 dias. No STJ, há regra própria, com nomeação pelo Presidente após aprovação do Senado (art. 104).", "id": "i-e44885a9", "cod": "CON-0007"}, {"n": 4, "disc": "Direito Constitucional", "tema": "ADPF — legitimidade, objeto e efeitos", "item": "C15 Controle de constitucionalidade", "nivel": "fácil", "origem": "ENAM 2025.2 – Q1", "enun": "A Arguição de Descumprimento de Preceito Fundamental (ADPF) é um importante instrumento de controle de constitucionalidade, estando prevista na Constituição Federal e na Lei nº 9.882/1999. A esse respeito, assinale a afirmativa correta.", "alts": ["Na ADPF, a decisão que julgar procedente ou improcedente o pedido é irrecorrível, mas pode ser objeto de ação rescisória.", "Conforme jurisprudência pacificada do Supremo Tribunal Federal, não é possível que a ADPF tenha por objeto um conjunto de reiteradas decisões judiciais sobre determinada matéria.", "Na ADPF, assim como ocorre em outras ações de controle concentrado, não é possível o exame da compatibilidade do direito pré-constitucional (leis ou atos normativos anteriores à Constituição Federal de 1988) com normas da Constituição Federal de 1988.", "Podem propor ADPF os mesmos legitimados para a Ação Direta de inconstitucionalidade (ADI).", "Segundo o Supremo Tribunal Federal, a ADPF não é um instrumento eficaz de controle da inconstitucionalidade por omissão, não podendo ter por objeto as omissões do poder público."], "coms": ["Errada. A decisão na ADPF é irrecorrível e NÃO pode ser objeto de ação rescisória (Lei 9.882, art. 12).", "Errada. O STF admite ADPF contra um conjunto de decisões judiciais reiteradas (ex.: ADPF 101, importação de pneus usados).", "Errada. A ADPF é justamente o meio de controle concentrado do direito pré-constitucional (Lei 9.882, art. 1º, parágrafo único, I). A ADI não serve para isso.", "CORRETA. Os legitimados da ADPF são os mesmos da ADI, ou seja, os do art. 103 da CF (Lei 9.882, art. 2º, I).", "Errada. O STF admite ADPF contra omissões do poder público e reconhece a fungibilidade entre ADPF e ADO (ex.: ADPF 347)."], "c": 3, "base": "CF, arts. 102, §1º, e 103; Lei 9.882/1999, arts. 1º, 2º, 4º, §1º, e 12.", "dica": "A ADPF é subsidiária (art. 4º, §1º): só cabe quando não houver outro meio eficaz de sanar a lesividade, considerando o controle concentrado como um todo.", "id": "F2025.2-1", "cod": "FGV 2025.2-Q1"}, {"n": 5, "disc": "Direito Constitucional", "tema": "Medicamento sem registro na Anvisa (Tema 500/STF)", "item": "C08 Direitos sociais", "nivel": "difícil", "origem": "Inédita", "enun": "Pedro, portador de doença rara, ajuizou ação em face do Estado Alfa pleiteando o fornecimento de medicamento que não possui registro na Anvisa, embora registrado nas agências sanitárias dos Estados Unidos e da União Europeia. O pedido de registro foi protocolado na Anvisa há mais de três anos, sem decisão. Não há substituto terapêutico registrado no Brasil.\nÀ luz da tese fixada pelo STF no Tema 500 da repercussão geral, assinale a afirmativa correta.", "alts": ["O Estado Alfa é parte legítima e deve fornecer o medicamento, em razão da responsabilidade solidária dos entes federativos na área da saúde.", "É possível, excepcionalmente, a concessão judicial do medicamento, diante da mora irrazoável da Anvisa, desde que presentes os requisitos fixados pelo STF; contudo, a ação deveria ter sido proposta em face da União.", "O fornecimento é juridicamente impossível, pois a ausência de registro na Anvisa impede, em qualquer hipótese, a concessão judicial do medicamento.", "A concessão judicial depende exclusivamente da prova da hipossuficiência econômica do autor e da prescrição médica.", "O Estado pode ser obrigado a fornecer medicamentos experimentais, desde que haja prescrição médica fundamentada e risco de morte."], "coms": ["Errada. A solidariedade (Tema 793) não se aplica a medicamento sem registro: nesse caso, a ação deve ser proposta contra a União (Tema 500, item 4).", "CORRETA. Tema 500: a ausência de registro impede, como regra, o fornecimento judicial, mas admite-se a concessão em caso de mora irrazoável da Anvisa, com pedido de registro no Brasil (salvo medicamentos órfãos), registro em renomadas agências estrangeiras e ausência de substituto registrado. As ações devem ser propostas necessariamente em face da União.", "Errada. A regra admite exceção na hipótese de mora irrazoável da Anvisa (Tema 500, item 3).", "Errada. Os requisitos do Tema 500 são específicos: mora irrazoável, pedido de registro, registro no exterior e ausência de substituto.", "Errada. O Estado não pode ser obrigado a fornecer medicamentos experimentais (Tema 500, item 1)."], "c": 1, "base": "CF, arts. 6º, 196 e 198; Lei 13.411/2016; STF, Temas 500 e 793 (e Temas 6 e 1.234, para medicamentos registrados e não incorporados).", "dica": "Sem registro na Anvisa, aplica-se o Tema 500 e a ação é contra a União. Registrado mas não incorporado ao SUS, aplicam-se os Temas 6 e 1.234, com requisitos cumulativos e regras de competência e custeio.", "id": "i-e07cfb8b", "cod": "CON-0008"}, {"n": 6, "disc": "Direito Constitucional", "tema": "Eficácia horizontal dos direitos fundamentais", "item": "C06 Direitos fundamentais (teoria, expressão, privacidade)", "nivel": "fácil", "origem": "Inédita", "enun": "A Associação Cultural Alfa, entidade privada sem fins lucrativos, excluiu de seus quadros o associado Ricardo, por decisão da diretoria, sob a alegação de que ele teria difamado dirigentes em redes sociais. Ricardo não foi ouvido previamente nem lhe foi oferecida oportunidade de recurso, embora o estatuto previsse o procedimento.\nSobre a validade da exclusão, assinale a afirmativa correta.", "alts": ["A exclusão é válida, pois a Constituição assegura a liberdade de associação, de modo que a entidade pode excluir associados sem motivação.", "A exclusão somente seria inválida se a associação recebesse recursos públicos.", "A exclusão é válida, mas Ricardo poderá pleitear indenização por danos morais.", "A exclusão é válida, pois os direitos fundamentais vinculam apenas o Estado, e a autonomia privada da associação prevalece.", "A exclusão é inválida, pois os direitos fundamentais, como o contraditório e a ampla defesa, também incidem nas relações entre particulares, e o Código Civil exige justa causa e procedimento que assegure direito de defesa e de recurso."], "coms": ["Errada. A liberdade de associação não autoriza a exclusão arbitrária: o art. 57 do CC exige justa causa e procedimento com defesa.", "Errada. A incidência dos direitos fundamentais nas relações privadas não depende de financiamento público.", "Errada. A exclusão sem defesa é inválida e pode ser anulada judicialmente, o que não impede eventual indenização.", "Errada. O STF adota a eficácia horizontal, inclusive direta, em entidades privadas com relevância social, como as associações.", "CORRETA. No RE 201.819 (caso UBC), o STF reconheceu a eficácia horizontal dos direitos fundamentais, exigindo defesa na exclusão de associado. O art. 57 do CC exige justa causa reconhecida em procedimento que assegure direito de defesa e de recurso, nos termos do estatuto."], "c": 4, "base": "CF, art. 5º, LIV, LV e XVII a XX; CC, art. 57; STF, RE 201.819.", "dica": "Eficácia horizontal é a aplicação dos direitos fundamentais entre particulares. O caso-símbolo é o RE 201.819 (UBC), com exclusão de associado sem defesa.", "id": "i-ce2829e1", "cod": "CON-0009"}, {"n": 7, "disc": "Direito Constitucional", "tema": "Guardas municipais e segurança pública (Tema 656/STF)", "item": "C13 Defesa do Estado/segurança pública", "nivel": "difícil", "origem": "Inédita", "enun": "Lei do Município Alfa atribuiu à guarda municipal: (i) o patrulhamento preventivo e ostensivo das vias públicas, em cooperação com a Polícia Militar; (ii) a instauração e condução de inquéritos para apurar crimes contra o patrimônio municipal; e (iii) a prisão em flagrante de quem fosse surpreendido cometendo crime.\nÀ luz da Constituição e da jurisprudência do Supremo Tribunal Federal, assinale a afirmativa correta.", "alts": ["A atribuição (ii) é válida, desde que os inquéritos sejam posteriormente remetidos à Polícia Civil.", "São válidas as atribuições (i) e (iii), mas é inconstitucional a (ii), pois as guardas municipais podem exercer ações de segurança urbana, inclusive policiamento ostensivo e comunitário, mas não atividade de polícia judiciária.", "Apenas a atribuição (iii) é válida, pois a prisão em flagrante é facultada a qualquer do povo, sendo vedado às guardas o patrulhamento ostensivo.", "As três atribuições são válidas, pois as guardas municipais integram o Sistema Único de Segurança Pública e exercem as mesmas funções das polícias civis e militares.", "As três atribuições são inconstitucionais, pois as guardas municipais destinam-se exclusivamente à proteção de bens, serviços e instalações do Município."], "coms": ["Errada. A remessa posterior não supre o vício: a guarda não pode exercer atividade de polícia judiciária.", "CORRETA. No Tema 656 (RE 608.588), o STF declarou constitucional o exercício de ações de segurança urbana pelas guardas municipais, inclusive policiamento ostensivo e comunitário, respeitadas as atribuições dos demais órgãos do art. 144 e EXCLUÍDA a polícia judiciária, com controle externo do MP. A prisão em flagrante pode ser feita por qualquer do povo (CPP, art. 301).", "Errada. O STF admitiu o policiamento ostensivo e comunitário pelas guardas (Tema 656).", "Errada. A investigação criminal (polícia judiciária) é das polícias civil e federal (art. 144, §§1º e 4º) e está excluída das guardas.", "Errada. O STF superou a leitura restritiva do art. 144, §8º, reconhecendo as guardas como órgãos do sistema de segurança pública (ADPF 995) e admitindo o policiamento ostensivo e comunitário (Tema 656)."], "c": 1, "base": "CF, art. 144, §§1º, 4º e 8º; CPP, art. 301; Lei 13.022/2014; STF, ADPF 995 e Tema 656.", "dica": "Guardas municipais podem fazer policiamento ostensivo e comunitário, mas não investigação. Prender em flagrante qualquer pessoa pode.", "id": "i-47f8c92b", "cod": "CON-0010"}, {"n": 8, "disc": "Direito Administrativo", "tema": "Recurso administrativo e reformatio in pejus (Lei 9.784/1999)", "item": "A07 Processo administrativo", "nivel": "médio", "origem": "Inédita", "enun": "Luíza, servidora federal, recebeu pena de advertência em processo disciplinar e interpôs recurso administrativo. A autoridade superior, ao examinar o recurso, entendeu que os fatos eram mais graves e pretende aplicar pena de suspensão.\nÀ luz da Lei nº 9.784/1999, assinale a afirmativa correta.", "alts": ["A autoridade poderá agravar a sanção, desde que Luíza seja previamente cientificada para formular alegações antes da decisão.", "A admissibilidade do recurso pode ser condicionada ao depósito prévio de 10% do valor da sanção.", "É vedado o agravamento da sanção em sede de recurso, em razão da proibição da reformatio in pejus no processo administrativo.", "O prazo para interposição do recurso administrativo é de 15 dias, contados da ciência da decisão.", "O recurso deve ser dirigido diretamente à autoridade superior, sendo vedado à autoridade que proferiu a decisão reconsiderá-la."], "coms": ["CORRETA. No recurso administrativo, admite-se a reformatio in pejus, mas, se da decisão puder decorrer gravame à situação do recorrente, este deve ser cientificado para formular alegações antes da decisão (art. 64, parágrafo único).", "Errada. É inconstitucional exigir depósito ou arrolamento prévios de dinheiro ou bens para admitir recurso administrativo (Súmula Vinculante 21; art. 56, §2º).", "Errada. A vedação de agravamento existe na REVISÃO (art. 65, parágrafo único), e não no recurso.", "Errada. Salvo disposição legal específica, o prazo é de 10 dias (art. 59).", "Errada. O recurso é dirigido à autoridade que proferiu a decisão, que pode reconsiderar em 5 dias. Se não reconsiderar, encaminha à superior (art. 56, §1º)."], "c": 0, "base": "Lei 9.784/1999, arts. 56, 57, 59, 64 e 65; Súmula Vinculante 21.", "dica": "Recurso administrativo pode piorar a situação, com ciência prévia (art. 64). Revisão não pode piorar (art. 65). O recurso tramita por no máximo 3 instâncias (art. 57).", "id": "i-9301408e", "cod": "ADM-0005"}, {"n": 9, "disc": "Direito Administrativo", "tema": "Programa de integridade em licitações", "item": "A08 Licitação", "nivel": "médio", "origem": "ENAM 2025.2 – Q25", "enun": "Considerando a necessidade de novas contratações de serviços de engenharia para a realização de obra pública e o dever de ética na Administração Pública, o Município Alfa elaborou lei e publicou edital com a inclusão da exigência de apresentação de programa de integridade, na fase licitatória de habilitação jurídica, por sociedades empresárias licitantes e interessadas no certame local. Analise juridicamente a conduta do Município Alfa, e assinale a afirmativa correta.", "alts": ["As obrigatoriedades normativa e editalícia de apresentação do referido programa estão amparadas na Lei nº 12.846/2013 (Lei Anticorrupção) e na Lei nº 14.133/2021. A conduta municipal é juridicamente válida.", "O programa de integridade deve ser exigido do referido Município, pessoa jurídica de Direito Público, e não da sociedade empresária particular licitante, conforme a orientação normativa de governança e ética no espaço público.", "É inconstitucional e ilegal tal conduta municipal, uma vez que a matéria é de competência constitucional da União (normas gerais) e a Lei nº 14.133/2021 estimula que as empresas licitantes tenham programas de integridade, sem torná-los obrigatórios durante a licitação.", "A conduta municipal é legal e constitucionalmente válida, posto que está alinhada à nova obrigatoriedade constante da Lei nº 14.133/2021, norma de natureza geral em licitações e contratos administrativos, e amparada pela autonomia municipal para tratar de assuntos de interesse local.", "A lei editada e a exigência editalícia devem ser invalidadas, pois a exigência de apresentação do programa de integridade deve ocorrer no momento da emissão da primeira fatura decorrente do contrato a ser firmado com a licitante vencedora, a fim de não comprometer o princípio da ampla competitividade do certame."], "coms": ["Errada. A Lei 14.133 não autoriza exigir programa de integridade na habilitação. Ela o exige apenas do VENCEDOR de contratação de grande vulto, depois do contrato.", "Errada. A lei trata de programa de integridade do licitante ou contratado (arts. 25, §4º, e 60, IV), e não do ente público.", "CORRETA. Normas gerais de licitação são de competência da União (CF, art. 22, XXVII). A Lei 14.133 prevê o programa de integridade como obrigação do vencedor em obras e serviços de grande vulto, a ser implantado em 6 meses da contratação (art. 25, §4º), e como critério de desempate e de dosimetria (arts. 60, IV, e 156, §1º, V). Não o transforma em requisito de habilitação.", "Errada. Não existe essa obrigação na fase de habilitação, e o Município não pode criar requisito de habilitação não previsto nas normas gerais.", "Errada. O momento legal não é a primeira fatura: o prazo é de 6 meses contados da celebração do contrato, e só nas contratações de grande vulto (art. 25, §4º)."], "c": 2, "base": "CF, art. 22, XXVII; Lei 14.133/2021, arts. 25, §4º, 60, IV, 62 a 70 e 156, §1º, V; Lei 12.846/2013.", "dica": "Na Lei 14.133, o programa de integridade aparece em 3 lugares: obrigação do vencedor de grande vulto (25, §4º), desempate (60, IV) e atenuante na sanção (156, §1º, V).", "id": "F2025.2-25", "cod": "FGV 2025.2-Q25"}, {"n": 10, "disc": "Direito Administrativo", "tema": "Caducidade do decreto expropriatório", "item": "A10-11 Poder de polícia/intervenção na propriedade", "nivel": "médio", "origem": "Inédita", "enun": "Em março de 2020, o Governador do Estado Alfa expediu decreto declarando de utilidade pública, para fins de desapropriação, imóvel de Rogério, destinado à construção de uma escola. Não houve acordo nem ajuizamento de ação de desapropriação. Em junho de 2025, o Estado pretende ajuizar a ação com base no mesmo decreto.\nSobre a hipótese, assinale a afirmativa correta.", "alts": ["O decreto caducou em dois anos, prazo aplicável às desapropriações por utilidade pública.", "O decreto continua válido, pois a declaração de utilidade pública não está sujeita a prazo de caducidade.", "O decreto caducou, pois a desapropriação deveria ter sido efetivada mediante acordo ou intentada judicialmente em cinco anos, e somente decorrido um ano poderá o bem ser objeto de nova declaração.", "O Estado poderá expedir novo decreto imediatamente, renovando a declaração sobre o mesmo bem.", "Caducado o decreto, o imóvel passa a integrar o patrimônio público, cabendo a Rogério apenas a indenização."], "coms": ["Errada. O prazo de 2 anos é o da desapropriação por INTERESSE SOCIAL (Lei 4.132/1962, art. 3º).", "Errada. O art. 10 do DL 3.365/1941 fixa a caducidade em 5 anos.", "CORRETA. Literalidade do art. 10 do Decreto-Lei 3.365/1941. O decreto de março de 2020 caducou em março de 2025, e uma nova declaração só pode ser feita a partir de março de 2026.", "Errada. A lei exige o decurso de 1 ano após a caducidade (art. 10).", "Errada. A caducidade extingue os efeitos da declaração. O bem continua com o proprietário."], "c": 2, "base": "Decreto-Lei 3.365/1941, arts. 10 e 15, §2º; Lei 4.132/1962, art. 3º.", "dica": "Utilidade pública: 5 anos de caducidade, mais 1 ano de 'quarentena'. Interesse social: 2 anos. A alegação de urgência caduca se a imissão não for requerida em 120 dias (art. 15, §2º).", "id": "i-e45f960c", "cod": "ADM-0006"}, {"n": 11, "disc": "Direito Administrativo", "tema": "Alteração unilateral do contrato (Lei 14.133/2021)", "item": "A05 Ato administrativo", "nivel": "médio", "origem": "ENAM 2026.1 – Q20", "enun": "Após o devido processo licitatório, o Estado Alfa celebrou um contrato administrativo com a sociedade empresária Gama, visando à realização de uma obra pública, mais especificamente, a construção de uma nova sede para a Secretaria Estadual de Fazenda Pública. Contudo, por motivos supervenientes e com as devidas justificativas, o poder público concluiu ser necessária a modificação do projeto e das suas especificações para melhor adequação técnica a seus objetivos, ensejando a supressão de parte da obra e dos encargos da contratada. Dessa forma, o Estado Alfa alterou unilateralmente a avença, o que ensejou a redução de 20% do valor inicial atualizado do contrato. De acordo com a narrativa e considerando as disposições da Lei nº 14.133/2021, avalie as afirmativas a seguir. I. A sociedade empresária Gama não será obrigada a aceitar, nas mesmas condições contratuais, a redução de 20% do valor inicial atualizado do contrato, podendo requerer, em juízo, a extinção do contrato administrativo. II. Como houve a alteração unilateral do contrato, diminuindo os encargos da sociedade empresária Gama, a Administração deverá restabelecer, no mesmo termo aditivo, o equilíbrio econômico-financeiro inicial. III. Por se tratar de alteração contratual para a supressão de obra, se a sociedade empresária Gama já houver adquirido os materiais e os colocado no local dos trabalhos, estes deverão ser pagos pela Administração pelos custos de aquisição regularmente comprovados e monetariamente reajustados, podendo caber indenização por outros danos eventualmente decorrentes da supressão, desde que regularmente comprovados. Está correto o que se afirma em", "alts": ["I, apenas.", "II, apenas.", "III, apenas.", "I e III, apenas.", "II e III, apenas."], "coms": ["Errada. A I é falsa: o contratado é obrigado a aceitar acréscimos ou supressões de até 25% do valor inicial atualizado (art. 125). A redução de 20% está dentro do limite.", "Errada. A II está correta, mas a III também está.", "Errada. A III está correta, mas a II também está.", "Errada. A I é falsa.", "CORRETA. II: na alteração unilateral que aumente ou diminua os encargos do contratado, a Administração deve restabelecer o equilíbrio econômico-financeiro no mesmo termo aditivo (art. 130). III: na supressão, os materiais já adquiridos e postos no local devem ser pagos pelos custos de aquisição comprovados e reajustados, cabendo indenização por outros danos comprovados (art. 129)."], "c": 4, "base": "Lei 14.133/2021, arts. 104, I, 124, I, 125, 129 e 130.", "dica": "Limites do art. 125: até 25% para acréscimos ou supressões em obras, serviços e compras; até 50% para acréscimos em reforma de edifício ou equipamento.", "id": "F2026.1-20", "cod": "FGV 2026.1-Q20"}, {"n": 12, "disc": "Direito Administrativo", "tema": "Extinção da concessão: encampação, caducidade e rescisão", "item": "A12-13 Serviços públicos/concessões/PPP", "nivel": "médio", "origem": "Inédita", "enun": "O Município Alfa concedeu, por 25 anos, o serviço de transporte coletivo urbano à sociedade empresária Beta. No 10º ano do contrato, sem qualquer inadimplemento da concessionária, o Prefeito decidiu retomar o serviço para prestá-lo diretamente, por entender que isso atenderia melhor ao interesse público.\nÀ luz da Lei nº 8.987/1995, assinale a afirmativa correta.", "alts": ["Trata-se de caducidade, que pode ser declarada por decreto do Poder Concedente, com indenização posterior.", "Trata-se de rescisão unilateral, que dispensa autorização legislativa e indenização, por se tratar de cláusula exorbitante.", "Trata-se de anulação, que produz efeitos ex tunc e afasta qualquer indenização.", "Trata-se de encampação, que depende de lei autorizativa específica e de prévio pagamento da indenização devida à concessionária.", "A retomada somente poderá ocorrer por meio de ação judicial proposta pelo Poder Concedente."], "coms": ["Errada. A caducidade pressupõe inexecução total ou parcial pela concessionária, apurada em processo administrativo (art. 38). Não é o caso.", "Errada. Na concessão, a retomada por interesse público tem nome e regime próprios (encampação), com lei específica e indenização prévia.", "Errada. A anulação pressupõe ilegalidade na concessão ou na licitação (art. 35, V), o que não ocorre aqui.", "CORRETA. Encampação é a retomada do serviço durante o prazo da concessão, por interesse público, mediante lei autorizativa específica e após prévio pagamento da indenização (art. 37).", "Errada. A ação judicial é exigida para a concessionária rescindir por inadimplemento do Poder Concedente (art. 39)."], "c": 3, "base": "Lei 8.987/1995, arts. 35 a 39.", "dica": "Encampação: interesse público, lei específica e indenização prévia. Caducidade: culpa da concessionária, processo administrativo, decreto e indenização posterior. Rescisão: iniciativa da concessionária, ação judicial e serviço sem interrupção até o trânsito em julgado.", "id": "i-761e00b4", "cod": "ADM-0007"}, {"n": 13, "disc": "Direito Administrativo", "tema": "Ocupação de bem público (Súmula 619/STJ)", "item": "A17 Bens públicos", "nivel": "fácil", "origem": "Inédita", "enun": "Há 20 anos, Josué ocupa, de forma mansa e pacífica, terreno pertencente ao Município Alfa, onde construiu sua casa. O Município ajuizou ação reivindicatória. Em contestação, Josué alegou usucapião e, subsidiariamente, pediu indenização pelas benfeitorias e direito de retenção.\nÀ luz da Constituição e da jurisprudência do STJ, assinale a afirmativa correta.", "alts": ["Josué não adquiriu o imóvel, mas tem direito à indenização pelas benfeitorias necessárias, por ser possuidor de boa-fé.", "Josué adquiriu o imóvel por usucapião extraordinária, pois exerceu posse por mais de 15 anos.", "Josué pode usucapir o imóvel, desde que se trate de bem dominical, não afetado a finalidade pública.", "A ocupação de bem público gera posse plena, oponível inclusive ao ente público, até o trânsito em julgado da reivindicatória.", "A ocupação indevida de bem público configura mera detenção, de natureza precária, insuscetível de retenção ou indenização por acessões e benfeitorias, e os imóveis públicos não são adquiridos por usucapião."], "coms": ["Errada. Em relação ao Poder Público não há posse, apenas detenção, e por isso não há indenização (Súmula 619/STJ).", "Errada. A imprescritibilidade dos bens públicos é regra constitucional (arts. 183, §3º, e 191, parágrafo único).", "Errada. Mesmo os bens dominicais são imprescritíveis (CC, art. 102).", "Errada. Perante o ente público há mera detenção. O STJ admite, porém, proteção possessória do ocupante contra OUTROS particulares.", "CORRETA. Súmula 619/STJ (detenção, sem retenção ou indenização) e CF, arts. 183, §3º, e 191, parágrafo único (imóveis públicos não se adquirem por usucapião). No mesmo sentido, a Súmula 340/STF."], "c": 4, "base": "CF, arts. 183, §3º, e 191, parágrafo único; CC, arts. 99 a 102; Súmulas 340/STF e 619/STJ.", "dica": "Contra o Poder Público, o ocupante tem detenção. Contra outro particular, pode ter proteção possessória (jurisprudência do STJ).", "id": "i-cafdf82f", "cod": "ADM-0008"}, {"n": 14, "disc": "Noções Gerais de Direito e Formação Humanística", "tema": "Conciliação x mediação", "item": "H2 Psicologia judiciária/conflitos", "nivel": "fácil", "origem": "Inédita", "enun": "Em ação de dissolução de sociedade entre dois irmãos, sócios há 20 anos de um restaurante familiar, o juiz designou audiência destinada à autocomposição. Ambos manifestaram interesse em preservar a relação familiar.\nConsiderando o CPC e a Lei nº 13.140/2015, assinale a afirmativa correta.", "alts": ["O mediador pode propor e impor soluções às partes, em razão da celeridade processual.", "A conciliação é a técnica mais indicada, pois o conciliador atua preferencialmente nos casos em que houver vínculo anterior entre as partes, podendo sugerir soluções.", "A mediação é a técnica mais indicada, pois o mediador atua preferencialmente nos casos em que houver vínculo anterior entre as partes, auxiliando-as a compreender as questões e os interesses em conflito, de modo que possam, pelo restabelecimento da comunicação, identificar por si próprias soluções consensuais.", "O mediador poderá, posteriormente, atuar como árbitro ou testemunha em processo relativo ao mesmo conflito.", "A confidencialidade não se aplica à mediação judicial, que se submete ao princípio da publicidade."], "coms": ["Errada. O mediador não impõe nem sugere soluções: auxilia as partes a construírem a solução. Quem pode sugerir é o conciliador, e nenhum dos dois impõe.", "Errada. O conciliador atua preferencialmente nos casos em que NÃO houver vínculo anterior (art. 165, §2º).", "CORRETA. É a literalidade do art. 165, §3º, do CPC. Havendo vínculo anterior (família, sociedade de longa data), a mediação é o meio adequado.", "Errada. A Lei 13.140 veda essa atuação (art. 7º) e impede o mediador, por 1 ano, de assessorar, representar ou patrocinar as partes (art. 6º).", "Errada. A confidencialidade é princípio da mediação e da conciliação (CPC, art. 166; Lei 13.140, arts. 2º, VII, e 30)."], "c": 2, "base": "CPC, arts. 165 e 166; Lei 13.140/2015, arts. 2º, 6º, 7º e 30.", "dica": "Sem vínculo anterior: conciliador, que pode sugerir soluções. Com vínculo anterior: mediador, que restabelece a comunicação para que as partes encontrem a solução.", "id": "i-14cf9da0", "cod": "HUM-0003"}, {"n": 15, "disc": "Noções Gerais de Direito e Formação Humanística", "tema": "STF e direitos da população LGBTQIA+", "item": "H5 Teoria geral do direito/gênero", "nivel": "médio", "origem": "ENAM 2025.2 – Q30", "enun": "Nos últimos anos, o Supremo Tribunal Federal (STF), em diversos julgados, tem enfrentado questões constitucionais relativas aos direitos fundamentais da população LGBTQIA+. Considerando a jurisprudência do STF sobre a população LGBTQIA+, avalie as afirmativas a seguir e assinale (V) para a verdadeira e (F) para a falsa. I. Os atos normativos do Ministério da Saúde e da Agência Nacional de Vigilância Sanitária (Anvisa), que consideram inaptos para a doação de sangue homens que mantiveram relações sexuais homoafetivas nos últimos 12 meses, são constitucionais. Com efeito, há critérios científicos que indicam que homens homossexuais integram um grupo de risco. Assim, não há a adoção de critério discriminatório em tal tipo de norma, e, sim, de critério cientificamente validado. II. A pessoa transgênero tem direito fundamental subjetivo à alteração de seu prenome e de sua classificação de gênero no registro civil, não se exigindo, para tanto, nada além da manifestação de vontade do indivíduo, o qual poderá exercer tal faculdade tanto pela via judicial como diretamente pela via administrativa. Essa alteração deve ser averbada à margem do assento de nascimento, vedada a inclusão do termo “transgênero”. III. Considerando que a Lei Maria da Penha foi editada para proteger a mulher contra a violência doméstica, a partir da compreensão de subordinação cultural da mulher na sociedade, é possível estender a incidência da Lei Maria da Penha aos casais homoafetivos do sexo masculino, sendo prescindível a presença de fatores contextuais que insiram o homem vítima da violência na posição de subalternidade dentro da relação. As afirmativas são, respectivamente,", "alts": ["V – V – V.", "F – V – V.", "V – F – F.", "F – F – F.", "F – V – F."], "coms": ["Errada. A I é falsa (veja a alternativa correta).", "Errada. A III é falsa: o STF exige fatores contextuais de subalternidade.", "Errada. A I é falsa e a II é verdadeira.", "Errada. A II é verdadeira.", "CORRETA (F–V–F). I: falsa, pois o STF declarou inconstitucionais as normas que restringiam a doação de sangue por homens que fazem sexo com homens, por discriminação baseada na orientação sexual, e não na conduta de risco (ADI 5.543). II: verdadeira, pois a alteração do prenome e do gênero depende só da autodeclaração, pela via judicial ou administrativa, vedada a menção a 'transgênero' (ADI 4.275; Tema 761). III: falsa, pois o STF estendeu a Lei Maria da Penha aos casais homoafetivos masculinos (MI 7.452), mas exigiu fatores contextuais que coloquem o homem vítima em posição de subalternidade na relação. A afirmativa diz que esses fatores são prescindíveis."], "c": 4, "base": "STF, ADI 5.543, ADI 4.275, RE 670.422 (Tema 761) e MI 7.452; Lei 11.340/2006.", "dica": "Nas afirmativas longas da FGV, procure a palavra que inverte o sentido. Aqui é 'prescindível' no lugar de 'imprescindível'.", "id": "F2025.2-30", "cod": "FGV 2025.2-Q30"}, {"n": 16, "disc": "Noções Gerais de Direito e Formação Humanística", "tema": "Discriminação indireta", "item": "H9 Antidiscriminação", "nivel": "médio", "origem": "Inédita", "enun": "Uma rede de supermercados passou a exigir, para contratação de operadores de caixa, que os candidatos residissem em bairros considerados 'de baixo índice de criminalidade' segundo levantamento interno. A política foi aplicada indistintamente a todos os candidatos. Estudo posterior demonstrou que a exigência excluiu proporcionalmente muito mais candidatos negros, majoritariamente residentes nas periferias da cidade.\nÀ luz do direito da antidiscriminação, a hipótese configura", "alts": ["discriminação direta, pois houve tratamento diferenciado explícito e intencional em razão da raça.", "ação afirmativa, por se tratar de medida voltada à segurança dos trabalhadores e clientes.", "conduta lícita, pois o critério foi aplicado indistintamente a todos, sem intenção discriminatória.", "discriminação interseccional, pois o critério combina raça e gênero.", "discriminação indireta, pois um critério aparentemente neutro produz impacto desproporcional sobre grupo protegido, independentemente da intenção de discriminar."], "coms": ["Errada. O critério era formalmente neutro (local de residência), sem menção a raça. Faltam o tratamento explícito e a intenção.", "Errada. Ação afirmativa é medida temporária para promover a igualdade de grupos desfavorecidos, e não para excluí-los.", "Errada. A aplicação uniforme não afasta a discriminação indireta, que se mede pelo impacto.", "Errada. A interseccionalidade envolve a sobreposição de fatores de discriminação (por exemplo, raça e gênero). O enunciado trata apenas do impacto racial de um critério neutro.", "CORRETA. A discriminação indireta (teoria do impacto desproporcional) está definida na Convenção Interamericana contra o Racismo (art. 1.2), que tem status de emenda constitucional, e se caracteriza pelo EFEITO, e não pela intenção. O Estatuto da Igualdade Racial também conceitua discriminação pelo 'objeto ou efeito' (art. 1º, parágrafo único, I)."], "c": 4, "base": "Convenção Interamericana contra o Racismo (Decreto 10.932/2022), art. 1º; Lei 12.288/2010, art. 1º; Protocolo para Julgamento com Perspectiva Racial (CNJ).", "dica": "Direta: intenção ou tratamento explícito. Indireta: critério neutro com efeito desproporcional. Estrutural: produzida pelo funcionamento normal das instituições. Interseccional: sobreposição de fatores.", "id": "i-72f7b5d6", "cod": "HUM-0004"}, {"n": 17, "disc": "Direitos Humanos", "tema": "Empresas e direitos humanos (Princípios de Ruggie)", "item": "DH1 Teoria geral/empresas", "nivel": "fácil", "origem": "Inédita", "enun": "Os Princípios Orientadores sobre Empresas e Direitos Humanos foram endossados pelo Conselho de Direitos Humanos da ONU em 2011, a partir do trabalho do Representante Especial John Ruggie.\nSobre esses Princípios, assinale a afirmativa correta.", "alts": ["Aplicam-se exclusivamente às empresas transnacionais, excluídas as de pequeno porte.", "Estruturam-se em três pilares: o dever do Estado de proteger os direitos humanos, a responsabilidade das empresas de respeitá-los e o acesso das vítimas a mecanismos de reparação.", "Atribuem às empresas o dever primário de proteger os direitos humanos, cabendo ao Estado papel apenas subsidiário.", "Constituem tratado internacional vinculante, ratificado pelo Brasil e incorporado com status supralegal.", "Afastam a necessidade de mecanismos judiciais, privilegiando apenas a autorregulação empresarial."], "coms": ["Errada. Aplicam-se a todas as empresas, independentemente do porte, setor ou estrutura, com proporcionalidade dos meios.", "CORRETA. É o marco 'Proteger, Respeitar e Reparar'. A responsabilidade empresarial de respeitar se materializa, sobretudo, pela devida diligência em direitos humanos.", "Errada. O dever de PROTEGER é do Estado. Às empresas cabe a responsabilidade de RESPEITAR.", "Errada. São soft law, sem natureza de tratado. No Brasil, o Decreto 9.571/2018 estabeleceu diretrizes nacionais de adoção voluntária.", "Errada. O terceiro pilar inclui mecanismos judiciais e extrajudiciais, estatais e não estatais, de reparação."], "c": 1, "base": "Princípios Orientadores da ONU sobre Empresas e Direitos Humanos (2011); Decreto 9.571/2018.", "dica": "O marco é 'Proteger (Estado), Respeitar (empresas), Reparar (acesso a remédios)'. O edital cita o tema em DH (item 1) e em Civil (pessoas jurídicas).", "id": "i-4a9ab678", "cod": "DHU-0002"}, {"n": 18, "disc": "Direitos Humanos", "tema": "Pessoas indígenas no processo penal (Resolução CNJ 287/2019)", "item": "DH9 Povos originários", "nivel": "difícil", "origem": "ENAM 2025.1 – Q35", "enun": "Conforme dados do Censo de 2022, dos 5.570 municípios brasileiros, 4.833 possuíam população indígena e mais da metade dessa população vivia nas cidades. Acerca dos Direitos Humanos dos Povos Indígenas e das Resoluções do Conselho Nacional de Justiça sobre direitos e garantias dos povos originários, avalie as afirmativas a seguir. I. O Conselho Nacional de Justiça estabelece, por Resolução, que a identificação da pessoa como indígena, bem como as informações acerca de sua etnia e da língua por ela falada, deve constar no registro de todos os atos processuais. II. A autoridade judicial poderá adotar ou homologar práticas de resolução de conflitos e de responsabilização em conformidade com costumes e normas da própria comunidade indígena. III. Com exceção da imposição de medida cautelar alternativa à prisão, a autoridade judicial deverá adaptá-la às condições e aos prazos que sejam compatíveis com os costumes, o local de residência e as tradições da pessoa indígena, observando o Protocolo I da Resolução CNJ nº 213/2015. Está correto o que se afirma em", "alts": ["I, apenas.", "I e II, apenas.", "I e III, apenas.", "II e III, apenas.", "I, II e III."], "coms": ["Errada. A II também está correta.", "CORRETA. I: a identificação como indígena, a etnia e a língua falada devem constar do registro de todos os atos processuais (Res. CNJ 287/2019). II: a autoridade judicial pode adotar ou homologar práticas de resolução de conflitos e de responsabilização conforme os costumes e normas da própria comunidade. III: falsa por causa da expressão 'com exceção': a adaptação aos costumes, ao local de residência e às tradições vale TAMBÉM para as medidas cautelares alternativas à prisão.", "Errada. A III é falsa.", "Errada. A III é falsa.", "Errada. A III é falsa."], "c": 1, "base": "Resolução CNJ 287/2019; Convenção 169 da OIT, arts. 8º a 10; Resolução CNJ 213/2015.", "dica": "A Resolução CNJ 287/2019 garante intérprete, laudo antropológico, cumprimento de pena preferencialmente em regime especial e respeito aos mecanismos próprios da comunidade.", "id": "F2025.1-35", "cod": "FGV 2025.1-Q35"}, {"n": 19, "disc": "Direito Processual Civil", "tema": "Cumprimento de sentença por quantia certa", "ite
