<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Me chame de majestade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#f6f3ec; --card:#fffdf9; --ink:#15213a; --ink2:#46506a; --mute:#8a90a0; --line:#e6e0d3; --line2:#d9d1bf;
 --navy:#15213a; --navy2:#24365c; --amber:#c9822b; --amberbg:#fbf1e1; --sel:#eaf0fa;
 --ok:#2b7a50; --okbg:#e8f4ed; --bad:#b9412f; --badbg:#fbecea;
 --f:#2b7a50; --m:#c9822b; --d:#b9412f;
 --head:'Fraunces',Georgia,serif; --sans:'Inter',system-ui,-apple-system,sans-serif; --serif:'Source Serif 4',Georgia,serif;
 --r:14px; --sh:0 1px 2px rgba(21,33,58,.04),0 6px 24px rgba(21,33,58,.06);
}
*{box-sizing:border-box} html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans)}
a{color:var(--navy2)} button{font-family:inherit}
/* topo */
.top{background:var(--navy);color:#fff}
.topin{max-width:1080px;margin:0 auto;padding:14px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:11px}
.logo .mk{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--amber),#e3a54f);display:grid;place-items:center;font:700 16px var(--head);color:var(--navy)}
.logo b{font:600 18px var(--head);letter-spacing:.2px;display:block;line-height:1.1}
.logo small{font-size:11.5px;color:#aeb8cc;letter-spacing:.3px}
.cd{margin-left:auto;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:99px;padding:6px 13px;font-size:13px;color:#e8edf6}
.cd b{color:#ffd59a}
.tabs{max-width:1080px;margin:0 auto;padding:0 14px;display:flex;gap:2px;overflow-x:auto}
.tabs a{color:#c3cbdb;text-decoration:none;padding:11px 14px 12px;font-size:14px;font-weight:500;border-bottom:2.5px solid transparent;white-space:nowrap}
.tabs a.on{color:#fff;border-color:var(--amber)} .tabs a:hover{color:#fff}
main{max-width:1080px;margin:0 auto;padding:28px 22px 90px}
h1{font:600 30px/1.15 var(--head);margin:0 0 6px;letter-spacing:-.2px}
h2{font:600 21px var(--head);margin:34px 0 14px}
.kick{font-size:12px;font-weight:600;letter-spacing:.9px;text-transform:uppercase;color:var(--mute);margin:0 0 6px}
.sub{color:var(--ink2);margin:0 0 22px;max-width:760px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;box-shadow:var(--sh)}
.grid{display:grid;gap:16px} .g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:820px){.g2,.g3{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;background:var(--navy);color:#fff;padding:11px 18px;border-radius:10px;font:600 14.5px var(--sans);cursor:pointer;text-decoration:none;transition:.15s}
.btn:hover{background:var(--navy2);transform:translateY(-1px)}
.btn.amber{background:var(--amber);color:#1b1306} .btn.amber:hover{background:#d6913a}
.btn.ghost{background:transparent;color:var(--navy);border:1.5px solid var(--line2)} .btn.ghost:hover{background:#fff;border-color:var(--navy2)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;background:#efece4;color:var(--ink2);white-space:nowrap}
.chip.navy{background:var(--sel);color:var(--navy2)} .chip.amber{background:var(--amberbg);color:#8a5a14}
.chip.ok{background:var(--okbg);color:var(--ok)} .chip.bad{background:var(--badbg);color:var(--bad)}
.chip.fgv{background:#1f2f52;color:#fff}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.stat{font:600 34px/1 var(--head);color:var(--navy)} .stat small{font:500 14px var(--sans);color:var(--mute);margin-left:3px}
.note{font-size:13px;color:var(--mute)}
/* hoje */
.hero{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;padding:26px 28px;border-radius:18px;background:linear-gradient(135deg,#fffdf9 0%,#fbf4e6 100%);border:1px solid var(--line);box-shadow:var(--sh)}
@media(max-width:700px){.hero{grid-template-columns:1fr;text-align:center;padding:22px}.hero .acts{justify-content:center}}
.ring{width:150px;height:150px;margin:auto}
.hero h1{font-size:32px}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:6px}
.wd{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:9px 6px;text-align:center;text-decoration:none;color:inherit;font-size:12px}
.wd b{display:block;font:600 16px var(--head);margin:2px 0}
.wd.today{border:2px solid var(--amber)} .wd.sim{background:#eef2f9} .wd.prova{background:var(--navy);color:#fff}
.wd .st{height:6px;border-radius:3px;margin:5px 8px 0;background:#ebe6da}
/* barras */
.bar{display:grid;grid-template-columns:150px 1fr 70px;gap:12px;align-items:center;margin:9px 0;font-size:13.5px}
@media(max-width:600px){.bar{grid-template-columns:100px 1fr 60px;font-size:12.5px}}
.trk{position:relative;height:10px;background:#ece7db;border-radius:6px}
.fil{height:100%;border-radius:6px}
.mk70{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.55}
.pv{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
/* quiz */
.qbar{position:sticky;top:0;z-index:20;background:rgba(246,243,236,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin:0 -22px 18px;padding:10px 22px}
.qbarin{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.qbar h3{margin:0;font:600 17px var(--head)}
.prog{flex:1;min-width:140px;height:8px;background:#e6e0d3;border-radius:5px;overflow:hidden;display:flex}
.prog i{display:block;height:100%}
.mode{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.mode button{border:0;background:none;padding:6px 11px;font:600 12.5px var(--sans);color:var(--ink2);cursor:pointer}
.mode button.on{background:var(--navy);color:#fff}
.timer{font:700 14px var(--sans);font-variant-numeric:tabular-nums;color:var(--navy);background:#fff;border:1px solid var(--line);padding:5px 10px;border-radius:8px}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 28px;box-shadow:var(--sh)}
@media(max-width:600px){.qcard{padding:20px 16px;border-radius:14px}}
.qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.qn{font:600 22px var(--head);color:var(--navy);margin-right:4px}
.tema{font-size:13px;color:var(--mute);margin:-6px 0 14px}
.enun{font:17px/1.68 var(--serif);white-space:pre-line;margin-bottom:18px;color:#1c2436}
.alt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:13px 16px 13px 52px;margin:9px 0;position:relative;font:16px/1.55 var(--serif);color:var(--ink);cursor:pointer;transition:border-color .12s,background .12s}
.alt:hover{border-color:#b8c4da;background:#fbfcff}
.alt .L{position:absolute;left:14px;top:12px;width:26px;height:26px;border-radius:50%;border:1.5px solid #b6bfcf;display:grid;place-items:center;font:700 12.5px var(--sans);color:var(--ink2);background:#fff}
.alt.sel{background:var(--sel);border-color:var(--navy2)} .alt.sel .L{background:var(--navy);border-color:var(--navy);color:#fff}
.alt.ok{background:var(--okbg);border-color:#9ccdb2} .alt.ok .L{background:var(--ok);border-color:var(--ok);color:#fff}
.alt.bad{background:var(--badbg);border-color:#e4a79d} .alt.bad .L{background:var(--bad);border-color:var(--bad);color:#fff}
.alt.lk{cursor:default} .alt.lk:hover{background:inherit}
.alt.dim{opacity:.92}
.com{font:14px/1.6 var(--sans);color:var(--ink2);margin-top:9px;padding-top:9px;border-top:1px dashed var(--line2)}
.com b{color:var(--ok)}
.fb{display:flex;align-items:center;gap:10px;margin:4px 0 10px;font:600 15px var(--sans)}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.box{border-radius:12px;padding:13px 16px;margin-top:12px;font-size:14px}
.box.base{background:#f1eee6} .box.dica{background:var(--amberbg);border-left:3px solid var(--amber)}
.qnav{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}
details.mapa{margin:18px 0 0}
details.mapa summary{cursor:pointer;font-weight:600;font-size:13.5px;color:var(--ink2);list-style:none}
details.mapa summary::-webkit-details-marker{display:none}
.grid40{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:12px}
.grid40 button{height:36px;border:1.5px solid var(--line);background:#fff;border-radius:8px;font:600 12.5px var(--sans);cursor:pointer;color:var(--ink2)}
.grid40 button.cur{box-shadow:0 0 0 2px var(--navy)} .grid40 button.ans{background:var(--sel);border-color:#c4d2ea}
.grid40 button.ok{background:var(--okbg);color:var(--ok);border-color:#b2d8c2} .grid40 button.bad{background:var(--badbg);color:var(--bad);border-color:#ebbdb5}
.result{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center}
@media(max-width:640px){.result{grid-template-columns:1fr}}
/* tabelas/listas */
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t td,table.t th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--mute);font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:9px}
.calh{font-size:11px;font-weight:600;color:var(--mute);text-transform:uppercase;text-align:center;letter-spacing:.6px}
.day{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:104px;font-size:12.5px;display:flex;flex-direction:column;gap:4px;text-decoration:none;color:inherit;transition:.15s}
a.day:hover{border-color:var(--navy2);transform:translateY(-1px);box-shadow:var(--sh)}
.day .d{font:600 15px var(--head)} .day .t{font-weight:600}
.day.simulado{background:#eef2f9;border-color:#cfdbee} .day.prova{background:var(--navy);color:#fff;border-color:var(--navy)}
.day.descanso,.day.revisao{background:#f1ede4} .day.hoje{outline:2.5px solid var(--amber);outline-offset:1px}
.day .st{margin-top:auto} .day.empty{visibility:hidden}
@media(max-width:760px){.cal{grid-template-columns:1fr}.calh,.day.empty{display:none}.day{min-height:0}}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.filters button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:5px 13px;font:500 12.5px var(--sans);cursor:pointer;color:var(--ink2)}
.filters button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.err{border-top:1px solid var(--line);padding:18px 0}
.err:first-child{border-top:0;padding-top:4px}
textarea{width:100%;min-height:96px;font:12px monospace;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}
.modal{position:fixed;inset:0;background:rgba(15,22,38,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.on{display:flex} .modal .card{max-width:520px;width:100%}
.cov{display:grid;grid-template-columns:1fr 60px 90px;gap:8px;align-items:center;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line)}
.cov:last-child{border-bottom:0}

.opt{display:flex;gap:8px;flex-wrap:wrap}
.opt button{border:1.5px solid var(--line2);background:#fff;border-radius:10px;padding:8px 14px;font:600 13.5px var(--sans);cursor:pointer;color:var(--ink2)}
.opt button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.opt button:disabled{opacity:.35;cursor:not-allowed}
.lbl{font-size:12px;font-weight:600;letter-spacing:.7px;text-transform:uppercase;color:var(--mute);margin:18px 0 8px}
.simc{display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid var(--line)}
.simc:last-child{border-bottom:0}
.chart{width:100%;height:auto;display:block}
.hist{display:grid;grid-template-columns:110px 1fr 90px 90px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.hist:last-child{border-bottom:0}
@media(max-width:600px){.hist{grid-template-columns:80px 1fr 70px}.hist .hx{display:none}}
</style>
</head>

 </nav>

<script>
const D={"gerado": "03/11/2026 11:05", "banco": [{"n": 1, "disc": "Direito Constitucional", "tema": "Trabalho do menor (CF, art. 7º, XXXIII)", "item": "C08t Constitucional do Trabalho", "nivel": "fácil", "origem": "Inédita", "enun": "Em fiscalização realizada em uma sociedade empresária do ramo de embalagens, o auditor fiscal do trabalho constatou as seguintes situações:\n• Ana, de 15 anos, contratada como aprendiz, trabalha das 8h às 12h no setor administrativo;\n• Bruno, de 17 anos, empregado com carteira assinada, trabalha das 22h às 4h na linha de produção, com autorização escrita dos pais;\n• Carla, de 13 anos, foi admitida como aprendiz e auxilia no almoxarifado no período da tarde.\nConsiderando o disposto na Constituição Federal de 1988, assinale a afirmativa correta.", "alts": ["As três situações são regulares, pois a aprendizagem é admitida a partir dos 12 anos e o trabalho noturno, a partir dos 16 anos.", "Apenas a situação de Bruno é regular, porque a aprendizagem somente é admitida a partir dos 16 anos de idade.", "As três situações são irregulares, pois a Constituição veda qualquer trabalho ao menor de 18 anos, salvo na condição de aprendiz.", "As situações de Ana e Bruno são regulares, pois este já completou 16 anos e possui autorização escrita dos pais; apenas a de Carla é irregular.", "Apenas a situação de Ana é regular. Bruno não pode trabalhar no período noturno por ser menor de 18 anos, e Carla não pode trabalhar nem mesmo como aprendiz."], "coms": ["Errada. A aprendizagem começa aos 14 anos, e o trabalho noturno só é permitido a partir dos 18.", "Errada. A aprendizagem é admitida a partir dos 14 anos, e Bruno está em situação irregular.", "Errada. A CF permite o trabalho comum a partir dos 16 anos, exceto o noturno, perigoso ou insalubre, e a aprendizagem a partir dos 14.", "Errada. A proibição de trabalho noturno ao menor de 18 anos é absoluta e não é afastada por autorização dos pais.", "CORRETA. O art. 7º, XXXIII, da CF proíbe trabalho noturno, perigoso ou insalubre a menores de 18 anos e qualquer trabalho a menores de 16, salvo na condição de aprendiz, a partir dos 14. Ana (15, aprendiz, diurno) está regular. Bruno (17, noturno) e Carla (13) estão irregulares."], "c": 4, "base": "CF, art. 7º, XXXIII; CLT, arts. 403 e 428.", "dica": "Constitucional do Trabalho caiu 13 vezes nas 5 provas. Os números do art. 7º, XXXIII: 14 anos (aprendiz), 16 anos (trabalho comum) e 18 anos (noturno, perigoso, insalubre).", "id": "i-b711cc52", "cod": "CON-0001"}, {"n": 2, "disc": "Direito Constitucional", "tema": "IPVA e alienação fiduciária (Tema 1.153/STF)", "item": "C14 Tributário/finanças", "nivel": "difícil", "origem": "ENAM 2026.1 – Q15", "enun": "A Lei Ordinária do Estado Beta XXX/2025, que trata de certos aspectos do Imposto sobre a Propriedade de Veículos Automotores (IPVA) naquele ente federativo, passou a prever que o credor fiduciário seria responsável tributário pelo pagamento do IPVA incidente sobre veículos automotores terrestres, aquáticos ou aéreos, alienados fiduciariamente. Ainda segundo a mesma lei, caso posteriormente ocorresse a consolidação da propriedade plena sobre o veículo na pessoa do credor fiduciário, este passaria à condição de contribuinte do IPVA, e não mais de responsável tributário. Diante desse cenário, à luz da Constituição Federal e do entendimento dominante do Supremo Tribunal Federal (STF) sobre o tema, assinale a afirmativa correta.", "alts": ["A tentativa de regulamentar a sujeição passiva tributária do IPVA por lei ordinária estadual viola a reserva constitucional de lei complementar.", "Por ausência de previsão constitucional, não pode haver incidência de IPVA sobre veículos automotores aquáticos ou aéreos, não podendo se falar em indicação de responsável tributário para hipóteses de incidência inconstitucionais.", "O credor fiduciário, por sua condição de proprietário de veículo automotor alienado fiduciariamente, pode ser indicado como contribuinte do IPVA desde o momento da celebração do contrato de alienação fiduciária, mas não como mero responsável tributário.", "Mesmo que ocorresse a consolidação da propriedade plena do credor fiduciário sobre o bem, ele não poderia figurar como sujeito passivo do IPVA de veículo automotor alienado fiduciariamente, pois não detém a porção mais substancial dos atributos da propriedade.", "É inconstitucional a eleição do credor fiduciário como sujeito passivo do IPVA incidente sobre veículo alienado fiduciariamente, ressalvada a hipótese de figurar como sujeito passivo dessa exação, caso ocorra a consolidação de sua propriedade plena sobre o bem."], "coms": ["Errada. A definição de responsáveis tributários pelo próprio Estado, em lei ordinária, é compatível com o CTN (arts. 121 e 128). O vício não está na espécie normativa, mas na escolha de quem não manifesta a riqueza tributada.", "Errada. A EC 132/2023 passou a prever expressamente a incidência do IPVA sobre veículos aquáticos e aéreos (CF, art. 155, §6º, III), ressalvadas as exceções do próprio dispositivo.", "Errada. Enquanto vigente a alienação fiduciária, o credor tem propriedade resolúvel apenas em garantia e não reúne os atributos de uso e fruição. Por isso não pode ser contribuinte nem responsável.", "Errada. Com a consolidação da propriedade plena (por exemplo, após o inadimplemento e a retomada do bem), o credor passa a ser proprietário e pode, a partir daí, figurar como sujeito passivo.", "CORRETA. Tese do Tema 1.153 do STF (RE 1.355.870): é inconstitucional eleger o credor fiduciário como contribuinte ou responsável pelo IPVA do veículo alienado fiduciariamente, ressalvada a hipótese de consolidação da propriedade plena."], "c": 4, "base": "CF, art. 155, III e §6º (EC 132/2023); CTN, arts. 121 e 128; STF, Tema 1.153.", "dica": "Tributário cai cerca de 3 vezes por prova dentro de Constitucional. Revise imunidades, anterioridades, competência residual e as teses do STF sobre IPVA, ICMS e ITCMD.", "id": "F2026.1-15", "cod": "FGV 2026.1-Q15"}, {"n": 3, "disc": "Direito Constitucional", "tema": "Inviolabilidade do domicílio e flagrante (Tema 280/STF)", "item": "C07 Garantias processuais/prova/prisão", "nivel": "médio", "origem": "Inédita", "enun": "Policiais militares em patrulhamento receberam, por telefone, denúncia anônima de que Marcos guardava drogas em sua residência. Às 23h, dirigiram-se ao local e, sem mandado judicial, ingressaram na casa, onde apreenderam 2 kg de cocaína. No auto de prisão em flagrante, limitaram-se a registrar que 'havia notícia de tráfico no local'. A defesa sustenta a ilicitude da prova.\nÀ luz da Constituição e da jurisprudência do Supremo Tribunal Federal, assinale a afirmativa correta.", "alts": ["Por se tratar de crime permanente, o flagrante autoriza o ingresso a qualquer hora, sendo irrelevante a existência de elementos prévios que indicassem a prática delitiva.", "A ilicitude da prova pode ser relativizada pelo princípio da proporcionalidade, em favor da sociedade, sempre que a quantidade de droga apreendida for expressiva.", "A Constituição veda o ingresso em domicílio durante a noite em qualquer hipótese, inclusive em caso de flagrante delito.", "A entrada forçada em domicílio sem mandado, mesmo em período noturno, só é lícita quando amparada em fundadas razões, devidamente justificadas a posteriori, que indiquem situação de flagrante delito, sob pena de responsabilidade dos agentes e de nulidade dos atos praticados.", "A denúncia anônima, por si só, constitui fundada razão suficiente para o ingresso domiciliar, desde que confirmada pela apreensão da droga."], "coms": ["Errada. A permanência do tráfico permite o flagrante a qualquer tempo, mas o STF exige fundadas razões anteriores ao ingresso. A descoberta posterior da droga não legitima a entrada.", "Errada. A jurisprudência admite o aproveitamento da prova ilícita apenas em favor do réu (pro reo), nunca pro societate.", "Errada. O art. 5º, XI, permite o ingresso a qualquer hora em caso de flagrante, desastre ou para prestar socorro. A restrição ao período diurno vale para o cumprimento de determinação judicial.", "CORRETA. Tese do Tema 280 do STF (RE 603.616). A justificativa genérica ('havia notícia de tráfico') não demonstra fundadas razões prévias ao ingresso, o que contamina a prova (CPP, art. 157).", "Errada. A denúncia anônima isolada não basta. O resultado da diligência (encontrar a droga) não convalida o ingresso ilegal."], "c": 3, "base": "CF, art. 5º, XI e LVI; CPP, arts. 157 e 302; STF, Tema 280 (RE 603.616).", "dica": "O que se exige são fundadas razões ANTES da entrada, justificadas depois. Achar a droga não salva o ingresso ilícito.", "id": "i-84820f34", "cod": "CON-0002"}, {"n": 4, "disc": "Direito Constitucional", "tema": "Normas de reprodução obrigatória", "item": "C15 Controle de constitucionalidade", "nivel": "médio", "origem": "ENAM 2025.2 – Q6", "enun": "A respeito dos diferentes tipos e formas de controle de constitucionalidade, analise as afirmativas a seguir e assinale (V) para a verdadeira e (F) para a falsa. ( ) As normas constitucionais de reprodução obrigatória têm validade nacional e, por isso, integram a ordem jurídica dos Estados-membros. ( ) Se as normas de reprodução obrigatória estiverem omissas na Constituição do Estado-membro, estas não integram a sua ordem jurídica. ( ) As normas constitucionais de reprodução obrigatória gozam da existência de discricionariedade do Estado-membro para a sua incorporação no seu ordenamento. As afirmativas são, respectivamente,", "alts": ["V – F – F.", "V – F – V.", "V – V – F.", "F – V – V.", "F – V – F."], "coms": ["CORRETA (V–F–F). 1ª: as normas de reprodução obrigatória têm validade nacional e integram a ordem estadual. 2ª: falsa, pois elas incidem mesmo que a Constituição Estadual seja omissa, por força do próprio texto federal. 3ª: falsa, pois o Estado não tem discricionariedade para deixar de incorporá-las.", "Errada. A 3ª assertiva é falsa: não há discricionariedade estadual quanto às normas de reprodução obrigatória.", "Errada. A 2ª é falsa: a omissão da Constituição Estadual não impede a incidência dessas normas.", "Errada. A 1ª é verdadeira e a 2ª e a 3ª são falsas.", "Errada. A 1ª é verdadeira e a 2ª é falsa."], "c": 0, "base": "CF, arts. 25 e 125, §2º; STF, Tema 484 (RE 650.898) e Rcl 383.", "dica": "Os TJs podem usar como parâmetro de ADI estadual normas da CF de reprodução obrigatória, mesmo que não reproduzidas na Constituição Estadual (Tema 484). Cabe RE ao STF dessa decisão.", "id": "F2025.2-6", "cod": "FGV 2025.2-Q6"}, {"n": 5, "disc": "Direito Constitucional", "tema": "Repartição de competências legislativas", "item": "C09 Federação/competências/intervenção", "nivel": "médio", "origem": "Inédita", "enun": "Três leis foram questionadas quanto à competência legislativa do ente que as editou:\nI. Lei do Município Alfa fixou tempo máximo de espera para atendimento nas filas das agências bancárias situadas em seu território.\nII. Lei do Estado Beta obrigou as concessionárias do serviço público federal de energia elétrica a remover, sem custo para o consumidor, os postes instalados em frente a imóveis particulares.\nIII. Lei do Estado Gama tornou obrigatório o uso de farol baixo durante o dia em todas as rodovias estaduais.\nÀ luz da jurisprudência do Supremo Tribunal Federal, é compatível com a Constituição Federal o que consta em", "alts": ["I, apenas.", "II, apenas.", "I e III, apenas.", "II e III, apenas.", "I, II e III."], "coms": ["CORRETA. I: o STF reconhece o interesse local para fixar tempo de espera em filas bancárias (CF, art. 30, I; Tema 272). II: lei estadual não pode interferir nas obrigações das concessionárias de serviço público federal (arts. 21, XII, b, e 22, IV). III: legislar sobre trânsito é competência privativa da União (art. 22, XI).", "Errada. A II invade a competência da União sobre energia elétrica e sobre a concessão federal.", "Errada. A III viola a competência privativa da União para legislar sobre trânsito e transporte (art. 22, XI).", "Errada. A II e a III são inconstitucionais, e a I é compatível.", "Errada. Apenas a I é compatível."], "c": 0, "base": "CF, arts. 21, XII, b; 22, IV e XI; 30, I; STF, Tema 272 (RE 610.221).", "dica": "Fila de banco e horário do comércio são do Município (interesse local). Trânsito, energia e telecomunicações são da União, e os Estados tropeçam aqui com frequência.", "id": "i-485081c0", "cod": "CON-0003"}, {"n": 6, "disc": "Direito Constitucional", "tema": "Poderes das Comissões Parlamentares de Inquérito", "item": "C10 Legislativo/processo legislativo/TCU", "nivel": "médio", "origem": "Inédita", "enun": "A Assembleia Legislativa do Estado Delta instalou Comissão Parlamentar de Inquérito, por requerimento de um terço de seus membros, para apurar, em prazo certo, irregularidades em contratos de merenda escolar. No curso dos trabalhos, a CPI deliberou, por maioria e em decisão fundamentada: (i) a quebra do sigilo bancário do empresário investigado; (ii) a interceptação das comunicações telefônicas do empresário; e (iii) a busca e apreensão de documentos no escritório da empresa.\nSobre as deliberações da CPI, à luz da jurisprudência do STF, assinale a afirmativa correta.", "alts": ["A quebra do sigilo bancário depende de decisão unânime dos membros da CPI.", "As três deliberações são válidas, pois a CPI possui poderes de investigação próprios das autoridades judiciais.", "A quebra do sigilo bancário e a interceptação telefônica são válidas, mas a busca e apreensão depende de autorização judicial.", "As três deliberações são inválidas, porque CPIs estaduais não dispõem dos poderes de investigação próprios das autoridades judiciais.", "Apenas a quebra do sigilo bancário é válida, pois a interceptação telefônica e a busca e apreensão estão sujeitas à cláusula de reserva de jurisdição."], "coms": ["Errada. Exige-se decisão fundamentada do colegiado, por maioria, e não unanimidade.", "Errada. Os 'poderes de investigação' não abrangem as matérias sob reserva de jurisdição, como a interceptação telefônica e a busca domiciliar.", "Errada. A interceptação telefônica é reservada ao juiz (CF, art. 5º, XII; Lei 9.296/1996). A CPI pode acessar dados telefônicos (registros), não o conteúdo das conversas.", "Errada. O STF reconhece às CPIs estaduais, por simetria, o poder de quebrar sigilo bancário (ACO 730).", "CORRETA. As CPIs têm poderes de investigação próprios das autoridades judiciais (CF, art. 58, §3º) e podem, fundamentadamente, quebrar sigilos bancário, fiscal e de dados telefônicos. O STF estendeu esse poder às CPIs estaduais (ACO 730). Interceptação telefônica (art. 5º, XII) e busca domiciliar (art. 5º, XI) exigem ordem judicial."], "c": 4, "base": "CF, arts. 5º, XI e XII, e 58, §3º; STF, MS 23.452 e ACO 730.", "dica": "A CPI pode quebrar sigilos bancário, fiscal e de dados telefônicos e convocar testemunhas. Não pode interceptar conversas, fazer busca domiciliar nem decretar prisão (salvo em flagrante).", "id": "i-8ef167c6", "cod": "CON-0004"}, {"n": 7, "disc": "Direito Constitucional", "tema": "Acumulação de cargos e teto remuneratório", "item": "C11 Executivo/Adm Pública/servidores", "nivel": "médio", "origem": "Inédita", "enun": "Helena, médica, ocupa dois cargos efetivos de médico, um no Município Alfa e outro no Estado Beta, com jornadas de 40 horas e 30 horas semanais, respectivamente, em horários que não se sobrepõem e com deslocamento compatível. Recém-empossada no segundo cargo, foi notificada de que (i) a acumulação seria ilícita por ultrapassar o limite de 60 horas semanais previsto em parecer administrativo; e (ii) caso mantida, a soma das remunerações deveria observar o teto constitucional.\nÀ luz da Constituição e da jurisprudência do STF, assinale a afirmativa correta.", "alts": ["A acumulação é vedada, pois os cargos pertencem a entes federativos distintos.", "A acumulação é lícita independentemente da compatibilidade de horários, por se tratar de cargos da área de saúde.", "A acumulação é lícita, mas o teto remuneratório deve incidir sobre o somatório das remunerações percebidas.", "A acumulação é lícita se houver compatibilidade de horários aferida no caso concreto, e o teto remuneratório deve incidir sobre cada uma das remunerações, isoladamente.", "A acumulação é ilícita, pois a soma das jornadas ultrapassa 60 horas semanais, limite que a jurisprudência do STF reconhece como objetivo e intransponível."], "coms": ["Errada. A CF não exige que os cargos sejam do mesmo ente. A proibição de acumular se estende a toda a Administração direta e indireta de todos os entes (art. 37, XVII), ressalvadas as hipóteses permitidas.", "Errada. A compatibilidade de horários é requisito constitucional expresso (art. 37, XVI).", "Errada. Nas acumulações autorizadas pela CF, o teto incide sobre cada remuneração isoladamente (Temas 377 e 384).", "CORRETA. A CF admite a acumulação de dois cargos privativos de profissionais de saúde com profissão regulamentada, havendo compatibilidade de horários (art. 37, XVI, c). O STF afastou o limite abstrato de jornada: a compatibilidade se afere no caso concreto (Tema 1.081). Na acumulação lícita, o teto incide sobre cada vínculo isoladamente (Temas 377 e 384).", "Errada. O STF fixou que a existência de norma infraconstitucional limitando a jornada não é, por si só, óbice à acumulação, desde que haja compatibilidade de horários (Tema 1.081)."], "c": 3, "base": "CF, art. 37, XI, XVI, c, e XVII; STF, Temas 377, 384 e 1.081.", "dica": "As acumulações permitidas são dois de professor, um de professor com outro técnico ou científico, e dois de saúde, sempre com compatibilidade de horários. Nelas, o teto incide sobre cada cargo separadamente.", "id": "i-b7c92499", "cod": "CON-0005"}, {"n": 8, "disc": "Direito Administrativo", "tema": "Lei de Liberdade Econômica — atividade de baixo risco", "item": "A15 Regulação/agências/LGPD/liberdade econômica", "nivel": "fácil", "origem": "Inédita", "enun": "Regina, costureira, decidiu formalizar a atividade que exerce em sua própria residência, sem empregados, como microempreendedora individual. Ao procurar a prefeitura, foi informada de que não poderia iniciar as atividades sem obter previamente alvará de funcionamento e licença sanitária, cujo prazo de análise seria de 120 dias. A atividade está classificada, no regulamento aplicável, como de baixo risco.\nÀ luz da Lei nº 13.874/2019 (Lei de Liberdade Econômica), assinale a afirmativa correta.", "alts": ["A dispensa de atos de liberação aplica-se apenas às atividades exercidas em imóvel comercial, não alcançando a residência do empreendedor.", "Regina pode desenvolver a atividade econômica de baixo risco sem a necessidade de quaisquer atos públicos de liberação, sem prejuízo da fiscalização posterior.", "A exigência de alvará prévio é legítima, pois o poder de polícia municipal não sofre limitação por lei federal.", "A dispensa de alvará exige que a atividade seja exercida com, no mínimo, um empregado registrado.", "Regina poderá iniciar a atividade apenas após o decurso do prazo de 120 dias, hipótese em que se opera a aprovação tácita."], "coms": ["Errada. O dispositivo alcança atividade em propriedade privada própria ou de terceiros, inclusive a residência.", "CORRETA. O art. 3º, I, assegura a toda pessoa o direito de desenvolver atividade de baixo risco, em propriedade privada própria ou de terceiros consensual, sem necessidade de atos públicos de liberação. A fiscalização é posterior.", "Errada. A Lei 13.874 é norma geral de direito econômico (CF, art. 24, I) e vincula os Municípios, ressalvadas as competências que ela própria preserva.", "Errada. Não existe esse requisito.", "Errada. Na atividade de baixo risco não se exige ato de liberação algum. A aprovação tácita (art. 3º, IX) é para as atividades que dependem de liberação, após o prazo fixado pelo órgão."], "c": 1, "base": "Lei 13.874/2019, arts. 1º, 3º, I e IX, e 4º; CF, arts. 170 e 174.", "dica": "O art. 4º lista o 'abuso do poder regulatório' (criar reserva de mercado, exigir especificação técnica desnecessária etc.). Leia-o junto com o art. 3º.", "id": "i-fa005555", "cod": "ADM-0001"}, {"n": 9, "disc": "Direito Administrativo", "tema": "Contratação integrada e reequilíbrio (Lei 14.133/2021)", "item": "A08 Licitação", "nivel": "difícil", "origem": "ENAM 2025.1 – Q19", "enun": "Após regular procedimento licitatório, o Estado X celebrou um contrato administrativo de execução de obra pública sob o regime de contratação integrada, no qual a empresa contratada se responsabilizaria tanto pela elaboração dos projetos básico e executivo quanto pela execução da obra (Art. 6º, inciso XXXII, da Lei nº 14.133/2021). Durante a execução do contrato, a contratada verificou que os quantitativos indicados no projeto básico eram inferiores ao necessário, fato que demandaria a alteração contratual para um pequeno acréscimo. Considerando que essa alteração resultaria em custos adicionais, a contratada solicitou a revisão do contrato para restabelecer o equilíbrio econômico-financeiro inicial. O Estado X indeferiu o pedido, sob o fundamento de que a revisão contratual não era cabível para o evento em questão. Inconformada com a situação, a sociedade empresária ajuizou demanda judicial pleiteando a revisão contratual. Com base na Lei nº 14.133/2021, avalie as afirmativas a seguir. I. No regime de contratação integrada, a contratada possui responsabilidade integral pelos riscos associados ao projeto básico. II. O pedido da sociedade empresária deve ser julgado procedente, pois, nos termos do Art. 37, inciso XXI, da Constituição Federal, a variação quantitativa que implique aumento de custos para a contratada gera o direito ao reequilíbrio econômico-financeiro do contrato. III. O pedido deve ser julgado improcedente, pois, no caso narrado, a variação nos custos incorridos pela contratada não teve como causa uma das exceções previstas nos incisos do Art. 133 da Lei nº 14.133/2021, motivo pelo qual se aplica a vedação à alteração contratual no regime de contratação integrada. Está correto o que se afirma em", "alts": ["I, apenas.", "I e II, apenas.", "I e III apenas.", "II e III, apenas.", "II, apenas."], "coms": ["Errada. A afirmativa I está correta, mas a III também está.", "Errada. A II é falsa: a variação de quantitativos do projeto básico elaborado pela própria contratada é risco dela na contratação integrada, e não gera direito automático a reequilíbrio.", "CORRETA. I: na contratação integrada, a contratada elabora o projeto básico e assume os riscos dessa solução (art. 22, §4º). III: o art. 133 veda a alteração dos valores contratuais nas contratações integradas e semi-integradas, salvo nas hipóteses que lista (caso fortuito ou força maior; alteração a pedido da Administração não decorrente de erro da contratada; evento superveniente alocado à Administração na matriz de riscos). O erro de quantitativos não está entre elas.", "Errada. A II é falsa.", "Errada. A II é falsa e a I e a III são verdadeiras."], "c": 2, "base": "Lei 14.133/2021, arts. 6º, XXXII, 22, §4º, e 133; CF, art. 37, XXI.", "dica": "Na contratação integrada, a contratada elabora o projeto básico, assume esse risco e não pode reclamar dos próprios quantitativos.", "id": "F2025.1-19", "cod": "FGV 2025.1-Q19"}, {"n": 10, "disc": "Direito Administrativo", "tema": "Concurso público: direito subjetivo à nomeação", "item": "A16 Agentes públicos", "nivel": "médio", "origem": "Inédita", "enun": "O edital de concurso para o cargo de analista do Tribunal Alfa previu 10 vagas. Joana foi aprovada em 12º lugar. Durante o prazo de validade do certame, os candidatos classificados em 3º e 7º lugares foram nomeados, mas não tomaram posse, tendo sido tornadas sem efeito as respectivas nomeações. A Administração deixou transcorrer o prazo de validade sem nomear outros candidatos.\nSobre a situação de Joana, à luz da jurisprudência dos Tribunais Superiores, assinale a afirmativa correta.", "alts": ["Joana tem direito subjetivo à nomeação, pois a desistência de candidatos convocados dentro do número de vagas gera direito aos classificados seguintes, até o preenchimento das vagas previstas no edital.", "A Administração pode deixar de nomear os aprovados dentro do número de vagas por conveniência e oportunidade, desde que motivadamente.", "O direito de Joana depende de prévia impugnação do edital no prazo de 30 dias de sua publicação.", "Joana tem mera expectativa de direito, pois foi aprovada fora do número de vagas, e somente a preterição arbitrária e imotivada lhe asseguraria a nomeação.", "Joana somente teria direito à nomeação se a Administração abrisse novo concurso durante a validade do anterior."], "coms": ["CORRETA. O aprovado dentro das vagas tem direito subjetivo à nomeação (Tema 161/STF). Se convocados dentro das vagas desistem, a jurisprudência do STJ e do STF reconhece o direito dos seguintes na ordem: Joana passa a ocupar, na prática, a 10ª vaga.", "Errada. Só situações excepcionalíssimas, supervenientes, imprevisíveis, graves e necessárias autorizam a recusa, sempre motivada (Tema 161).", "Errada. Não há esse requisito, e o direito decorre da classificação, não de impugnação ao edital.", "Errada. A regra do Tema 784 vale para o aprovado fora das vagas sem desistência dos que estavam dentro delas. Com duas desistências, Joana passou a estar dentro do número de vagas.", "Errada. Essa é uma das hipóteses do Tema 784, mas não a única. A desistência dos convocados dentro das vagas também gera o direito."], "c": 0, "base": "CF, art. 37, II e IV; STF, Temas 161 e 784; jurisprudência do STJ sobre desistência de candidatos.", "dica": "Tema 161: dentro das vagas, há direito subjetivo. Tema 784: fora das vagas, só há direito com preterição arbitrária ou abertura de novo concurso com preterição.", "id": "i-cefcce94", "cod": "ADM-0002"}, {"n": 11, "disc": "Direito Administrativo", "tema": "Improbidade: tipificação e sanções (Lei 14.230/2021)", "item": "A04 Organização (órgãos, indireta, estatais)", "nivel": "médio", "origem": "ENAM 2024.1 – Q24", "enun": "João, diretor de uma empresa pública estadual criada para a execução de obras de pavimentação, determinou a utilização de maquinário da estatal, bem como de empregados públicos, nas obras de construção de sua residência familiar. O Ministério Público local tomou conhecimento dos fatos, instaurou inquérito civil e, após confirmar os fatos, ajuizou ação de improbidade administrativa em desfavor de João. A partir do enunciado acima, assinale a afirmativa incorreta.", "alts": ["Se o magistrado de 1ª instância julgar improcedente os pedidos do Ministério Público, a sentença não estará sujeita ao reexame necessário.", "Ainda que João exerça função de livre nomeação e exoneração, a utilização dolosa de maquinário e empregados públicos configura ato de improbidade administrativa.", "Por se tratar de ato de improbidade que atenta contra os princípios da Administração Pública, João não estará sujeito à perda da função pública.", "A ação para aplicação das sanções prescreve em oito anos e, uma vez interrompida a contagem, o prazo recomeça a correr pela metade (quatro anos) a contar do dia da interrupção.", "A utilização de maquinário da estatal e de empregados públicos não pode ser tipificada, simultaneamente, nos artigos que tratam do enriquecimento ilícito e da violação de princípios da Administração Pública."], "coms": ["Afirmativa verdadeira (não é a resposta). Não há remessa necessária nas sentenças da Lei de Improbidade (art. 17, §19, IV).", "Afirmativa verdadeira. O vínculo precário (cargo em comissão) não afasta a condição de agente público para fins de improbidade (art. 2º).", "CORRETA, por ser a INCORRETA. A conduta não se enquadra em ofensa a princípios: usar em obra particular máquinas e empregados da entidade é enriquecimento ilícito (art. 9º, IV). Por isso, João está sujeito à perda da função pública (art. 12, I). A premissa da assertiva está errada.", "Afirmativa verdadeira. A prescrição é de 8 anos (art. 23) e, interrompida, recomeça a correr pela metade (art. 23, §5º).", "Afirmativa verdadeira. Cada ato deve ser enquadrado em apenas um dos tipos dos arts. 9º, 10 ou 11 (art. 17, §10-D)."], "c": 2, "base": "Lei 8.429/1992, arts. 2º, 9º, IV, 12, 17, §§10-D e 19, e 23, com a redação da Lei 14.230/2021.", "dica": "Após a reforma, o art. 11 (princípios) não admite perda da função nem suspensão dos direitos políticos. As sanções são multa de até 24 vezes a remuneração e proibição de contratar por até 4 anos.", "id": "F2024.1-24", "cod": "FGV 2024.1-Q24"}, {"n": 12, "disc": "Direito Administrativo", "tema": "Mandado de segurança: efeitos patrimoniais", "item": "A19 MS/ação popular/ACP/improbidade", "nivel": "médio", "origem": "Inédita", "enun": "Pedro, servidor estadual, foi demitido em março. Em maio, impetrou mandado de segurança alegando nulidade do processo disciplinar por cerceamento de defesa, com pedido de reintegração e de pagamento de todos os vencimentos desde a demissão. A segurança foi concedida em outubro do mesmo ano.\nSobre os efeitos da concessão da ordem, assinale a afirmativa correta.", "alts": ["A sentença concessiva sujeita-se obrigatoriamente ao duplo grau de jurisdição, razão pela qual a reintegração só pode ocorrer após o julgamento da remessa necessária.", "O mandado de segurança não é cabível, pois a alegação de cerceamento de defesa exige dilação probatória.", "A impetração foi intempestiva, pois o prazo para o mandado de segurança é de 30 dias, contados da ciência do ato impugnado.", "Pedro fará jus, no próprio mandado de segurança, a todos os vencimentos devidos desde a data da demissão, em razão do efeito ex tunc da invalidação do ato.", "Pedro será reintegrado, mas o pagamento de vencimentos e vantagens pecuniárias assegurado em sentença concessiva de mandado de segurança somente será efetuado relativamente às prestações que se vencerem a contar da data do ajuizamento da inicial, devendo as parcelas anteriores ser buscadas em ação própria."], "coms": ["Errada. A sentença concessiva está sujeita ao duplo grau (art. 14, §1º), mas pode ser executada provisoriamente (§3º), salvo nos casos em que é vedada a liminar.", "Errada. O cerceamento pode ser demonstrado por prova documental pré-constituída (cópia do processo), o que é compatível com o rito.", "Errada. O prazo é de 120 dias (art. 23), e o STF o declarou constitucional (Súmula 632).", "Errada. Os efeitos patrimoniais no MS contam da impetração, e as parcelas entre março e maio exigem via própria.", "CORRETA. Lei 12.016/2009, art. 14, §4º, e Súmulas 269 e 271 do STF: o MS não é substitutivo de ação de cobrança, e os efeitos patrimoniais pretéritos se reclamam administrativamente ou por ação própria."], "c": 4, "base": "Lei 12.016/2009, arts. 14 e 23; Súmulas 269, 271 e 632/STF.", "dica": "Súmulas do MS mais cobradas: 266 (lei em tese), 267 (ato judicial recorrível), 268 (decisão transitada), 269/271 (não é ação de cobrança) e 625 (controvérsia de direito não impede o MS).", "id": "i-835d84b8", "cod": "ADM-0003"}, {"n": 13, "disc": "Direito Administrativo", "tema": "Nepotismo — Súmula Vinculante 13", "item": "A01 Princípios/LINDB", "nivel": "fácil", "origem": "Inédita", "enun": "Recém-empossado, o Prefeito do Município Alfa nomeou seu irmão, médico com 20 anos de experiência em gestão hospitalar, para o cargo de Secretário Municipal de Saúde, e seu sobrinho, estudante de Direito, para cargo em comissão de assessor na Secretaria de Obras.\nÀ luz da Súmula Vinculante 13 e da jurisprudência do STF, assinale a afirmativa correta.", "alts": ["Ambas as nomeações violam a Súmula Vinculante 13, que se aplica indistintamente a cargos administrativos e políticos.", "A nomeação do sobrinho para cargo em comissão viola a Súmula Vinculante 13; a do irmão para cargo de natureza política, em regra, não a viola, salvo se demonstrada fraude, nepotismo cruzado ou inequívoca falta de razoabilidade por ausência de qualificação técnica.", "Nenhuma das nomeações viola a Súmula Vinculante 13, pois a vedação ao nepotismo depende de lei formal de cada ente federativo.", "A nomeação do sobrinho é válida, pois a Súmula Vinculante 13 alcança apenas parentes até o segundo grau.", "A nomeação do irmão viola a Súmula Vinculante 13, ainda que haja qualificação técnica, pois o parentesco em segundo grau é vedado em qualquer cargo."], "coms": ["Errada. O STF distingue os cargos políticos, aos quais em regra não aplica a SV 13.", "CORRETA. O sobrinho é parente em 3º grau colateral e foi nomeado para cargo em comissão, situação vedada pela SV 13. Quanto aos cargos políticos (secretários, ministros), o STF afasta em regra a súmula, ressalvadas a fraude e a manifesta falta de qualificação.", "Errada. A vedação decorre diretamente dos princípios do art. 37, caput, da CF e independe de lei (ADC 12).", "Errada. A SV 13 alcança cônjuge, companheiro e parentes até o TERCEIRO grau, inclusive.", "Errada. Para cargos políticos, a qualificação técnica é justamente o parâmetro de controle."], "c": 1, "base": "CF, art. 37, caput; Súmula Vinculante 13; STF, ADC 12 e RE 579.951.", "dica": "A SV 13 alcança cônjuge, companheiro e parentes até o 3º grau, além do nepotismo cruzado ('designações recíprocas').", "id": "i-9ee08794", "cod": "ADM-0004"}, {"n": 14, "disc": "Noções Gerais de Direito e Formação Humanística", "tema": "Regime disciplinar da magistratura", "item": "H3 Ética/estatuto da magistratura", "nivel": "médio", "origem": "Inédita", "enun": "Após regular processo administrativo disciplinar instaurado pelo Conselho Nacional de Justiça, ficou comprovado que um juiz de direito vitalício, titular de vara cível, recebia vantagens de advogados que atuavam em processos sob sua jurisdição. O relator propôs a aplicação da pena de demissão.\nConsiderando a Constituição Federal, a LOMAN e a Resolução CNJ nº 135/2011, assinale a afirmativa correta.", "alts": ["O CNJ pode aplicar a pena de demissão, pois detém competência disciplinar originária e concorrente com a dos tribunais.", "O CNJ não possui competência disciplinar sobre juízes de primeiro grau, que estão submetidos exclusivamente às corregedorias dos tribunais.", "A pena de censura é a mais adequada, pois a demissão e a aposentadoria compulsória são reservadas aos juízes não vitalícios.", "O CNJ não pode aplicar a pena de perda do cargo ao juiz vitalício, que depende de sentença judicial transitada em julgado, mas pode aplicar a aposentadoria compulsória com subsídios ou proventos proporcionais ao tempo de serviço.", "A aposentadoria compulsória aplicada como sanção assegura ao magistrado proventos integrais, em respeito à irredutibilidade de subsídios."], "coms": ["Errada. O CNJ tem competência disciplinar originária e concorrente (ADI 4.638), mas a demissão do vitalício exige sentença judicial.", "Errada. A competência do CNJ é originária e concorrente e não depende de prévia atuação da corregedoria local (ADI 4.638).", "Errada. A censura só se aplica aos juízes de primeiro grau, para faltas menos graves (LOMAN, art. 42, parágrafo único). Faltas graves admitem aposentadoria compulsória.", "CORRETA. O magistrado vitalício só perde o cargo por sentença judicial transitada em julgado (CF, art. 95, I). Na esfera administrativa, a pena máxima é a aposentadoria compulsória com proventos proporcionais (CF, art. 103-B, §4º, III; LOMAN, art. 42; Res. CNJ 135/2011).", "Errada. Os proventos são proporcionais ao tempo de serviço."], "c": 3, "base": "CF, arts. 95, I, e 103-B, §4º, III; LOMAN (LC 35/1979), arts. 42 a 47; Resolução CNJ 135/2011; STF, ADI 4.638.", "dica": "Escala de penas: advertência, censura (só 1º grau), remoção compulsória, disponibilidade, aposentadoria compulsória e demissão. Para o vitalício, a demissão só vem por sentença judicial.", "id": "i-e345a0b0", "cod": "HUM-0001"}, {"n": 15, "disc": "Noções Gerais de Direito e Formação Humanística", "tema": "Criminalização da homotransfobia (ADO 26 e MI 4.733)", "item": "H5 Teoria geral do direito/gênero", "nivel": "fácil", "origem": "ENAM 2024.1 – Q30", "enun": "Em julgamento emblemático, o Supremo Tribunal Federal reconheceu que os integrantes do grupo LGBTI+, como qualquer outra pessoa, nascem iguais em dignidade e direitos e possuem igual capacidade de autodeterminação quanto às suas escolhas pessoais em matéria afetiva e amorosa. Nesse contexto, de acordo com o STF", "alts": ["a existência de omissão normativa inconstitucional do Poder Legislativo da União foi declarada, para fins de cientificar o Congresso Nacional, para os efeitos legais cabíveis, visando à edição de lei no prazo de 180 (cento e oitenta) dias, que regulamente os mandados constitucionais de incriminação inscritos no Art. 5º, incisos XLI e XLII, da CRFB/88, que passam a ser considerados autoaplicáveis, após tal prazo, para enquadrar a homofobia e a transfobia em tipos penais já existentes no Código Penal.", "até que sobrevenha lei emanada do Congresso Nacional destinada a implementar os mandados de criminalização definidos no Art. 5º, incisos XLI e XLII, da CRFB/88, as condutas homofóbicas e transfóbicas, reais ou supostas, que envolvem aversão odiosa à orientação sexual ou à identidade de gênero de alguém, por traduzirem expressões de racismo, compreendido este em sua dimensão social, ajustam-se, por identidade de razão e mediante adequação típica, aos preceitos primários de incriminação definidos na Lei nº 7.716/1989, constituindo, também, na hipótese de homicídio doloso, circunstância que o qualifica, por configurar motivo torpe.", "a repressão penal à prática da homotransfobia alcança, restringe e limita o exercício da liberdade religiosa, qualquer que seja a denominação confessional professada, a cujos fiéis e ministros é vedado o direito de pregar e de divulgar, pela palavra, pela imagem ou por qualquer outro meio, o seu pensamento e de externar suas convicções de acordo com o que estiver contido em seus livros e códigos sagrados, porque o ordenamento jurídico veda o discurso de ódio.", "até que seja editada lei sobre a matéria pelo Poder Legislativo, as condutas reais homofóbicas e transfóbicas, que envolvem discurso de ódio contra orientação sexual ou identidade de gênero de alguém, por traduzirem expressões de preconceito, compreendido este em sua dimensão social, ajustam-se, por identidade de razão e mediante adequação típica, aos preceitos primários de incriminação como terrorismo.", "a omissão normativa inconstitucional do Poder Legislativo da União foi constituída, para fins de cientificar o Congresso Nacional, para os efeitos legais cabíveis, visando à edição de lei no prazo de 1 (um) ano, que regulamente os mandados constitucionais de incriminação inscritos no Art. 5º, incisos XLI e XLII, da CRFB/88, que passam a ser considerados autoaplicáveis, após tal prazo, em razão de analogia pro societate, para enquadrar a homofobia e a transfobia em tipos penais já existentes na legislação penal extravagante."], "coms": ["Errada. O STF não fixou prazo para depois considerar o mandamento 'autoaplicável', e o enquadramento foi na Lei 7.716/1989, não no Código Penal.", "CORRETA. Tese da ADO 26: até que sobrevenha lei, a homotransfobia se enquadra nos tipos da Lei 7.716/1989, como racismo em sua dimensão social, e, no homicídio doloso, configura motivo torpe (qualificadora).", "Errada. O STF ressalvou expressamente a liberdade religiosa: fiéis e ministros podem pregar suas convicções, desde que isso não configure discurso de ódio.", "Errada. O enquadramento foi na Lei do Racismo, e não na Lei Antiterrorismo.", "Errada. Não houve prazo de 1 ano nem 'analogia pro societate', que é vedada em matéria penal. O fundamento foi o conceito social de racismo."], "c": 1, "base": "CF, art. 5º, XLI e XLII; Lei 7.716/1989; STF, ADO 26 e MI 4.733.", "dica": "Nos embargos do MI 4.733 (2023), o STF estendeu o entendimento à injúria racial (Lei 7.716, art. 2º-A) quando a ofensa é dirigida a pessoas LGBTQIA+.", "id": "F2024.1-30", "cod": "FGV 2024.1-Q30"}, {"n": 16, "disc": "Noções Gerais de Direito e Formação Humanística", "tema": "Lógica do razoável (Recaséns Siches)", "item": "H4 Filosofia do direito", "nivel": "médio", "origem": "Inédita", "enun": "Em uma estação ferroviária havia um aviso: 'É proibida a entrada com cães'. Certo dia, um passageiro tentou entrar acompanhado de um urso. Pela leitura literal do aviso, a entrada seria permitida, pois urso não é cão. A conclusão, porém, choca o senso comum, o que demonstra a insuficiência do raciocínio silogístico na interpretação do Direito.\nO exemplo é clássico na obra do autor que propôs, como método de interpretação jurídica,", "alts": ["a escola da exegese, segundo a qual o juiz é a 'boca da lei', devendo aplicar literalmente o texto legal.", "a teoria tridimensional do Direito, de Miguel Reale, segundo a qual a norma é aplicada mediante subsunção mecânica do fato à regra.", "a jurisprudência dos conceitos, de Puchta, segundo a qual as soluções jurídicas decorrem logicamente de conceitos gerais organizados em pirâmide.", "a teoria pura do Direito, de Hans Kelsen, segundo a qual o intérprete deve se limitar à moldura semântica da norma, sem juízos valorativos.", "a lógica do razoável, de Luis Recaséns Siches, segundo a qual a interpretação deve buscar a solução mais justa e adequada ao caso, considerando os valores e as finalidades da norma, e não apenas a dedução formal."], "coms": ["Errada. A exegese levaria exatamente à conclusão absurda (admitir o urso) que o exemplo critica.", "Errada. Reale integra fato, valor e norma e não defende subsunção mecânica. O exemplo também não é dele.", "Errada. A jurisprudência dos conceitos é justamente o formalismo lógico-dedutivo que Recaséns critica.", "Errada. Kelsen reconhece a moldura de sentidos possíveis, mas considera a escolha dentro dela um ato de vontade, sem método 'correto'. O exemplo do urso não é dele.", "CORRETA. O exemplo do urso é de Recaséns Siches (citando Petrasycki) e ilustra a 'lógica do razoável' ou 'lógica do humano', o método indicado no item 4 do programa de Formação Humanística do edital."], "c": 4, "base": "Recaséns Siches, Nueva filosofía de la interpretación del derecho; edital do 6º ENAM, Anexo I, III, item 4.", "dica": "O edital fala em 'superação dos métodos de interpretação mediante puro raciocínio lógico-dedutivo' e em 'lógica do razoável'. Recaséns Siches é nome certo de prova.", "id": "i-e23b97ec", "cod": "HUM-0002"}, {"n": 17, "disc": "Direitos Humanos", "tema": "Estado de coisas inconstitucional — sistema prisional (ADPF 347)", "item": "DH7 Jurisprudência STF em DH", "nivel": "médio", "origem": "Inédita", "enun": "No julgamento de mérito da ADPF 347, o Supremo Tribunal Federal analisou a situação do sistema prisional brasileiro, marcado por superlotação, condições degradantes e violação massiva de direitos fundamentais dos presos.\nSobre esse julgamento e o instituto nele aplicado, assinale a afirmativa correta.", "alts": ["Reconhecido o estado de coisas inconstitucional, o STF determinou a imediata soltura dos presos provisórios recolhidos em estabelecimentos superlotados.", "O estado de coisas inconstitucional é técnica originária da Suprema Corte dos Estados Unidos, aplicada no Brasil sem adaptações.", "O STF entendeu que o contingenciamento de recursos do Fundo Penitenciário Nacional é legítimo, diante da discricionariedade orçamentária do Executivo.", "O STF reconheceu o estado de coisas inconstitucional no sistema prisional e determinou a elaboração de plano nacional e de planos estaduais e distrital para superá-lo, com monitoramento judicial, além de reafirmar a obrigatoriedade das audiências de custódia.", "O STF limitou-se a declarar a omissão inconstitucional, cientificando os Poderes competentes, sem impor medidas concretas, em respeito à separação de Poderes."], "coms": ["Errada. O STF não determinou solturas em massa. Optou por soluções estruturais e dialógicas, com planos e monitoramento.", "Errada. A técnica nasceu na Corte Constitucional da Colômbia (Sentencia T-025/2004, entre outras).", "Errada. Desde a cautelar, o STF determinou a liberação do saldo do Funpen e vedou novos contingenciamentos.", "CORRETA. Na ADPF 347 (mérito, 2023), o STF reconheceu o ECI, determinou planos nacional e locais (o que originou o 'Pena Justa'), com supervisão, e manteve as medidas da cautelar de 2015 (audiências de custódia e liberação do Funpen). É um típico processo estrutural.", "Errada. O STF impôs medidas concretas (planos, prazos, monitoramento), em postura dialógica, mas não meramente declaratória."], "c": 3, "base": "CF, art. 5º, III, XLVII, XLVIII e XLIX; STF, ADPF 347 (cautelar 2015; mérito 2023).", "dica": "Processos estruturais aparecem tanto em DH quanto em Processo Civil (item 23 do edital). Exemplos: ADPF 347 (presídios), ADPF 635 (letalidade policial no RJ) e ADPF 709 (povos indígenas na pandemia).", "id": "i-a03532f9", "cod": "DHU-0001"}, {"n": 18, "disc": "Direitos Humanos", "tema": "Justiciabilidade dos DESCA na Corte IDH (art. 26 da CADH)", "item": "DH3 Sistema interamericano/Corte IDH", "nivel": "difícil", "origem": "ENAM 2024.1 – Q33", "enun": "O Art. 26 da Convenção Interamericana de Direitos Humanos dispõe sobre o desenvolvimento progressivo dos Direitos Econômicos, Sociais, Ambientais e Culturais (DESCA). Sobre esses direitos, assinale a afirmativa correta.", "alts": ["Durante os trabalhos preparatórios da Convenção Interamericana, o Conselho de Jurisconsultos se inspirou na Convenção Europeia de Direitos Humanos, que prevê, igualmente, a proteção dos DESCA.", "Segundo entendimento consagrado pela Corte Interamericana de Direitos Humanos em sua jurisprudência mais recente, o Art. 26 da Convenção não possui justiciabilidade direta, sendo que ele só pode ser aplicado em conjunto com o Protocolo de San Salvador e em relação aos direitos que esse protocolo prevê como suscetíveis de aplicação no âmbito de petições individuais perante a Corte, quais sejam, o direito à educação e direitos sindicais.", "Embora o Art. 26 da Convenção tenha sido aplicado pela primeira vez de forma autônoma no caso Lagos del Campo vs. Peru, em 2017, a Corte IDH já havia, anos antes, reconhecido sua competência para se pronunciar sobre violações ao referido dispositivo convencional desde o caso Acevedo Buendía vs. Peru.", "Segundo entendimento consagrado pela Corte Interamericana de Direitos Humanos em sua jurisprudência mais recente, a violação ao Art. 26 somente será declarada em conjunto com a declaração de violação de algum direito civil ou político previsto no capítulo II (Art. 3 ao 25) da Convenção Americana.", "Dada a especificidade do escopo protetivo de cada direito humano, a Corte Interamericana consolidou entendimento de que não é possível a declaração de violação do direito à vida e do direito à saúde em relação a uma mesma vítima."], "coms": ["Errada. A Convenção Europeia de Direitos Humanos protege essencialmente direitos civis e políticos. Os direitos sociais estão na Carta Social Europeia.", "Errada. A jurisprudência recente da Corte IDH (desde Lagos del Campo, 2017) reconhece a justiciabilidade direta e autônoma do art. 26, sem depender do Protocolo de San Salvador.", "CORRETA. Lagos del Campo vs. Peru (2017) foi a primeira condenação autônoma pelo art. 26, mas a Corte já afirmara sua competência sobre o dispositivo em Acevedo Buendía vs. Peru (2009).", "Errada. A violação do art. 26 pode ser declarada de forma autônoma, sem depender de violação conjunta de direito civil ou político.", "Errada. A Corte já declarou, para a mesma vítima, violação do direito à vida e do direito à saúde (por exemplo, Poblete Vilches vs. Chile, 2018)."], "c": 2, "base": "Convenção Americana, art. 26; Protocolo de San Salvador; Corte IDH, casos Acevedo Buendía (2009), Lagos del Campo (2017) e Poblete Vilches (2018).", "dica": "Linha do tempo dos DESCA: Acevedo Buendía (competência), Lagos del Campo (primeira violação autônoma) e Poblete Vilches (direito à saúde).", "id": "F2024.1-33", "cod": "FGV 2024.1-Q33"}, {"n": 19, "disc": "Direito Processual Civil", "tema": "Técnica de julgamento ampliado (art. 942 do CPC)", "item": "P12-15 Precedentes/recursos/IRDR/rescisória", "nivel": "difícil", "origem": "Inédita", "enun": "Em ação de indenização, a sentença julgou improcedente o pedido. Interposta apelação pelo autor, a Câmara Cível, por maioria de 2 votos a 1, negou provimento ao recurso, mantendo a sentença. O voto vencido dava provimento à apelação para julgar procedente o pedido.\nSobre a hipótese, assinale a afirmativa correta.", "alts": ["A técnica de julgamento ampliado aplica-se apenas se houver requerimento expresso da parte vencida antes da proclamação do resultado.", "A técnica se aplica igualmente ao julgamento da remessa necessária, sempre que o resultado não for unânime.", "O julgamento deverá prosseguir com a presença de outros julgadores, em número suficiente para garantir a possibilidade de inversão do resultado inicial, ainda que a maioria tenha mantido a sentença.", "Não se aplica a técnica de julgamento ampliado, pois ela somente incide quando o resultado não unânime implicar reforma da sentença de mérito.", "Caberá ao autor interpor embargos infringentes, no prazo de 15 dias, para que prevaleça o voto vencido."], "coms": ["Errada. A aplicação é automática e obrigatória, independentemente de requerimento.", "Errada. O art. 942, §4º, II, exclui expressamente a remessa necessária. Também não se aplica ao IAC, ao IRDR e aos julgamentos do plenário ou da corte especial.", "CORRETA. Na apelação, a técnica do art. 942 incide sempre que o resultado não for unânime, seja de reforma ou de manutenção da sentença (entendimento do STJ). É técnica de julgamento, e não recurso, e se aplica de ofício.", "Errada. A exigência de reforma vale para a ação rescisória (rescisão) e para o agravo de instrumento (reforma de decisão que julgou parcialmente o mérito), não para a apelação (art. 942, §3º).", "Errada. O CPC/2015 extinguiu os embargos infringentes. A técnica do art. 942 os substituiu e é aplicada de ofício."], "c": 2, "base": "CPC, art. 942, caput e §§3º e 4º; jurisprudência do STJ.", "dica": "Art. 942: na apelação, basta não ser unânime. No AI, só se reformar decisão de mérito parcial. Na rescisória, só se rescindir. Remessa necessária, IAC e IRDR estão fora.", "id": "i-81631d56", "cod": "PCI-0001"}, {"n": 20, "disc": "Direito Processual Civil", "tema": "Juizados Especiais x procedimento comum", "item": "P07 Petição inicial/resposta/saneamento", "nivel": "médio", "origem": "ENAM 2026.1 – Q44", "enun": "Quanto ao procedimento nos Juizados Especiais Cíveis e ao procedimento nas ações de rito comum do Código de Processo Civil, avalie as afirmativas a seguir. I. Nos juizados especiais, a lei admite a assistência simples, mas não a litisconsorcial. Já em ação de rito comum, ambas as intervenções são admissíveis. II. O rito dos juizados especiais não admite a reconvenção, mas, sim, o pedido contraposto. Em ação de rito comum, desde que haja conexão, a lei prevê a reconvenção que inclua pedido formulado contra o autor e terceiro. III. A ação rescisória não é cabível nos juizados especiais, mas isso não impede a desconstituição da coisa julgada quando o título se amparar em contrariedade ao entendimento firmado pelo Supremo Tribunal Federal (STF). Está correto o que se afirma em", "alts": ["I, apenas.", "I e II, apenas.", "I e III, apenas.", "II e III, apenas.", "I, II e III."], "coms": ["Errada. A I é falsa: nos Juizados não se admite intervenção de terceiro nem assistência, de nenhuma espécie (Lei 9.099, art. 10). Admite-se apenas o litisconsórcio.", "Errada. A I é falsa.", "Errada. A I é falsa.", "CORRETA. II: nos Juizados não há reconvenção, mas cabe pedido contraposto (Lei 9.099, art. 31); no procedimento comum, a reconvenção pode incluir terceiro (CPC, art. 343, §3º). III: a rescisória é vedada nos Juizados (art. 59), mas o STF (Tema 100) admite a arguição de inexigibilidade do título fundado em entendimento contrário ao do STF (CPC, art. 525, §12).", "Errada. A I é falsa."], "c": 3, "base": "Lei 9.099/1995, arts. 10, 31 e 59; CPC, arts. 343, §3º, e 525, §12; STF, Tema 100.", "dica": "Juizados: sem intervenção de terceiros, sem reconvenção (mas com pedido contraposto) e sem rescisória.", "id": "F2026.1-44", "cod": "FGV 2026.1-Q44"}, {"n": 21, "disc": "Direito Processual Civil", "tema": "Prazo em dobro para litisconsortes", "item": "P06 Atos/prazos/nulidades", "nivel": "fácil", "origem": "Inédita", "enun": "Em ação de cobrança que tramita em autos eletrônicos, Carlos e Daniela foram citados como réus, em litisconsórcio passivo. Cada um constituiu advogado próprio, de escritórios de advocacia distintos. Daniela apresentou contestação no 25º dia útil após o início do prazo, invocando a regra do prazo em dobro para litisconsortes.\nSobre a tempestividade da contestação de Daniela, assinale a afirmativa correta.", "alts": ["A contestação é tempestiva, pois o prazo para contestar é de 30 dias úteis em qualquer procedimento.", "A contestação é intempestiva, pois a regra do prazo em dobro para litisconsortes com procuradores diferentes não se aplica aos processos em autos eletrônicos.", "A tempestividade depende de requerimento prévio de prazo em dobro, a ser deferido pelo juiz.", "A contestação é tempestiva, pois os prazos processuais são contados em dias corridos nos processos eletrônicos.", "A contestação é tempestiva, pois os litisconsortes com procuradores de escritórios distintos têm prazos contados em dobro para todas as manifestações, em qualquer juízo ou tribunal."], "coms": ["Errada. O prazo de contestação no procedimento comum é de 15 dias úteis.", "CORRETA. O art. 229, §2º, do CPC afasta o prazo em dobro dos litisconsortes nos processos em autos eletrônicos. O prazo de contestação é de 15 dias úteis (art. 335).", "Errada. Quando cabível, o prazo em dobro decorre da lei, sem necessidade de requerimento.", "Errada. Os prazos processuais em dias são contados em dias úteis (art. 219), inclusive nos autos eletrônicos.", "Errada. A assertiva ignora a exceção dos autos eletrônicos (art. 229, §2º)."], "c": 1, "base": "CPC, arts. 219, 229 e 335.", "dica": "Também não há dobra do art. 229 se só um dos dois réus se defender (§1º). Fazenda, MP e Defensoria têm prazo em dobro próprio (arts. 180, 183 e 186), salvo prazo próprio fixado em lei.", "id": "i-a34bc2af", "cod": "PCI-0002"}, {"n": 22, "disc": "Direito Processual Civil", "tema": "Homologação e execução de sentença estrangeira", "item": "P09-11 Sentença/coisa julgada", "nivel": "médio", "origem": "ENAM 2026.1 – Q50", "enun": "Uma sentença proferida na Itália condenou o réu, brasileiro, a pagar verbas indenizatórias devidas a seu ex-empregado, estrangeiro sem domicílio em nosso país. As verbas diziam respeito ao vínculo cumprido no exterior. O vitorioso pretende o cumprimento dessa sentença no Brasil, já que o brasileiro é, agora, aqui domiciliado. Sobre esse caso hipotético, assinale a afirmativa correta.", "alts": ["Uma vez homologada pelo Superior Tribunal de Justiça (STJ), a sentença pode ser executada no Brasil, e a execução se fará perante a Justiça Federal.", "Uma vez homologada pelo STJ, a sentença pode ser executada no Brasil, e a execução se fará perante a Justiça do Trabalho.", "Não é admissível a cooperação internacional em detrimento de brasileiro aqui domiciliado, sendo de natureza absoluta a jurisdição nacional, de modo que é inviável o cumprimento, aqui, dessa sentença estrangeira.", "O caso é de cooperação jurídica internacional, e o cumprimento da sentença estrangeira exige, primeiramente, a demonstração de reciprocidade e, posteriormente, demonstrado esse requisito, o STJ a homologará, e a execução se fará perante a Justiça Estadual.", "O caso é de cooperação jurídica internacional, e o cumprimento da sentença estrangeira exige, primeiramente, a demonstração de reciprocidade e, posteriormente, demonstrado esse requisito, o STJ a homologará e direcionará a cooperação ao órgão que apontar competente."], "coms": ["CORRETA. A sentença estrangeira só produz efeitos no Brasil depois de homologada pelo STJ (CF, art. 105, I, i; CPC, art. 961), e a execução cabe à Justiça Federal (CF, art. 109, X), qualquer que seja a natureza da causa.", "Errada. Mesmo com origem trabalhista, a execução de sentença estrangeira homologada é da Justiça Federal (CF, art. 109, X).", "Errada. A demanda indenizatória trabalhista não está entre as hipóteses de jurisdição exclusiva brasileira (CPC, art. 23), e ser o réu brasileiro aqui domiciliado não impede a homologação.", "Errada. A reciprocidade não é exigida para a homologação de sentença estrangeira (CPC, art. 26, §2º), e a execução é na Justiça Federal.", "Errada. Não se exige reciprocidade para a homologação (CPC, art. 26, §2º), e a competência para executar está definida na CF (art. 109, X)."], "c": 0, "base": "CF, arts. 105, I, i, e 109, X; CPC, arts. 23, 26, §2º, 960 a 965.", "dica": "Homologação: STJ. Execução: juiz federal. Exequatur de carta rogatória: STJ, com cumprimento também pelo juiz federal.", "id": "F2026.1-50", "cod": "FGV 2026.1-Q50"}, {"n": 23, "disc": "Direito Processual Civil", "tema": "Eleição de foro e declinação de ofício (Lei 14.879/2024)", "item": "P03 Competência/cooperação", "nivel": "difícil", "origem": "Inédita", "enun": "Sociedade empresária sediada em Porto Alegre/RS celebrou contrato de fornecimento com outra sociedade empresária sediada em Curitiba/PR, com cumprimento das obrigações nesta última cidade. O contrato, não consumerista e paritário, elegeu o foro da comarca de Manaus/AM, sem qualquer relação com as partes ou com o negócio. Ajuizada a ação em Manaus, o juiz, antes da citação, declinou de ofício da competência.\nSobre a decisão do juiz, assinale a afirmativa correta.", "alts": ["A decisão está incorreta, pois a cláusula de eleição de foro só pode ser afastada quando houver relação de consumo.", "A decisão está incorreta, pois a competência territorial é relativa e não pode ser declarada de ofício, nos termos da Súmula 33 do STJ.", "A decisão está correta, pois a eleição de foro deve guardar pertinência com o domicílio ou a residência de uma das partes ou com o local da obrigação, e o ajuizamento em juízo aleatório constitui prática abusiva que justifica a declinação de competência de ofício.", "A decisão está correta, mas somente poderia ser proferida após a citação e mediante provocação do réu em preliminar de contestação.", "A decisão está incorreta, pois, em contratos paritários entre empresários, a liberdade de eleição de foro é absoluta."], "coms": ["Errada. A abusividade não se limita às relações de consumo, e o §5º alcança qualquer ajuizamento em juízo aleatório.", "Errada. A Súmula 33 é a regra geral, mas o art. 63, §§3º e 5º, do CPC traz exceções expressas: cláusula de eleição abusiva e ajuizamento em juízo aleatório.", "CORRETA. A Lei 14.879/2024 alterou o art. 63 do CPC: o §1º passou a exigir pertinência do foro eleito com o domicílio ou a residência de uma das partes ou com o local da obrigação (ressalvada a pactuação consumerista favorável ao consumidor), e o §5º qualifica como abusivo o ajuizamento em juízo aleatório, autorizando a declinação de ofício.", "Errada. O art. 63 permite ao juiz agir de ofício, antes da citação.", "Errada. Desde a Lei 14.879/2024, a eleição de foro exige pertinência mesmo entre empresários."], "c": 2, "base": "CPC, art. 63, §§1º, 3º e 5º (Lei 14.879/2024); Súmula 33/STJ.", "dica": "Lei recente, cobrança provável. A eleição de foro hoje exige pertinência com o domicílio de uma das partes ou com o local da obrigação.", "id": "i-6e7eac68", "cod": "PCI-0003"}, {"n": 24, "disc": "Direito Civil", "tema": "Prescrição contra absolutamente incapaz", "item": "V05 Negócio jurídico/defeitos/prescrição", "nivel": "médio", "origem": "Inédita", "enun": "Em 10 de março de 2020, Lívia, então com 14 anos de idade, sofreu graves lesões ao ser atingida por uma placa publicitária mal fixada, que desabou na calçada em frente a uma loja. Lívia completou 16 anos em 2 de agosto de 2021. Em 20 de julho de 2024, por meio de sua mãe, ajuizou ação de reparação civil em face da sociedade empresária responsável pela placa, que alegou prescrição.\nConsiderando que não há relação de consumo e que se aplica o prazo prescricional geral da pretensão de reparação civil, assinale a afirmativa correta.", "alts": ["A pretensão não está prescrita, pois a prescrição não corre contra absolutamente incapazes, tendo o prazo trienal começado a fluir apenas quando Lívia completou 16 anos.", "A prescrição não pode ser reconhecida, pois é matéria que depende de alegação da parte autora e é vedada sua arguição em contestação.", "A pretensão não está prescrita, pois a prescrição somente começa a correr contra o menor quando ele atinge a maioridade civil, aos 18 anos.", "A pretensão não está prescrita, pois o prazo aplicável é o decenal, previsto para as hipóteses em que a lei não fixa prazo menor.", "A pretensão está prescrita, pois o prazo trienal começou a fluir na data do evento danoso, em 10 de março de 2020."], "coms": ["CORRETA. Até os 16 anos, Lívia era absolutamente incapaz (CC, art. 3º), e contra ela não corria a prescrição (art. 198, I). O prazo de 3 anos (art. 206, §3º, V) começou em 2/8/2021 e terminaria em 2/8/2024. A ação de 20/7/2024 é tempestiva.", "Errada. O réu pode alegar a prescrição em qualquer grau de jurisdição (art. 193), e o juiz pode reconhecê-la de ofício (CPC, art. 487, II).", "Errada. Entre 16 e 18 anos, o menor é relativamente incapaz, e contra ele a prescrição corre normalmente. Só não corre contra os absolutamente incapazes.", "Errada. A reparação civil tem prazo próprio de 3 anos (art. 206, §3º, V). O prazo de 10 anos (art. 205) é residual.", "Errada. A causa impeditiva do art. 198, I, impede o início da contagem enquanto durar a incapacidade absoluta."], "c": 0, "base": "CC, arts. 3º, 4º, I, 193, 198, I, 205 e 206, §3º, V; CPC, art. 487, II.", "dica": "Faça a conta na prova: marque a data em que a causa impeditiva cessa e só então some o prazo. A FGV adora datas próximas do limite.", "id": "i-b34e3615", "cod": "CIV-0001"}, {"n": 25, "disc": "Direito Civil", "tema": "Pagamento indevido: recebimento como parte de dívida verdadeira", "item": "V06 Obrigações", "nivel": "difícil", "origem": "ENAM 2025.1 – Q52", "enun": "Enéas identificou o depósito de R$ 2.000,00 (dois mil reais) realizado em sua conta corrente por Pix e, embora não tenha identificado o depositante, presumiu tratar-se do pagamento do aluguel devido por seu inquilino Aderbal, que tem o mesmo valor. Algum tempo depois, Enéas foi interpelado por Eunice, autora do depósito, que desejava que o valor lhe fosse restituído, pois afirmou que digitara errado a numeração da conta do seu credor efetivo. Sobre o caso, avalie as afirmativas a seguir. I. A pretensão à devolução do valor deve seguir, prioritariamente, as regras gerais sobre enriquecimento sem causa. II. Eunice poderia exigir a devolução em dobro do valor depositado, em razão de ser indevida a recepção do valor por Enéas. III. Enéas pode recusar-se a devolver o valor se, entre o depósito e o pedido de devolução, prescreveu sua pretensão ao aluguel em face de Aderbal. Está correto o que se afirma em", "alts": ["I, apenas.", "II, apenas.", "III, apenas.", "I e II, apenas.", "I e III, apenas."], "coms": ["Errada. A I é falsa, porque existe regra específica (pagamento indevido, arts. 876 e seguintes), e a ação de enriquecimento sem causa é subsidiária (art. 886).", "Errada. A II é falsa: não há restituição em dobro no pagamento indevido.", "CORRETA. III: fica isento de restituir quem recebeu o pagamento indevido como parte de dívida verdadeira e deixou prescrever a pretensão (art. 880). Quem pagou tem ação regressiva contra o verdadeiro devedor (Aderbal). É o mesmo bloco de artigos da questão 61 do simulado que a Karina errou.", "Errada. A I e a II são falsas.", "Errada. A I é falsa."], "c": 2, "base": "CC, arts. 876, 877, 880, 884 a 886.", "dica": "Releia em sequência os arts. 876 a 883 do CC. A FGV cobra os detalhes: prova do erro (877), recebimento como parte de dívida verdadeira (880), dívida prescrita (882) e fim ilícito (883).", "id": "F2025.1-52", "cod": "FGV 2025.1-Q52"}, {"n": 26, "disc": "Direito Civil", "tema": "Exoneração do fiador na locação prorrogada", "item": "V08 Contratos em espécie/atos unilaterais", "nivel": "difícil", "origem": "Inédita", "enun": "Em contrato de locação residencial com prazo de 30 meses, Rodrigo figurou como fiador, responsabilizando-se 'até a efetiva entrega das chaves'. Findo o prazo, a locação prorrogou-se por prazo indeterminado. Meses depois, Rodrigo notificou o locador de que pretendia se exonerar da fiança. Três meses após a notificação, o locatário deixou de pagar os aluguéis.\nSobre a responsabilidade de Rodrigo, assinale a afirmativa correta.", "alts": ["Rodrigo responde pelos aluguéis vencidos até 120 dias após a notificação ao locador, ficando exonerado a partir de então.", "Rodrigo responde pelos aluguéis vencidos até 60 dias após a notificação, nos termos do Código Civil.", "Rodrigo somente poderá se exonerar por sentença judicial, em ação própria de exoneração de fiança.", "Rodrigo está exonerado desde a data da notificação, pois a fiança não admite interpretação extensiva.", "Rodrigo não pode se exonerar, pois assumiu a garantia até a efetiva entrega das chaves."], "coms": ["CORRETA. Na locação de imóvel urbano prorrogada por prazo indeterminado, o fiador pode se exonerar notificando o locador e fica obrigado por todos os efeitos da fiança durante 120 dias após a notificação (Lei 8.245/1991, art. 40, X). Como o inadimplemento começou no 3º mês (cerca de 90 dias), Rodrigo responde pelos aluguéis vencidos até o 120º dia.", "Errada. Os 60 dias são do art. 835 do CC, regra geral. Para a locação urbana prevalece a lei especial: 120 dias (art. 40, X, da Lei 8.245).", "Errada. Na locação basta a notificação ao locador (art. 40, X). A ação judicial é desnecessária.",
