m": "P16-19 Execução/cumprimento", "nivel": "médio", "origem": "Inédita", "enun": "Transitada em julgado a sentença que condenou a sociedade empresária Alfa a pagar R$ 100.000,00 a Bruno, este requereu o cumprimento da sentença. Intimada, Alfa depositou R$ 40.000,00 no prazo legal e nada mais pagou.\nSobre a hipótese, assinale a afirmativa correta.", "alts": ["Incidirão multa de 10% e honorários advocatícios de 10% apenas sobre o restante de R$ 60.000,00, e o prazo para impugnação começa a correr após o prazo para pagamento voluntário, independentemente de penhora.", "O prazo para pagamento voluntário é de 3 dias, contados da intimação do devedor.", "Incidirão multa e honorários de 10% cada sobre o valor total da condenação, pois o pagamento parcial não afasta as sanções.", "A impugnação ao cumprimento de sentença depende de prévia garantia do juízo pela penhora.", "Não são devidos honorários advocatícios na fase de cumprimento de sentença, mas apenas a multa de 10%."], "coms": ["CORRETA. Havendo pagamento parcial, a multa e os honorários incidem sobre o restante (CPC, art. 523, §§1º e 2º). A impugnação deve ser oferecida em 15 dias contados do fim do prazo para pagamento, independentemente de penhora ou nova intimação (art. 525).", "Errada. O prazo é de 15 dias (art. 523). Os 3 dias são da execução de título extrajudicial (art. 829).", "Errada. O art. 523, §2º, manda calcular multa e honorários sobre o restante.", "Errada. A impugnação independe de penhora (art. 525, caput).", "Errada. A Súmula 517/STJ e o art. 523, §1º, preveem honorários no cumprimento, depois de escoado o prazo para pagamento voluntário."], "c": 0, "base": "CPC, arts. 523, 525 e 829; Súmula 517/STJ.", "dica": "Contra a Fazenda Pública não incide a multa do art. 523 (art. 534, §2º). No cumprimento provisório, a multa e os honorários também incidem (art. 520, §2º).", "id": "i-ff2d21ec", "cod": "PCI-0004"}, {"n": 20, "disc": "Direito Processual Civil", "tema": "Ação popular: MP, assistência e honorários", "item": "P04-05 Ação/partes/terceiros", "nivel": "médio", "origem": "ENAM 2025.2 – Q45", "enun": "João da Silva, cidadão devidamente qualificado, move ação popular contra o Município XXX e a sociedade Lucri S.A., na qual, diante da falta de certame licitatório e de superfaturamento, aponta a nulidade de contrato entre os réus, já em final de execução. A petição inicial anexou os documentos e sustentou que, a par dos vícios da falta de competição e de isonomia, há sociedades empresárias sólidas e de melhor logística que ofertam os mesmos produtos por preços muito melhores. Daí, o pedido da nulidade do contrato e do ressarcimento do dano ao erário. Diante desse quadro, analise as afirmativas a seguir. I. O Ministério Público, nesse tipo de ação, atua com poderes de impulsionar provas e, embora não tenha legitimidade originária, tem legitimidade ativa subsidiária ulterior. II. A sociedade YYY pode ingressar em assistência litisconsorcial ao autor, caso mostre ser uma das principais prejudicadas pela ausência de licitação. III. Nesse tipo de ação, tal como em Mandado de Segurança, não há condenação em verba honorária. Está correto o que se afirma em", "alts": ["I, apenas.", "I e II, apenas.", "I e III, apenas.", "II e III, apenas.", "I, II e III."], "coms": ["CORRETA. I: o MP acompanha a ação, cabe-lhe apressar a produção da prova (Lei 4.717, art. 6º, §4º) e, se o autor desistir, pode promover o prosseguimento (art. 9º). É a legitimidade subsidiária ulterior. II: falsa, pois só o CIDADÃO pode se habilitar como litisconsorte ou assistente do autor (art. 6º, §5º), e pessoa jurídica não tem legitimidade (Súmula 365/STF). III: falsa, pois o autor é isento de sucumbência, salvo má-fé (CF, art. 5º, LXXIII), mas os réus vencidos pagam honorários (art. 12).", "Errada. A II é falsa: pessoa jurídica não pode ser assistente do autor popular.", "Errada. A III é falsa: há condenação dos réus em honorários (art. 12).", "Errada. A II e a III são falsas.", "Errada. A II e a III são falsas."], "c": 0, "base": "CF, art. 5º, LXXIII; Lei 4.717/1965, arts. 6º, §§4º e 5º, 9º e 12; Súmula 365/STF.", "dica": "A isenção de custas e sucumbência é do autor popular, salvo má-fé. Réu vencido paga honorários.", "id": "F2025.2-45", "cod": "FGV 2025.2-Q45"}, {"n": 21, "disc": "Direito Processual Civil", "tema": "ACP de âmbito nacional: competência e limites da coisa julgada (Tema 1.075/STF)", "item": "P23 Coletivo/estrutural", "nivel": "difícil", "origem": "Inédita", "enun": "Associação de defesa do consumidor ajuizou, na comarca de Curitiba/PR, ação civil pública contra instituição financeira com atuação nacional, questionando cláusula padrão de contratos firmados em todo o país. O banco sustentou que (i) a sentença somente produziria efeitos nos limites da competência territorial do órgão prolator; e (ii) a ação deveria ter sido proposta no Distrito Federal. Havia outra ACP idêntica em trâmite em São Paulo, ajuizada posteriormente.\nÀ luz da tese fixada no Tema 1.075 do STF, assinale a afirmativa correta.", "alts": ["A sentença produzirá efeitos apenas no Estado do Paraná, nos termos do Art. 16 da Lei nº 7.347/1985.", "As duas ações devem tramitar separadamente, pois a ação coletiva não induz litispendência nem prevenção.", "A competência é do foro do domicílio da instituição financeira, por aplicação da regra geral do Código de Processo Civil.", "É inconstitucional a limitação territorial dos efeitos da sentença na ACP; tratando-se de dano de âmbito nacional, a competência é do foro da capital do Estado ou do Distrito Federal, e, havendo múltiplas ações, firma-se a prevenção do juízo que primeiro conheceu de uma delas.", "A ação deveria ter sido proposta obrigatoriamente no Distrito Federal, por se tratar de dano de âmbito nacional."], "coms": ["Errada. O STF declarou inconstitucional a limitação territorial introduzida pela Lei 9.494/1997 e repristinou a redação original do art. 16.", "Errada. O Tema 1.075 fixou a prevenção do juízo que primeiro conheceu de uma delas para julgar todas as conexas.", "Errada. Nas ações coletivas, aplica-se o microssistema (LACP e CDC, art. 93), e não a regra geral do domicílio do réu.", "CORRETA. Tema 1.075 (RE 1.101.937): é inconstitucional o art. 16 da LACP na redação da Lei 9.494/1997; em ACP de efeitos nacionais ou regionais aplica-se o art. 93, II, do CDC (capital do Estado ou DF, concorrentemente); e firma-se a prevenção do primeiro juízo. Curitiba, capital, é competente e preventa.", "Errada. O art. 93, II, do CDC prevê a competência CONCORRENTE da capital do Estado ou do DF. O DF não é foro exclusivo."], "c": 3, "base": "Lei 7.347/1985, arts. 2º e 16; CDC, arts. 93 e 103; STF, Tema 1.075 (RE 1.101.937).", "dica": "Dano local: foro do local do dano. Dano regional ou nacional: capital do Estado ou DF, concorrentemente. Limitação territorial da coisa julgada: inconstitucional (Tema 1.075).", "id": "i-64b6a56a", "cod": "PCI-0005"}, {"n": 22, "disc": "Direito Processual Civil", "tema": "Prova impertinente e estabilização da demanda", "item": "P08 Provas", "nivel": "difícil", "origem": "ENAM 2024.1 – Q50", "enun": "Em ação voltada à anulação de contrato por coação, e assim do débito nele constante, após contestação e réplica, recusada a conciliação e saneado o feito, o juiz abre a fase de prova, destinada a demonstrar se ocorreu a coação, fundamento único da petição inicial para a alegada invalidade. Como o juiz deferiu prova documental suplementar, o autor solicitou que o réu fosse compelido a exibir uma série de documentos. Segundo o autor, esses documentos seriam aptos a demonstrar, por si, que, ainda se afastada a coação, o valor do contrato já estava quitado, de modo que o débito deveria ser declarado extinto, mesma consequência material do pedido formulado. Sobre a hipótese apresentada, assinale a afirmativa correta.", "alts": ["O magistrado deve, antes de apreciar o tema da nova prova documental, designar nova conciliação, agora pertinente à alegada quitação.", "O magistrado apenas deve anuir com o deferimento e futuro exame dessa nova prova se o réu não se opuser à exibição.", "O magistrado deve indeferir a prova, ainda que haja concordância do réu, mas apenas se puder, desde logo, julgar a favor do autor.", "O magistrado deve indeferir a prova por ser impertinente e desnecessária.", "O magistrado deve indeferir essa prova, observando que o prazo para requerê-la seria até a réplica, último momento em que ela seria imperativa."], "coms": ["Errada. Não há necessidade de nova conciliação. O problema é que a prova não guarda relação com a causa de pedir.", "Errada. A concordância do réu não torna pertinente uma prova sobre fato estranho à demanda. Depois do saneamento, alterar a causa de pedir é vedado (CPC, art. 329, II).", "Errada. A prova deve ser indeferida por ser impertinente, independentemente do resultado do julgamento.", "CORRETA. A causa de pedir é só a coação. A quitação é fato jurídico diverso, não alegado na inicial, e não pode ser introduzida após o saneamento (art. 329). Cabe ao juiz indeferir as diligências inúteis ou meramente protelatórias (art. 370, parágrafo único).", "Errada. O fundamento não é a preclusão temporal do pedido de prova, e sim a impertinência em relação à causa de pedir."], "c": 3, "base": "CPC, arts. 141, 329, 357 e 370, parágrafo único.", "dica": "A prova serve para os fatos controvertidos da causa de pedir. Fato novo que mudaria a causa de pedir depois do saneamento é inadmissível (estabilização da demanda).", "id": "F2024.1-50", "cod": "FGV 2024.1-Q50"}, {"n": 23, "disc": "Direito Processual Civil", "tema": "Juizado Especial da Fazenda Pública (Lei 12.153/2009)", "item": "P22 Juizados", "nivel": "médio", "origem": "Inédita", "enun": "Clara, servidora pública estadual, pretende ajuizar ação em face do Estado Alfa para cobrar diferenças remuneratórias no valor de R$ 30.000,00, em comarca onde está instalado o Juizado Especial da Fazenda Pública. Na mesma comarca, seu colega Marcos pretende anular a pena de demissão que lhe foi imposta.\nSobre a hipótese, assinale a afirmativa correta.", "alts": ["Clara pode optar entre o Juizado e a Vara da Fazenda Pública, por se tratar de competência relativa.", "A ação de Marcos também pode tramitar no Juizado, desde que o valor da causa não ultrapasse 60 salários mínimos.", "O Estado terá prazo em dobro para contestar e recorrer, nos termos do Art. 183 do CPC.", "A sentença de procedência na ação de Clara estará sujeita a reexame necessário.", "A ação de Clara é de competência absoluta do Juizado Especial da Fazenda Pública, no qual não há prazo diferenciado para o Estado nem reexame necessário; a ação de Marcos está excluída da competência do Juizado."], "coms": ["Errada. Onde instalado, o JEFP tem competência absoluta (art. 2º, §4º), ao contrário do Juizado Cível comum da Lei 9.099, que é opcional.", "Errada. A exclusão da impugnação de pena de demissão independe do valor (art. 2º, §1º, III).", "Errada. A Lei 12.153 afasta o prazo diferenciado para as pessoas jurídicas de direito público (art. 7º).", "Errada. Não há reexame necessário nos Juizados da Fazenda Pública (art. 11).", "CORRETA. A competência do JEFP é absoluta onde instalado, até 60 salários mínimos (Lei 12.153, art. 2º, caput e §4º). Não há prazo diferenciado para a Fazenda (art. 7º) nem reexame necessário (art. 11). A impugnação de pena de demissão está expressamente excluída (art. 2º, §1º, III)."], "c": 4, "base": "Lei 12.153/2009, arts. 2º, 5º, 7º e 11.", "dica": "Fora do JEFP: MS, desapropriação, ação popular, improbidade, execução fiscal, direitos difusos e coletivos, imóveis do ente e demissão de servidor.", "id": "i-80dc22ce", "cod": "PCI-0006"}, {"n": 24, "disc": "Direito Civil", "tema": "Usucapião familiar (art. 1.240-A do CC)", "item": "V10-11 Posse/propriedade/usucapião/registro", "nivel": "médio", "origem": "Inédita", "enun": "Marta e Fábio, casados sob o regime da comunhão parcial, adquiriram durante o casamento um apartamento de 120 m² na cidade de Salvador, onde residiam com os dois filhos. Em janeiro de 2023, Fábio abandonou o lar, mudou-se para outro estado e não deu mais notícias, deixando de contribuir com qualquer despesa. Marta permaneceu no imóvel com os filhos, sem oposição, e não possui outro imóvel. Em março de 2025, Marta procurou orientação jurídica.\nSobre a situação de Marta, assinale a afirmativa correta.", "alts": ["Marta pode adquirir o domínio integral do imóvel por usucapião familiar, pois exerceu por mais de dois anos, ininterruptamente e sem oposição, posse direta e exclusiva sobre imóvel urbano de até 250 m² que dividia com o ex-cônjuge que abandonou o lar, utilizando-o para sua moradia e de sua família.", "Marta somente poderá adquirir a parte de Fábio por usucapião especial urbana, após cinco anos de posse.", "Marta adquire apenas a metade ideal de Fábio, mantido o condomínio sobre a outra fração.", "A usucapião familiar é inviável, pois exige o prévio divórcio do casal.", "A usucapião familiar é inviável, pois a lei a restringe a imóveis rurais destinados à subsistência familiar."], "coms": ["CORRETA. Todos os requisitos do art. 1.240-A do CC estão presentes: 2 anos, imóvel urbano de até 250 m², copropriedade com quem abandonou o lar, moradia e ausência de outro imóvel. O direito só é reconhecido uma vez ao mesmo possuidor (§1º).", "Errada. Os 5 anos são da usucapião especial urbana (CF, art. 183; CC, art. 1.240). A usucapião familiar tem prazo de 2 anos.", "Errada. Ela adquire o domínio INTEGRAL: a metade dela ela já tinha, e usucape a metade de Fábio.", "Errada. A lei fala em 'ex-cônjuge ou ex-companheiro', mas a jurisprudência e os enunciados das Jornadas admitem a contagem a partir da separação de fato com abandono do lar. O divórcio prévio não é requisito.", "Errada. A usucapião familiar é para imóvel URBANO de até 250 m²."], "c": 0, "base": "CC, arts. 1.238 a 1.242 e 1.240-A; CF, art. 183.", "dica": "Prazos de usucapião: 2 anos (familiar), 5 anos (especial urbana e rural; ordinária com moradia), 10 anos (ordinária; extraordinária com moradia) e 15 anos (extraordinária).", "id": "i-1c1b1ffb", "cod": "CIV-0006"}, {"n": 25, "disc": "Direito Civil", "tema": "Cláusula penal", "item": "V06 Obrigações", "nivel": "médio", "origem": "ENAM 2024.1 – Q60", "enun": "Quanto à cláusula penal, assinale a afirmativa correta.", "alts": ["A cláusula penal, pacto acessório, acompanha a obrigação principal, não podendo ser constituída em ato separado concomitante ou posterior àquele que constitui a obrigação principal.", "Não pode o credor invocar a cláusula penal compensatória e pretender, cumulativamente, as perdas e os danos, exceto quando as partes tenham pactuado que a cláusula penal funciona como mínimo da reparação, o que autoriza a indenização suplementar.", "Fixada a cláusula penal indenizatória em valor superior ao valor da obrigação principal, considera-se inválida a cláusula em sua integralidade, visto que poderia estimular o interesse do credor no descumprimento da avença, a figurar como fonte de enriquecimento sem causa.", "É facultado ao julgador reduzir equitativamente a cláusula penal quando a obrigação principal tiver sido cumprida em parte ou quando o montante da penalidade for manifestamente excessivo, tendo em vista a natureza, a finalidade do negócio e o estado anímico do contratante.", "Fixada em obrigação indivisível, na hipótese de pluralidade de devedores, é possível exigir de qualquer um deles a integralidade do pagamento da cláusula penal, mas aquele que pagar terá ação regressiva contra o culpado, a fim de evitar seu enriquecimento sem causa."], "coms": ["Errada. A cláusula penal pode ser estipulada junto com a obrigação ou em ato posterior (CC, art. 409).", "CORRETA. Ainda que o prejuízo exceda a cláusula penal, o credor não pode exigir indenização suplementar se isso não foi convencionado. Se foi, a pena vale como mínimo da indenização (art. 416, parágrafo único).", "Errada. O valor da cominação não pode exceder o da obrigação principal (art. 412), mas o excesso leva à redução, e não à invalidade total da cláusula.", "Errada. A redução é um DEVER do juiz ('deve ser reduzida', art. 413), e não uma faculdade. Além disso, o 'estado anímico' não é critério legal.", "Errada. Na obrigação indivisível, todos os devedores incorrem na pena, mas ela só pode ser demandada integralmente do culpado. Os demais respondem só pela sua quota (art. 414)."], "c": 1, "base": "CC, arts. 408 a 416.", "dica": "Releia os arts. 408 a 416 de uma vez. A FGV cobra a literalidade: posterior (409), limite da principal (412), deve reduzir (413), indivisível (414) e indenização suplementar (416).", "id": "F2024.1-60", "cod": "FGV 2024.1-Q60"}, {"n": 26, "disc": "Direito Civil", "tema": "Alienação fiduciária de imóvel e CDC (Tema 1.095/STJ)", "item": "V12-14 Condomínio/fiduciária/garantias", "nivel": "difícil", "origem": "Inédita", "enun": "Vítor adquiriu de uma incorporadora um apartamento, com financiamento garantido por alienação fiduciária devidamente registrada na matrícula. Após pagar 40% do preço, ficou inadimplente e foi constituído em mora. Vítor ajuizou ação pleiteando a resolução do contrato e a restituição de 75% das parcelas pagas, com base no Código de Defesa do Consumidor.\nÀ luz da jurisprudência do Superior Tribunal de Justiça, assinale a afirmativa correta.", "alts": ["Vítor tem direito à restituição de 75% das parcelas pagas, por aplicação do Art. 53 do CDC, que veda a perda total das prestações.", "A resolução do pacto deve observar o procedimento da Lei nº 9.514/1997, com consolidação da propriedade e leilões, afastando-se a aplicação do Código de Defesa do Consumidor.", "A resolução depende de ação judicial de rescisão contratual, sendo vedada a consolidação extrajudicial da propriedade.", "Vítor tem direito à restituição integral das parcelas pagas, por se tratar de relação de consumo.", "A alienação fiduciária somente produz efeitos após a quitação integral do preço pelo devedor fiduciante."], "coms": ["Errada. O Tema 1.095 afasta o CDC quando há alienação fiduciária registrada. A devolução segue a sistemática dos leilões da Lei 9.514.", "CORRETA. Tese do Tema 1.095/STJ: no contrato de compra e venda de imóvel com alienação fiduciária registrada, a resolução por inadimplemento do devedor constituído em mora segue a Lei 9.514/1997, legislação específica, afastado o CDC.", "Errada. A Lei 9.514 prevê intimação, consolidação e leilões pela via extrajudicial, no registro de imóveis.", "Errada. Não há restituição integral: aplica-se o procedimento da Lei 9.514/1997.", "Errada. A propriedade fiduciária se constitui com o registro do contrato e produz efeitos desde então. Com a quitação, ela se resolve em favor do devedor."], "c": 1, "base": "Lei 9.514/1997, arts. 22 a 27; CDC, art. 53; STJ, Tema 1.095; Lei 14.711/2023 (Marco Legal das Garantias).", "dica": "Imóvel com alienação fiduciária registrada segue a Lei 9.514 (Tema 1.095). Promessa de compra e venda sem fiduciária segue o CDC ou a Lei 13.786/2018 (distrato).", "id": "i-81c3b3ab", "cod": "CIV-0007"}, {"n": 27, "disc": "Direito Civil", "tema": "Atos que exigem outorga conjugal", "item": "V19 Família e sucessões", "nivel": "fácil", "origem": "ENAM 2025.2 – Q51", "enun": "Antônio e Clara se casaram pelo regime da comunhão parcial de bens. Na constância do casamento, os cônjuges praticaram os seguintes atos: I. Antônio obteve empréstimo junto à instituição financeira para comprar as coisas necessárias à economia doméstica. II. Clara propôs ação judicial para discutir a venda de um dos bens imóveis do casal. III. Antônio hipotecou a fazenda que adquiriu antes do casamento. Exigem vênia conjugal os ato(s) praticado(s) em", "alts": ["I, apenas.", "I e II, apenas.", "I e III, apenas.", "II e III, apenas", "I, II e III."], "coms": ["Errada. O empréstimo para comprar coisas necessárias à economia doméstica dispensa autorização do outro cônjuge (CC, arts. 1.643 e 1.644).", "Errada. A I não exige outorga.", "Errada. A I não exige outorga.", "CORRETA. Salvo no regime da separação absoluta, nenhum cônjuge pode, sem autorização do outro, pleitear como autor ou réu acerca de bens imóveis (art. 1.647, II) nem gravar de ônus real os bens imóveis (art. 1.647, I), mesmo que sejam bens particulares, como a fazenda anterior ao casamento.", "Errada. A I não exige outorga."], "c": 3, "base": "CC, arts. 1.643, 1.644 e 1.647.", "dica": "O art. 1.647 vale para todos os regimes, salvo a separação absoluta, e alcança inclusive os imóveis particulares.", "id": "F2025.2-51", "cod": "FGV 2025.2-Q51"}, {"n": 28, "disc": "Direito Civil", "tema": "Desconsideração da personalidade jurídica (teoria maior)", "item": "V03 Pessoa jurídica/desconsideração", "nivel": "médio", "origem": "Inédita", "enun": "A sociedade empresária Alfa Ltda., que fornece insumos a outras empresas, tornou-se insolvente após sucessivos prejuízos operacionais. Não há indícios de confusão patrimonial nem de desvio de finalidade. A credora Beta S.A., que adquiria insumos para sua linha de produção, requereu a desconsideração da personalidade jurídica para atingir o patrimônio dos sócios, alegando apenas a insuficiência de bens de Alfa e o fato de os sócios integrarem o mesmo grupo econômico de outra empresa solvente.\nSobre o pedido, assinale a afirmativa correta.", "alts": ["O pedido deve ser deferido, pois a insolvência da pessoa jurídica é suficiente para a desconsideração, segundo a teoria menor.", "O pedido deve ser indeferido, pois a desconsideração da personalidade jurídica somente pode ser decretada de ofício pelo juiz.", "O pedido deve ser deferido, pois a existência de grupo econômico autoriza, por si só, a extensão da responsabilidade aos sócios.", "O pedido deve ser deferido, mas a responsabilidade dos sócios será subsidiária e limitada ao valor de suas quotas.", "O pedido deve ser indeferido, pois, no Código Civil, a desconsideração exige abuso da personalidade jurídica, caracterizado por desvio de finalidade ou confusão patrimonial, e a mera existência de grupo econômico não autoriza a medida."], "coms": ["Errada. A teoria menor (CDC, art. 28, §5º; legislação ambiental) não se aplica a relação empresarial de insumo entre empresas.", "Errada. A desconsideração depende de requerimento da parte ou do MP (art. 50; CPC, art. 133).", "Errada. O art. 50, §4º, diz o contrário.", "Errada. Os requisitos não estão presentes. Além disso, quando cabível, a desconsideração alcança os bens particulares dos administradores ou sócios beneficiados direta ou indiretamente pelo abuso.", "CORRETA. O CC adota a teoria MAIOR (art. 50): insolvência isolada não basta, e a mera existência de grupo econômico sem os requisitos do caput não autoriza a desconsideração (art. 50, §4º). Beta não é consumidora, porque usa os insumos na produção, e por isso não se aplica a teoria menor do CDC."], "c": 4, "base": "CC, art. 50 (redação da Lei 13.874/2019); CDC, art. 28, §5º; CPC, arts. 133 a 137.", "dica": "Teoria maior (CC): abuso, com desvio de finalidade ou confusão patrimonial. Teoria menor (CDC, ambiental): basta o obstáculo ao ressarcimento. Ampliar ou mudar a atividade original não é desvio de finalidade (art. 50, §5º).", "id": "i-92e772af", "cod": "CIV-0008"}, {"n": 29, "disc": "Direito Civil", "tema": "Marco Civil: divulgação não consentida de imagens íntimas", "item": "V18 Marco Civil/LGPD", "nivel": "médio", "origem": "Inédita", "enun": "Após o término de um relacionamento, o ex-namorado de Paula publicou, em uma rede social, vídeos íntimos do casal, sem autorização dela. Paula enviou notificação extrajudicial ao provedor de aplicação, indicando com precisão os endereços eletrônicos das publicações. Passados dez dias, o conteúdo permanecia disponível.\nÀ luz do Marco Civil da Internet (Lei nº 12.965/2014), assinale a afirmativa correta.", "alts": ["O provedor responde solidariamente com o autor da publicação, independentemente de notificação.", "O provedor somente responderia após descumprir ordem judicial específica, pois a lei condiciona sua responsabilidade à prévia decisão judicial em qualquer hipótese.", "O provedor não responde, pois a notificação extrajudicial somente poderia ser feita por advogado constituído.", "O provedor responde subsidiariamente pela violação da intimidade de Paula, pois deixou de promover, de forma diligente, a indisponibilização do conteúdo após receber notificação da participante com os elementos que permitiam sua identificação específica.", "O provedor não responde, pois a remoção de conteúdo violaria a liberdade de expressão do usuário que o publicou."], "coms": ["Errada. A responsabilidade é SUBSIDIÁRIA e depende de notificação descumprida (art. 21).", "Errada. A regra do art. 19 (ordem judicial) tem exceção expressa no art. 21 para conteúdo íntimo não consentido.", "Errada. A notificação pode ser feita pelo participante ou por seu representante legal (art. 21).", "CORRETA. O art. 21 do Marco Civil traz regime próprio para imagens, vídeos ou outros materiais com cenas de nudez ou atos sexuais de caráter privado: basta a notificação do participante, sem ordem judicial, e o provedor que não remove responde subsidiariamente.", "Errada. A divulgação não consentida de intimidade sexual não é protegida pela liberdade de expressão e configura, inclusive, crime (CP, art. 218-C)."], "c": 3, "base": "Lei 12.965/2014, arts. 19 e 21; CP, art. 218-C; CF, art. 5º, X.", "dica": "O edital (Civil, item 18) cita o Marco Civil e a LGPD. Guarda de registros: conexão por 1 ano (art. 13) e acesso a aplicações por 6 meses (art. 15).", "id": "i-c3473199", "cod": "CIV-0009"}, {"n": 30, "disc": "Direito Civil", "tema": "Fraude bancária e fortuito interno (Súmula 479/STJ)", "item": "V20 Consumidor", "nivel": "fácil", "origem": "Inédita", "enun": "Terceiros, utilizando documentos falsificados em nome de Sônia, abriram conta corrente e contrataram empréstimo em um banco digital. Diante do inadimplemento, o nome de Sônia foi inscrito em cadastro de inadimplentes. O banco alegou que também foi vítima de estelionatários e que adotou os procedimentos usuais de verificação.\nSobre a responsabilidade do banco, assinale a afirmativa correta.", "alts": ["O banco responde objetivamente pelos danos causados a Sônia, pois as fraudes praticadas por terceiros no âmbito de operações bancárias configuram fortuito interno.", "Sônia não pode invocar o CDC, pois não celebrou qualquer contrato com o banco.", "O CDC não se aplica às instituições financeiras, que se submetem exclusivamente à regulação do Banco Central.", "O banco responde subjetivamente, devendo Sônia provar sua culpa na verificação dos documentos.", "O banco não responde, pois a fraude praticada por terceiro configura excludente de responsabilidade, nos termos do Art. 14, § 3º, II, do CDC."], "coms": ["CORRETA. Súmula 479/STJ: as instituições financeiras respondem objetivamente pelos danos gerados por fortuito interno relativo a fraudes e delitos praticados por terceiros no âmbito de operações bancárias. Sônia é consumidora por equiparação (CDC, art. 17).", "Errada. Ela é consumidora por equiparação, como vítima do evento (CDC, art. 17).", "Errada. O CDC se aplica às instituições financeiras (Súmula 297/STJ; STF, ADI 2.591).", "Errada. A responsabilidade é objetiva (CDC, art. 14; Súmula 479).", "Errada. A culpa exclusiva de terceiro só exclui a responsabilidade quando o fato é EXTERNO ao risco da atividade. A fraude bancária é risco inerente ao negócio."], "c": 0, "base": "CDC, arts. 14 e 17; Súmulas 297, 385 e 479/STJ; STF, ADI 2.591.", "dica": "Na inscrição indevida, o dano moral é presumido (in re ipsa), salvo se já houver anotação legítima anterior (Súmula 385/STJ).", "id": "i-5bb34dd0", "cod": "CIV-0010"}, {"n": 31, "disc": "Direito Empresarial", "tema": "Sociedade simples x empresária", "item": "E04 Sociedades (geral/não personificadas/simples)", "nivel": "médio", "origem": "Inédita", "enun": "Três médicos constituíram uma sociedade para prestar serviços de consultas em suas especialidades, cada um atendendo pessoalmente seus pacientes, em consultório alugado, com uma secretária. Anos depois, a sociedade passou a operar um grande hospital, com centenas de empregados, setor de compras, farmácia, lanchonete e estacionamento, em que os sócios já não atendem pacientes e se dedicam apenas à gestão.\nSobre a natureza da sociedade, assinale a afirmativa correta.", "alts": ["A sociedade sempre foi simples, pois a atividade médica jamais pode ser considerada empresarial.", "Inicialmente a sociedade era simples, pois exercia profissão intelectual de natureza científica sem elemento de empresa; com a nova estrutura, em que a atividade intelectual passou a ser elemento de empresa, ela passou a ter natureza empresária.", "A sociedade passou a ser empresária porque contratou empregados, o que é suficiente para caracterizar o elemento de empresa.", "A sociedade sempre foi empresária, pois toda atividade econômica organizada com finalidade lucrativa é empresarial.", "A natureza da sociedade depende exclusivamente do tipo societário adotado no contrato social."], "coms": ["Errada. A atividade intelectual pode virar elemento de empresa quando absorvida por uma organização empresarial.", "CORRETA. O art. 966, parágrafo único, do CC não considera empresário quem exerce profissão intelectual, salvo se o exercício constituir elemento de empresa. A organização dos fatores de produção, com a atividade intelectual diluída na estrutura, caracteriza a empresa.", "Errada. Ter empregados não basta, porque a sociedade inicial já tinha uma secretária. O critério é a organização em que a atividade intelectual se torna um componente da empresa.", "Errada. A profissão intelectual sem elemento de empresa não é empresarial (art. 966, parágrafo único).", "Errada. Em regra, a natureza decorre do OBJETO (art. 982). Por força de lei, a S.A. é sempre empresária e a cooperativa é sempre simples (art. 982, parágrafo único)."], "c": 1, "base": "CC, arts. 966, 982 e 983.", "dica": "Por força de lei, a S.A. é sempre empresária e a cooperativa é sempre simples. A sociedade de advogados é sempre simples e registrada na OAB (Lei 8.906, art. 15).", "id": "i-f656b4d0", "cod": "EMP-0002"}, {"n": 32, "disc": "Direito Empresarial", "tema": "Quóruns na sociedade limitada (Lei 14.451/2022)", "item": "E05 Limitada e S.A.", "nivel": "difícil", "origem": "Inédita", "enun": "A Sociedade Delta Ltda. tem três sócios: Ana, com 55% do capital; Bruno, com 30%; e Caio, com 15%. O capital está totalmente integralizado. Ana pretende designar como administrador Pedro, profissional de mercado que não é sócio, e alterar o contrato social para mudar a sede da sociedade. Bruno e Caio discordam das duas medidas.\nConsiderando o Código Civil, com as alterações da Lei nº 14.451/2022, assinale a afirmativa correta.", "alts": ["A designação de administrador não sócio exige aprovação de, no mínimo, dois terços do capital social, após a integralização.", "A sociedade limitada não pode ter administrador que não seja sócio.", "A designação de administrador não sócio exige a unanimidade dos sócios, de modo que Bruno e Caio podem impedi-la.", "Ana, sozinha, pode aprovar as duas deliberações, pois, integralizado o capital, a designação de administrador não sócio depende de titulares de mais da metade do capital, e a modificação do contrato social também se aprova pelos votos de mais da metade do capital.", "A modificação do contrato social exige votos correspondentes a, no mínimo, três quartos do capital social."], "coms": ["Errada. Os 2/3 do capital eram a regra antiga. Desde a Lei 14.451/2022, após a integralização, basta mais da metade do capital.", "Errada. A administração por não sócio é admitida, desde que o contrato permita (art. 1.061).", "Errada. A unanimidade era exigida na redação original, enquanto o capital não estivesse integralizado. A regra atual é de 2/3 dos sócios nessa fase e de mais da metade do capital após a integralização.", "CORRETA. Art. 1.061 do CC (Lei 14.451/2022): administrador não sócio depende de 2/3 dos sócios enquanto o capital não estiver integralizado e de mais da metade do capital após a integralização. A modificação do contrato social (art. 1.071, V) também exige mais da metade do capital (art. 1.076, II). Com 55%, Ana aprova as duas.", "Errada. O quórum de 3/4 (antigo art. 1.076, I) foi revogado pela Lei 14.451/2022. Hoje basta mais da metade do capital."], "c": 3, "base": "CC, arts. 1.061, 1.071, 1.076 e 1.085 (redação da Lei 14.451/2022).", "dica": "A Lei 14.451/2022 derrubou os quóruns de 3/4 e de 2/3 do capital. Hoje, na limitada, 'mais da metade do capital' resolve quase tudo.", "id": "i-0a13779e", "cod": "EMP-0003"}, {"n": 33, "disc": "Direito Penal", "tema": "Feminicídio como crime autônomo (Lei 14.994/2024)", "item": "D21a Crimes contra a pessoa/honra", "nivel": "médio", "origem": "Inédita", "enun": "Em março de 2025, Rui matou sua companheira, Lia, com quem vivia em união estável, após discussão motivada por ciúmes, no interior da residência do casal.\nConsiderando a legislação penal vigente, assinale a afirmativa correta.", "alts": ["Rui praticou feminicídio, crime autônomo previsto no Art. 121-A do Código Penal, com pena de reclusão de 20 a 40 anos, pois o crime envolve violência doméstica e familiar, o que caracteriza as razões da condição do sexo feminino.", "Rui praticou homicídio simples, pois o motivo foi ciúme, e não o menosprezo à condição de mulher.", "A conduta de Rui configura feminicídio, mas a pena aplicável é a do homicídio qualificado, em respeito ao princípio da legalidade, pois a lei nova é mais gravosa.", "O feminicídio exige que a vítima seja casada com o autor, não se aplicando às uniões estáveis.", "Rui praticou homicídio qualificado pelo feminicídio, previsto no Art. 121, § 2º, VI, do Código Penal, com pena de 12 a 30 anos."], "coms": ["CORRETA. A Lei 14.994/2024 transformou o feminicídio em tipo autônomo (art. 121-A), com pena de 20 a 40 anos. Há razões da condição do sexo feminino quando o crime envolve violência doméstica e familiar ou menosprezo ou discriminação à condição de mulher (§1º). O feminicídio é crime hediondo.", "Errada. A violência doméstica e familiar já caracteriza, por si só, as razões da condição do sexo feminino (art. 121-A, §1º, I).", "Errada. O fato ocorreu em março de 2025, depois da entrada em vigor da Lei 14.994/2024. Aplica-se a lei vigente à época do fato.", "Errada. A violência doméstica e familiar abrange qualquer relação íntima de afeto, independentemente de coabitação ou de casamento (Lei 11.340, art. 5º).", "Errada. Para fatos posteriores à Lei 14.994/2024 (outubro de 2024), o feminicídio deixou de ser qualificadora do art. 121 e passou a crime autônomo, com pena mais grave."], "c": 0, "base": "CP, art. 121-A (Lei 14.994/2024); Lei 11.340/2006, art. 5º; Lei 8.072/1990.", "dica": "Feminicídio é crime autônomo desde 10/10/2024, com pena de 20 a 40 anos e aumento de 1/3 até a metade nas hipóteses do §2º (gestação, menor de 14, maior de 60, descumprimento de medida protetiva, presença de descendente ou ascendente etc.).", "id": "i-41df5785", "cod": "PEN-0007"}, {"n": 34, "disc": "Direito Penal", "tema": "Peculato e arrependimento posterior", "item": "D21b Crimes contra o patrimônio", "nivel": "médio", "origem": "ENAM 2026.1 – Q74", "enun": "Filomena, Presidente de Câmara Municipal, nomeou e incluiu na folha de pagamento da casa legislativa, como servidor comissionado, determinado indivíduo, sem o conhecimento dele, o qual jamais trabalhou naquele órgão público, sendo a sua remuneração inteiramente embolsada por Filomena. Diante do caso narrado, Filomena cometeu o crime de", "alts": ["peculato, cuja punibilidade se extinguirá, caso ela repare o dano antes da sentença irrecorrível.", "peculato, cabendo a incidência de causa de diminuição da pena, caso ela repare o dano depois da sentença irrecorrível.", "peculato, cabendo a incidência de causa de diminuição de pena, caso ela repare o dano, por ato voluntário, antes do recebimento da denúncia.", "emprego irregular de verbas ou rendas públicas, cabendo a incidência de causa de diminuição de pena, caso ela repare o dano depois da sentença irrecorrível.", "emprego irregular de verbas ou rendas públicas, cabendo a incidência de causa de diminuição de pena, caso ela repare o dano, por ato voluntário, antes do recebimento da denúncia."], "coms": ["Errada. A extinção da punibilidade pela reparação antes da sentença irrecorrível é exclusiva do peculato CULPOSO (art. 312, §3º). Filomena agiu com dolo.", "Errada. A redução pela metade com reparação após a sentença irrecorrível também é exclusiva do peculato culposo (art. 312, §3º).", "CORRETA. Desviar em proveito próprio a remuneração de um servidor 'fantasma' é peculato-desvio (art. 312, caput). Como o crime não tem violência ou grave ameaça, a reparação voluntária até o recebimento da denúncia autoriza a redução de 1/3 a 2/3 pelo arrependimento posterior (art. 16).", "Errada. O emprego irregular de verbas (art. 315) é dar destinação pública diversa da prevista em lei. Aqui houve apropriação em proveito próprio.", "Errada. O tipo é peculato, e não emprego irregular de verbas."], "c": 2, "base": "CP, arts. 16, 312 e 315.", "dica": "No peculato doloso, a reparação do dano antes da denúncia leva ao arrependimento posterior (art. 16), com redução de 1/3 a 2/3. Os benefícios do art. 312, §3º, são só do peculato culposo.", "id": "F2026.1-74", "cod": "FGV 2026.1-Q74"}, {"n": 35, "disc": "Direito Penal", "tema": "Lavagem de dinheiro — autonomia em relação à infração antecedente", "item": "D18 Penal econômico/PJ", "nivel": "médio", "origem": "Inédita", "enun": "O Ministério Público denunciou Gustavo por lavagem de dinheiro, por ter ocultado, por meio de empresas de fachada, valores provenientes de tráfico de drogas praticado por terceiros. A defesa sustentou que (i) o autor do tráfico não foi identificado; e (ii) não houve condenação definitiva pelo crime antecedente.\nÀ luz da Lei nº 9.613/1998, assinale a afirmativa correta.", "alts": ["A extinção da punibilidade do crime antecedente impede a persecução pela lavagem.", "A denúncia deve ser rejeitada, pois a lavagem pressupõe que o crime antecedente conste de rol taxativo previsto em lei.", "A denúncia deve ser rejeitada, pois somente o autor do crime antecedente pode responder por lavagem dos valores dele provenientes.", "A denúncia deve ser rejeitada, pois a punição da lavagem depende da condenação definitiva pelo crime antecedente.", "A denúncia pode ser recebida se instruída com indícios suficientes da existência da infração penal antecedente, sendo puníveis os fatos de lavagem ainda que desconhecido ou isento de pena o autor daquela infração."], "coms": ["Errada. O art. 2º, §1º, diz o contrário: a lavagem é punível mesmo com a punibilidade do antecedente extinta.", "Errada. Desde a Lei 12.683/2012, qualquer infração penal pode ser antecedente da lavagem.", "Errada. Terceiros que ocultam os valores respondem por lavagem. A autolavagem também é punível, segundo a jurisprudência.", "Errada. A lavagem é crime autônomo, e não se exige condenação, nem sequer processo, pelo antecedente (art. 2º, II).", "CORRETA. O processo por lavagem independe do processo e julgamento da infração antecedente (art. 2º, II), e basta que a denúncia traga indícios suficientes da existência dela, ainda que o autor seja desconhecido, isento de pena ou com punibilidade extinta (art. 2º, §1º)."], "c": 4, "base": "Lei 9.613/1998, arts. 1º e 2º (redação da Lei 12.683/2012).", "dica": "Lavagem: crime autônomo, qualquer infração penal pode ser antecedente, e bastam indícios do antecedente. O edital cita criptomoedas e lavagem em Humanística (item 7).", "id": "i-da90401c", "cod": "PEN-0008"}, {"n": 36, "disc": "Direito Penal", "tema": "Classificação dos crimes quanto ao resultado", "item": "D07 Iter criminis", "nivel": "fácil", "origem": "ENAM 2026.1 – Q78", "enun": "Segundo o Art. 14, inciso I, do Código Penal, in verbis: Diz-se o crime: I - consumado, quando nele se reúnem todos os elementos de sua definição legal. À luz desse conceito, assinale a opção que somente contém espécies de crimes cuja consumação independe da produção de resultado naturalístico.", "alts": ["Crimes materiais e formais.", "Crimes materiais e culposos.", "Crimes de mera conduta e formais.", "Crimes omissivos próprios e culposos.", "Crimes omissivos impróprios e qualificados pelo resultado."], "coms": ["Errada. O crime material exige o resultado naturalístico para se consumar.", "Errada. Os crimes material e culposo dependem de resultado naturalístico. O culposo, em regra, só existe se houver o resultado.", "CORRETA. Crime formal: o tipo descreve o resultado, mas a consumação ocorre antes dele (consumação antecipada). Crime de mera conduta: o tipo nem descreve resultado naturalístico, como a violação de domicílio.", "Errada. O crime culposo depende do resultado.", "Errada. O omissivo impróprio exige resultado (art. 13, §2º), e o qualificado pelo resultado também."], "c": 2, "base": "CP, arts. 13 e 14, I.", "dica": "Material: o resultado é necessário. Formal: o resultado é possível, mas dispensável. Mera conduta: não há resultado naturalístico. Na questão 79 do simulado, a definição correta era a de crime formal.", "id": "F2026.1-78", "cod": "FGV 2026.1-Q78"}, {"n": 37, "disc": "Direito Penal", "tema": "Princípio da insignificância", "item": "D01-03 Princípios/lei penal no tempo e espaço", "nivel": "fácil", "origem": "Inédita", "enun": "Joel, primário e sem antecedentes, subtraiu de um supermercado duas barras de chocolate, avaliadas em R$ 14,00, que foram imediatamente restituídas. Em outro caso, Marta, servidora pública, apropriou-se de R$ 50,00 da caixa da repartição em que trabalhava. Em um terceiro caso, Válter, no âmbito de violência doméstica, desferiu um tapa em sua esposa, sem deixar lesões aparentes.\nÀ luz da jurisprudência dos Tribunais Superiores, o princípio da insignificância", "alts": ["pode ser aplicado aos três casos, pois nenhuma das condutas causou lesão relevante.", "pode ser aplicado a Joel e a Marta, pois em ambos os casos o valor é ínfimo.", "pode ser aplicado a Válter, pois não houve lesão aparente.", "pode ser aplicado apenas a Joel.", "não pode ser aplicado a nenhum dos casos, pois o furto, ainda que de pequeno valor, configura apenas furto privilegiado."], "coms": ["Errada. As Súmulas 589 e 599 do STJ afastam a insignificância nos casos de Válter e de Marta.", "Errada. No crime contra a Administração Pública, o bem jurídico é também a moralidade administrativa, e não só o patrimônio (Súmula 599/STJ).", "Errada. Súmula 589/STJ.", "CORRETA. Joel preenche os vetores do STF: mínima ofensividade, nenhuma periculosidade social, reduzidíssimo grau de reprovabilidade e inexpressividade da lesão. Marta: Súmula 599/STJ (insignificância inaplicável aos crimes contra a Administração Pública). Válter: Súmula 589/STJ (inaplicável aos crimes ou contravenções contra a mulher no âmbito doméstico).", "Errada. O furto privilegiado (art. 155, §2º) reduz a pena. Quando a lesão é ínfima e os demais vetores estão presentes, a insignificância afasta a tipicidade material."], "c": 3, "base": "CP, art. 155; Súmulas 589 e 599/STJ; STF, HC 84.412 (vetores da insignificância).", "dica": "Os quatro vetores do STF formam o 'MARI': Mínima ofensividade, Ausência de periculosidade, Reduzido grau de reprovabilidade e Inexpressividade da lesão.", "id": "i-5be9fead", "cod": "PEN-0009"}, {"n": 38, "disc": "Direito Penal", "tema": "Prescrição retroativa e redução pela idade", "item": "D17 Extinção da punibilidade/prescrição", "nivel": "difícil", "origem": "Inédita", "enun": "Leonardo, com 20 anos de idade na data do fato, praticou furto simples em 10 de março de 2020. A denúncia foi recebida em 2 de junho de 2021, e a sentença condenatória, publicada em 15 de agosto de 2023, fixou a pena definitiva em 1 ano de reclusão. Apenas a defesa recorreu.\nSobre a hipótese, assinale a afirmativa correta.", "alts": ["O juiz poderia ter reconhecido a prescrição antes da sentença, com base na pena que provavelmente seria aplicada.", "Não ocorreu a prescrição, pois o prazo é de quatro anos, e a redução pela idade somente se aplica ao agente maior de 70 anos na data da sentença.", "Não ocorreu a prescrição, pois a prescrição pela pena aplicada somente pode ser reconhecida após o trânsito em julgado para ambas as partes.", "Ocorreu a prescrição retroativa, contada entre a data do fato e o recebimento da denúncia.", "Ocorreu a prescrição da pretensão punitiva na modalidade retroativa, pois o prazo de quatro anos, reduzido à metade em razão da idade do agente ao tempo do crime, foi superado entre o recebimento da denúncia e a publicação da sentença."], "coms": ["Errada. A prescrição virtual, em perspectiva ou antecipada, é inadmissível (Súmula 438/STJ).", "Errada. O art. 115 reduz o prazo pela metade também para quem tinha menos de 21 anos ao tempo do crime.", "Errada. Basta o trânsito em julgado para a acusação ou o improvimento do recurso dela (art. 110, §1º).", "Errada. A prescrição retroativa não pode ter por termo inicial data anterior à denúncia ou queixa (art. 110, §1º, na redação da Lei 12.234/2010).", "CORRETA. Pena de 1 ano: prescrição em 4 anos (CP, art. 109, V). Leonardo tinha menos de 21 anos ao tempo do crime, e o prazo cai pela metade, para 2 anos (art. 115). Com trânsito para a acusação, conta-se pela pena aplicada (art. 110, §1º). Entre 2/6/2021 e 15/8/2023 passaram mais de 2 anos."], "c": 4, "base": "CP, arts. 109, 110, §1º, 115 e 117; Súmula 438/STJ.", "dica": "O art. 115 traz uma exceção nova, que o Vade Mecum atualizado já mostra: não há redução se o crime envolver violência sexual contra a mulher. Confira sempre a redação vigente.", "id": "i-6b0cf716", "cod": "PEN-0010"}, {"n": 39, "disc": "Direito Penal", "tema": "Abuso de autoridade (Lei 13.869/2019)", "item": "D21e Leis 7.716/12.288/13.869", "nivel": "médio", "origem": "Inédita", "enun": "O juiz Otávio decretou a prisão preventiva de um investigado, fundamentando a decisão na garantia da ordem pública. O Tribunal, em habeas corpus, revogou a prisão, por entender insuficiente a fundamentação. O investigado ofereceu representação contra Otávio por abuso de autoridade.\nÀ luz da Lei nº 13.869/2019, assinale a afirmativa correta.", "alts": ["A revogação da prisão pelo Tribunal configura, automaticamente, o crime de decretação de medida de privação da liberdade em manifesta desconformidade com as hipóteses legais.", "A divergência na interpretação de lei ou na avaliação de fatos e provas não configura, por si só, abuso de autoridade, que exige finalidade específica de prejudicar outrem, beneficiar a si mesmo ou a terceiro, ou mero capricho ou satisfação pessoal.", "A condenação por abuso de autoridade acarreta automaticamente a perda do cargo, mandato ou função pública.", "Os crimes de abuso de autoridade são de ação penal pública condicionada à representação do ofendido.", "Magistrados não podem ser sujeitos ativos de crimes de abuso de autoridade, por força da independência funcional."], "coms": ["Errada. A reforma da decisão não demonstra, por si, a manifesta desconformidade nem o dolo específico.", "CORRETA. Art. 1º, §§1º e 2º, da Lei 13.869/2019. A simples reforma da decisão pelo tribunal não configura o crime, que exige dolo específico.", "Errada. A perda do cargo e a inabilitação dependem de reincidência em crime de abuso de autoridade, não são automáticas e devem ser declaradas motivadamente na sentença (art. 4º, parágrafo único).", "Errada. A ação é pública INCONDICIONADA (art. 3º), admitida a ação privada subsidiária se o MP não agir no prazo legal.", "Errada. Os membros do Poder Judiciário estão expressamente entre os sujeitos ativos (art. 2º, IV)."], "c": 1, "base": "Lei 13.869/2019, arts. 1º a 4º e 9º.", "dica": "Abuso de autoridade exige dolo específico (prejudicar, beneficiar ou capricho), e a mera divergência de interpretação não é crime. A ação penal é pública incondicionada.", "id": "i-3b48af5c", "cod": "PEN-0011"}, {"n": 40, "disc": "Direito Penal", "tema": "Dosimetria — súmulas do STJ", "item": "D12 Penas/concurso de crimes/conflito aparente", "nivel": "médio", "origem": "Inédita", "enun": "Na dosimetria da pena de Igor, condenado por furto qualificado, o juiz: (i) elevou a pena-base em razão de duas ações penais em curso contra o réu; (ii) reconheceu a atenuante da confissão espontânea, embora o réu a tenha retratado em juízo, pois a confissão extrajudicial foi utilizada para fundamentar a condenação; e (iii) deixou de reduzir a pena abaixo do mínimo legal na segunda fase, apesar da atenuante.\nÀ luz das súmulas do STJ, está correto o que consta em", "alts": ["(ii), apenas.", "(iii), apenas.", "(i) e (iii), apenas.", "(ii) e (iii), apenas.", "(i), (ii) e (iii)."], "coms": ["Errada. (iii) também está correto.", "Errada. (ii) também está correto.", "Errada. (i) é vedado, e (ii) está correto (Súmula 545).", "CORRETA. (i) está errado: inquéritos e ações penais em curso não podem agravar a pena-base (Súmula 444/STJ). (ii) está certo: a confissão usada para formar o convencimento do julgador gera a atenuante, ainda que parcial, qualificada ou retratada (Súmula 545/STJ). (iii) está certo: a atenuante não reduz a pena abaixo do mínimo legal (Súmula 231/STJ).", "Errada. (i) contraria a Súmula 444/STJ."], "c": 3, "base": "CP, arts. 59, 65, III, d, e 68; Súmulas 231, 444 e 545/STJ.", "dica": "Súmulas da dosimetria: 231 (atenuante não reduz abaixo do mínimo), 241 (reincidência não serve como agravante e como circunstância judicial ao mesmo tempo), 444 (processos em curso não agravam a pena-base) e 545 (confissão usada na fundamentação gera atenuante).", "id": "i-e7adfa8e", "cod": "PEN-0012"}], "sims": {}, "simsPlan": ["M1", "M2", "M3"], "cobertura": {"Constitucional": [{"item": "C01 Teoria/poder constituinte/emendas", "plan": 6, "inc": 2}, {"item": "C03 Eficácia/aplicabilidade/recepção", "plan": 2, ssoa jurídica/desconsideração", "plan": 7, "inc": 2}, {"item": "V04 Bens/bem de família", "plan": 2, "inc": 0}, {"item": "V05 Negócio jurídico/defeitos/prescrição", "plan": 20, "inc": 8}, {"item": "V06 Obrigações", "plan": 36, "inc": 12}, {"item": "V07 Teoria geral dos contratos", "plan": 11, "inc": 4}, {"item": "V08 Contratos em espécie/atos unilaterais", "plan": 18, "inc": 4}, {"item": "V09 Responsabilidade civil", "plan": 14, "inc": 5}, {"item": "V10-11 Posse/propriedade/usucapião/registro", "plan": 9, "inc": 3}, {"item": "V12-14 Condomínio/fiduciária/garantias", "plan": 9, "inc": 3}, {"item": "V16-17 ECA/idoso/PcD", "plan": 4, "inc": 1}, {"item": "V18 Marco Civil/LGPD", "plan": 7, "inc": 2}, {"item": "V19 Família e sucessões", "plan": 25, "inc": 10}, {"item": "V20 Consumidor", "plan": 7, "inc": 2}], "Empresarial": [{"item": "E02 Empresário/teoria da empresa", "plan": 5, "inc": 3}, {"item": "E03 Títulos de crédito/protesto", "plan": 7, "inc": 3}, {"item": "E04 Sociedades (geral/não personificadas/simples)", "plan": 7, "inc": 3}, {"item": "E05 Limitada e S.A.", "plan": 7, "inc": 4}, {"item": "E06 Operações societárias/desconsideração", "plan": 3, "inc": 1}, {"item": "E07 Estabelecimento/trespasse/nome", "plan": 2, "inc": 0}, {"item": "E08 Contratos empresariais", "plan": 7, "inc": 4}, {"item": "E09 Bancários/SFN", "plan": 2, "inc": 0}, {"item": "E10 Recuperação/falência", "plan": 11, "inc": 7}, {"item": "E11 Propriedade industrial", "plan": 2, "inc": 1}, {"item": "E12 Consumo/comércio eletrônico", "plan": 7, "inc": 4}], "Penal": [{"item": "D01-03 Princípios/lei penal no tempo e espaço", "plan": 21, "inc": 6}, {"item": "D04-06 Teoria do crime/tipicidade/dolo/culpa", "plan": 15, "inc": 5}, {"item": "D07 Iter criminis", "plan": 28, "inc": 9}, {"item": "D08-10 Ilicitude/culpabilidade/imputabilidade", "plan": 12, "inc": 4}, {"item": "D11 Concurso de agentes", "plan": 5, "inc": 1}, {"item": "D12 Penas/concurso de crimes/conflito aparente", "plan": 18, "inc": 5}, {"item": "D13-16 Efeitos/reabilitação/medida de segurança/ação penal", "plan": 17, "inc": 6}, {"item": "D17 Extinção da punibilidade/prescrição", "plan": 7, "inc": 2}, {"item": "D18 Penal econômico/PJ", "plan": 10, "inc": 3}, {"item": "D19-20 Penal militar/tratados", "plan": 5, "inc": 1}, {"item": "D21a Crimes contra a pessoa/honra", "plan": 12, "inc": 4}, {"item": "D21b Crimes contra o patrimônio", "plan": 30, "inc": 10}, {"item": "D21c Dignidade sexual", "plan": 5, "inc": 1}, {"item": "D21d Fé pública/Adm Pública/Adm justiça", "plan": 13, "inc": 3}, {"item": "D21e Leis 7.716/12.288/13.869", "plan": 6, "inc": 0}]}, "diag": {"prova": "2º ENAM (FGV) — simulado realizado pela Karina", "meta": 56, "disciplinas": [{"nome": "Direito Constitucional", "total": 16, "validas": 16, "acertos": 12}, {"nome": "Direito Administrativo", "total": 10, "validas": 9, "acertos": 5}, {"nome": "Noções Gerais e Formação Humanística", "total": 6, "validas": 6, "acertos": 4}, {"nome": "Direitos Humanos", "total": 6, "validas": 6, "acertos": 4}, {"nome": "Direito Processual Civil", "total": 12, "validas": 12, "acertos": 9}, {"nome": "Direito Civil", "total": 12, "validas": 11, "acertos": 7}, {"nome": "Direito Empresarial", "total": 6, "validas": 6, "acertos": 4}, {"nome": "Direito Penal", "total": 12, "validas": 12, "acertos": 6}], "anuladas": [25, 62], "erros": [{"q": 4, "disc": "Direito Constitucional", "marcou": "C", "gab": "D", "tema": "Efeitos da decisão do STF em controle concentrado sobre decisão anterior", "lição": "A declaração de inconstitucionalidade em ADI não desconstitui automaticamente decisões anteriores (STF, Tema 733): é preciso recurso próprio ou ação rescisória. Acórdão de TJ que denega MS originário desafia recurso ordinário ao STJ (CF, art. 105, II, b), e não recurso extraordinário."}, {"q": 7, "disc": "Direito Constitucional", "marcou": "C", "gab": "A", "tema": "Presunção de não culpabilidade", "lição": "I reproduz a Súmula Vinculante 11 (algemas). A condução coercitiva para interrogatório foi declarada incompatível com a CF (ADPFs 395 e 444). A vedação abstrata de liberdade provisória para hediondos é inconstitucional; a prisão exige fundamentação concreta."}, {"q": 11, "disc": "Direito Constitucional", "marcou": "D", "gab": "A", "tema": "Mandado de injunção", "lição": "O STF não admite desistência do MI quando o julgamento já começou e a maioria já se formou a favor da concessão (MI 712-QO). Direitos do nascituro não configuram dever constitucional de legislar que autorize MI contra autoridades."}, {"q": 13, "disc": "Direito Constitucional", "marcou": "D", "gab": "C", "tema": "Contribuição residual da seguridade social", "lição": "Nova fonte de custeio (competência residual) exige lei complementar (CF, art. 195, §4º, c/c art. 154, I) e obedece só à anterioridade nonagesimal (art. 195, §6º), não à anual. Não há reserva de iniciativa do Presidente em matéria tributária."}, {"q": 17, "disc": "Direito Administrativo", "marcou": "E", "gab": "D", "tema": "Agências reguladoras — Lei 13.848/2019", "lição": "Atos normativos conjuntos entre agências (art. 29) não dependem de aprovação prévia dos setores regulados. Devem prever fiscalização e solução de controvérsias, admitindo mediação ou arbitragem por comissão de representantes das agências; articulação com órgãos ambientais por convênios (art. 33)."}, {"q": 19, "disc": "Direito Administrativo", "marcou": "C", "gab": "E", "tema": "Órgãos públicos", "lição": "Órgãos não têm personalidade jurídica, mas a jurisprudência reconhece capacidade judiciária aos órgãos de cúpula para defender prerrogativas institucionais (ex.: Súmula 525/STJ — Câmara de Vereadores). A classificação 'supremos e subalternos' não é a dicotomia doutrinária usual (independentes, autônomos, superiores e subalternos)."}, {"q": 24, "disc": "Direito Administrativo", "marcou": "E", "gab": "A", "tema": "Indisponibilidade de bens na improbidade", "lição": "Após a Lei 14.230/2021, a indisponibilidade exige demonstração de perigo de dano (art. 16, §3º), superando o periculum in mora presumido do STJ; não abrange multa civil (§10); poupa bem de família e até 40 salários mínimos (§§13–14); a constrição pode ser desigual entre os réus desde que o somatório não exceda o valor indicado."}, {"q": 26, "disc": "Direito Administrativo", "marcou": "C", "gab": "D", "tema": "Diálogo competitivo — Lei 14.133/2021", "lição": "O diálogo competitivo (art. 32) é restrito a objetos que envolvam inovação ou soluções não disponíveis no mercado; se ETP e TR acharam soluções prontas, bens e serviços comuns impõem o pregão (art. 29)."}, {"q": 27, "disc": "Noções Gerais e Formação Humanística", "marcou": "C", "gab": "E", "tema": "Sociologia jurídica", "lição": "Atenção às inversões típicas da FGV: controle social formal é o das leis e instituições (o informal vem dos costumes); fato social como coerção externa é Durkheim, não Weber; o dogmático parte da norma, o zetético problematiza."}, {"q": 32, "disc": "Noções Gerais e Formação Humanística", "marcou": "C", "gab": "E", "tema": "Precedentes — CPC, arts. 926 e 927", "lição": "Os três itens eram corretos: dever de uniformizar diante de divergência interna; superação com fundamentação adequada e possibilidade de modulação (art. 927, §§3º e 4º); coerência e integridade como base da universalização."}, {"q": 36, "disc": "Direitos Humanos", "marcou": "C", "gab": "E", "tema": "Povos indígenas — Convenção 169 da OIT", "lição": "A Convenção 169/OIT (1989) adotou a autoidentificação como critério fundamental (art. 1.2). A Convenção 107 (1957) era integracionista. A Declaração da ONU (2007) antecedeu a Declaração Americana (2016)."}, {"q": 38, "disc": "Direitos Humanos", "marcou": "A", "gab": "E", "tema": "Casos do Brasil na Corte IDH", "lição": "O caso Honorato e outros vs. Brasil (2023) refere-se à 'Operação Castelinho' (PM/SP, 2002). Memorize a tabela de casos contra o Brasil (ver Série 1)."}, {"q": 39, "disc": "Direito Processual Civil", "marcou": "C", "gab": "D", "tema": "Arbitragem — poderes do árbitro", "lição": "O árbitro decide, instrui e pode modificar ou revogar tutela concedida pelo Judiciário (Lei 9.307, art. 22-B), mas não tem coerção direta: depende do juiz togado via carta arbitral (arts. 22, §2º, e 22-C)."}, {"q": 41, "disc": "Direito Processual Civil", "marcou": "A", "gab": "B", "tema": "Petição inicial", "lição": "Há procedimentos com pedido oral (Juizados — Lei 9.099, art. 14), logo não é em 'todos' que a inicial é escrita. Em execução fiscal, a falta de CPF/CNPJ não leva ao indeferimento (Súmula 558/STJ). Pedido genérico nas ações universais é admitido (CPC, art. 324, §1º, I)."}, {"q": 44, "disc": "Direito Processual Civil", "marcou": "E", "gab": "D", "tema": "Ação civil pública por associação", "lição": "Na ACP, a associação age como substituta processual e dispensa autorização assemblear; o juiz pode dispensar a pré-constituição de 1 ano quando houver manifesto interesse social (Lei 7.347, art. 5º, §4º)."}, {"q": 51, "disc": "Direito Civil", "marcou": "C", "gab": "A", "tema": "Perda da coisa certa por culpa do devedor", "lição": "Antes da tradição, se a coisa se perde por culpa do devedor, o credor pode exigir o equivalente mais perdas e danos (CC, art. 234). O 'equivalente' é o valor da coisa, não necessariamente o preço pago."}, {"q": 53, "disc": "Direito Civil", "marcou": "B", "gab": "E", "tema": "Doação — validade", "lição": "São válidas a doação ao nascituro, aceita pelo representante (art. 542); ao absolutamente incapaz, se pura, com dispensa de aceitação (art. 543); a entidade futura, que caduca se não constituída em 2 anos (art. 554); e à prole eventual."}, {"q": 59, "disc": "Direito Civil", "marcou": "B", "gab": "A", "tema": "Solidariedade não se presume", "lição": "A cláusula de solidariedade ativa beneficiava os compradores como credores do veículo, e não os vinculava como devedores do preço. Sem solidariedade passiva (art. 265), a obrigação divisível se reparte (art. 257): quem pagou sua metade está quite."}, {"q": 61, "disc": "Direito Civil", "marcou": "A", "gab": "D", "tema": "Pagamento indevido", "lição": "Quem pagou voluntariamente o indevido deve provar que o fez por erro (CC, art. 877)."}, {"q": 64, "disc": "Direito Empresarial", "marcou": "D", "gab": "E", "tema": "Cancelamento de protesto", "lição": "STJ, Tema 725: protestado regularmente o título, cabe ao devedor providenciar o cancelamento após a quitação, salvo pactuação em contrário — inclusive em relação de consumo."}, {"q": 67, "disc": "Direito Empresarial", "marcou": "D", "gab": "C", "tema": "Sociedade em comum", "lição": "A sociedade é representada em juízo por quem administra seus bens (CPC, art. 75, IX). O art. 988 do CC diz que os SÓCIOS são titulares em comum do patrimônio especial; incluir 'a sociedade' torna a assertiva falsa."}, {"q": 70, "disc": "Direito Penal", "marcou": "D", "gab": "B", "tema": "Estelionato x apropriação de coisa havida por erro", "lição": "Quem provoca ou mantém o erro da vítima por fraude para obter a coisa comete estelionato (art. 171). O art. 169 pressupõe erro espontâneo, sem fraude anterior do agente."}, {"q": 72, "disc": "Direito Penal", "marcou": "D", "gab": "E", "tema": "Injúria por religião e racismo", "lição": "Após a Lei 14.532/2023, a injúria por religião continua no CP (art. 140, §3º, injúria qualificada), e a injúria por raça, cor, etnia ou procedência nacional foi para a Lei 7.716 (art. 2º-A). Impedir o uso de elevador social por motivo de religião é racismo (Lei 7.716, art. 11 c/c art. 1º)."}, {"q": 73, "disc": "Direito Penal", "marcou": "A", "gab": "C", "tema": "Concurso de crimes", "lição": "Concurso formal impróprio = ação dolosa e desígnios autônomos, com penas somadas (art. 70, 2ª parte). O crime continuado contra a vida é admitido (art. 71, parágrafo único). O 'concurso material benéfico' é um limite ao concurso formal (art. 70, parágrafo único), e não o inverso."}, {"q": 75, "disc": "Direito Penal", "marcou": "A", "gab": "B", "tema": "Iter criminis", "lição": "Arma desmuniciada = crime impossível por ineficácia absoluta do meio (art. 17). O arrependimento eficaz só beneficia se o resultado for evitado (art. 15); se a vítima morre, há homicídio consumado. A desistência é voluntária mesmo motivada por dinheiro: basta ser voluntária, não precisa ser espontânea."}, {"q": 76, "disc": "Direito Penal", "marcou": "B", "gab": "A", "tema": "Criminologia", "lição": "A associação diferencial (Sutherland) explica o crime como comportamento aprendido e afasta a origem genética. Os crimes do colarinho branco ocorrem no exercício da profissão e têm cifra negra (ou dourada) elevadíssima."}, {"q": 78, "disc": "Direito Penal", "marcou": "C", "gab": "B", "tema": "Peculato culposo e crimes contra a Administração", "lição": "Peculato culposo: a reparação do dano antes da sentença irrecorrível extingue a punibilidade; depois dela, reduz a pena pela metade (art. 312, §3º). A progressão nos crimes contra a Administração exige reparação do dano (art. 33, §4º). O peculato abrange bem particular sob posse do funcionário."}]}};

function cadRound(r){return {tipo:"round",id:r.id,titulo:`Round ${r.num}`,qs:r.qids.map((id,i)=>({...BQ[id],n:i+1})).filter(q=>q.id),R:r}}
function cadSim(id){if(!ST.sims[id])ST.sims[id]={a:{},cur:1,modo:"prova",fim:false,seg:0,ini:new Date().toISOString()};return {tipo:"sim",id,titulo:`Simulado ${id.slice(1)}`,qs:D.sims[id],R:ST.sims[id]}}
const corrigida=(R,q)=>R.fim||(R.modo==="estudo"&&R.a[q.n]!==undefined);
function stats(c){const{qs,R}=c;let ac=0,resp=0,corr=0;const por={},niv={};
 qs.forEach(q=>{const k=cur(q.disc);const a=R.a[q.n];if(a===undefined&&!R.fim)return;
  // round finalizado: conta só as respondidas; simulado finalizado: em branco conta erro
  if(a===undefined&&c.tipo==="round")return;
  por[k]=por[k]||{t:0,a:0};niv[q.nivel]=niv[q.nivel]||{t:0,a:0};
  if(a!==undefined)resp++; if(corrigida(R,q)||a===undefined){corr++;por[k].t++;niv[q.nivel].t++;if(a===q.c){ac++;por[k].a++;niv[q.nivel].a++}}});
 return {ac,resp,corr,tot:qs.length,por,niv}}
/* respondidas no banco (para 'só inéditas para mim') */
function respondidasBanco(){const s=new Set();ST.rounds.forEach(r=>r.qids.forEach((id,i)=>{if(r.a[i+1]!==undefined)s.add(id)}));return s}
/* ---------- UI helpers ---------- */
function ring(p,big,small,size=150,col){const r=60,C=2*Math.PI*r,off=C*(1-p/100);return `<svg style="width:${size}px;height:${size}px;display:block;margin:auto" viewBox="0 0 150 150"><circle cx="75" cy="75" r="${r}" fill="none" stroke="#ebe5d8" stroke-width="13"/><circle cx="75" cy="75" r="${r}" fill="none" stroke="${col||cor(p)}" stroke-width="13" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}" transform="rotate(-90 75 75)"/><text x="75" y="77" text-anchor="middle" font-family="Fraunces,Georgia" font-size="31" font-weight="600" fill="#15213a">${big}</text><text x="75" y="100" text-anchor="middle" font-family="Inter" font-size="12" fill="#8a90a0">${small}</text></svg>`}
function bars(obj){const e=Object.entries(obj).filter(([k,v])=>v.t>0);if(!e.length)return '<p class="note" style="margin:0">Ainda sem dados.</p>';return e.map(([k,v])=>{const p=pct(v.a,v.t);return `<div class="bar"><div>${esc(k)} <span class="note">${v.a}/${v.t}</span></div><div class="trk"><div class="fil" style="width:${p}%;background:${cor(p)}"></div><div class="mk70" style="left:70%"></div></div><div class="pv">${p}%</div></div>`}).join("")}
function modal(html){$("modalc").innerHTML=html;$("modal").classList.add("on")}

 const d=diasAte();$("cd").innerHTML=d>0?`Faltam <b>${d} dias</b> · 29/11`:d===0?"<b>Hoje é o dia. Boa prova!</b>":"<b>ENAM concluído</b>";

  <div class="card"><p class="kick">Acerto nos rounds</p><div class="stat" style="color:${T?cor(pct(A,T)):"var(--navy)"}">${T?pct(A,T)+"<small>%</small>":"—"}</div><p class="note">${fin.length} round(s) finalizado(s) · meta 70%. <a href="#evolucao">Ver evolução →</a></p></div>
  <div class="card"><p class="kick">Erros a revisar</p><div class="stat">${coletar().filter(e=>!ST.rev[e.key]).length}</div><p class="note"><a href="#erros">Abrir caderno de erros →</a></p></div>
 </div>
 <p class="note" style="margin-top:22px">Questões <span class="chip fgv">ENAM</span> são de provas anteriores da FGV, com comentários nossos. As <span class="chip">Inédita</span> foram elaboradas no padrão da banca, cobrindo o edital do 6º ENAM. Banco atualizado em ${D.gerado}.</p>`;
 const upd=()=>{const base={...ST.cfg,discs:[]};const cnt={};filtrar(base).forEach(q=>{const k=cur(q.disc);cnt[k]=(cnt[k]||0)+1});
  $("oD").querySelectorAll("button").forEach(x=>{const v=x.dataset.v;const n=v==="__todas"?Object.values(cnt).reduce((s,y)=>s+y,0):(cnt[v]||0);x.innerHTML=`${v==="__todas"?"Todas":v} <span style="opacity:.6;font-weight:500">· ${n}</span>`;});
  const pool=filtrar(ST.cfg);$("disp").textContent=pool.length?`${pool.length} questões novas disponíveis com esses filtros`:"Você já fez todas as questões disponíveis com esses filtros. Chegam questões novas todos os dias."};
 const tog=(box,key,multi)=>$(box).onclick=e=>{const b=e.target.closest("button");if(!b)return;let v=b.dataset.v;if(key==="n")v=+v;
  if(multi&&v==="__todas"){ST.cfg[key]=[]}
  else if(multi){const a=ST.cfg[key];ST.cfg[key]=a.includes(v)?a.filter(x=>x!==v):[...a,v]}else ST.cfg[key]=v;save();
  $(box).querySelectorAll("button").forEach(x=>x.classList.toggle("on",multi?(x.dataset.v==="__todas"?!ST.cfg[key].length:ST.cfg[key].includes(x.dataset.v)):String(ST.cfg[key])===x.dataset.v));upd()};
 tog("oN","n");tog("oD","discs",true);tog("oO","orig");tog("oM","modo");

 const nv=$("novo");if(nv)nv.onclick=novoRound; const nt=$("novoTop");if(nt)nt.onclick=()=>$("cfgbox").scrollIntoView({behavior:"smooth"});

}
function filtrar(cfg,soNovas=true){const feitas=soNovas?respondidasBanco():new Set();return D.banco.filter(q=>!feitas.has(q.id)&&(!cfg.discs.length||cfg.discs.includes(cur(q.disc)))&&(cfg.orig==="todas"||(cfg.orig==="fgv")===(q.origem!=="Inédita")))}
function novoRound(){const cfg=ST.cfg;let pool=filtrar(cfg);if(!pool.length){modal(`<p style="margin-top:0">Você já fez todas as questões disponíveis com esses filtros. Novas questões entram no banco todos os dias. Enquanto isso, que tal revisar o caderno de erros?</p><button class="btn sm" onclick="fecha()">Ok</button>`);return}
 const ord=q=>Math.random();
 let n=cfg.n||pool.length; n=Math.min(n,pool.length);
 // proporcional à prova
 const grupos={};pool.forEach(q=>{(grupos[cur(q.disc)]=grupos[cur(q.disc)]||[]).push(q)});
 Object.values(grupos).forEach(g=>g.sort((a,b)=>ord(a)-ord(b)));
 const ks=Object.keys(grupos),W=ks.reduce((s,k)=>s+PESO[k],0);const quota={};ks.forEach(k=>quota[k]=Math.min(grupos[k].length,Math.floor(n*PESO[k]/W)));
 let falta=n-Object.values(quota).reduce((a,b)=>a+b,0);
 while(falta>0){const k=ks.filter(k=>quota[k]<grupos[k].length).sort((a,b)=>(quota[a]/PESO[a])-(quota[b]/PESO[b]))[0];if(!k)break;quota[k]++;falta--}
 const sel=DISCS.filter(k=>grupos[k]).flatMap(k=>shuffle(grupos[k].slice(0,quota[k])));
 const r={id:Date.now().toString(36),num:ST.rounds.length+1,ini:new Date().toISOString(),qids:sel.map(q=>q.id),a:{},cur:1,modo:cfg.modo,fim:false,seg:0,filtro:{...cfg}};
 ST.rounds.push(r);save();location.hash="round-"+r.id}

let CAD=null;

 const q=qs[Math.min(R.cur,qs.length)-1];const show=corrigida(R,q);const a=R.a[q.n];const s=stats(c);const nresp=Object.keys(R.a).length;
 const segs=qs.map(x=>{const v=R.a[x.n];let col="transparent";if(v!==undefined)col=corrigida(R,x)?(v===x.c?"var(--ok)":"var(--bad)"):"var(--navy2)";return `<i style="width:${100/qs.length}%;background:${col}"></i>`}).join("");
 const grid=qs.map(x=>{let cl=x.n===R.cur?"cur ":"";const v=R.a[x.n];if(v!==undefined)cl+=corrigida(R,x)?(v===x.c?"ok":"bad"):"ans";return `<button class="${cl}" data-n="${x.n}">${x.n}</button>`}).join("");

  const cm=show?`<div class="com">${q.coms[i].startsWith("CORRETA")?"<b>CORRETA.</b>"+esc(q.coms[i].replace(/^CORRETA[^.]*\.?/,"")):esc(q.coms[i])}</div>`:"";
  return `<button class="${cl}" data-i="${i}"><span class="L">${L[i]}</span>${esc(t)}${cm}</button>`}).join("");
 const fb=show&&a!==undefined?`<div class="fb ${a===q.c?'ok':'bad'}">${a===q.c?"✓ Você acertou.":"✗ Você marcou "+L[a]+". Gabarito: "+L[q.c]+"."}</div>`:(show&&a===undefined?`<div class="fb bad">Em branco. Gabarito: ${L[q.c]}.</div>`:"");
 const nv=NIV[q.nivel]||"m";

 ${R.fim?painel(c):""}
